 horizontal force on Y is the friction from X: f = ma = (1)(2) = 2 N to the right.<br>By Newton's third law, the friction on X by Y is 2 N to the <b>left</b>.<br>Answer <b>A</b>.","C":"整個系統（3 kg）：a = (9 − 3)/3 = 2 m s<sup>−2</sup>，向右。<br>Y 在水平方向只受 X 的摩擦力：f = ma = (1)(2) = 2 N，向右。<br>根據牛頓第三定律，Y 施於 X 的摩擦力為 2 N，向<b>左</b>。<br>答案 <b>A</b>。"}},{"id":"OA-2023S2-09","p":"1A","s":2023,"n":"9","t":"mech","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"Figure a (total mass 3m): F − 3mg = 3m(3g) ⇒ F = 12mg.<br>Figure b (mass 2m): F − 2mg = 2ma ⇒ 12mg − 2mg = 2ma ⇒ a = 5g.<br>Answer <b>C</b>.","C":"圖 a（總質量 3m）：F − 3mg = 3m(3g) ⇒ F = 12mg。<br>圖 b（質量 2m）：F − 2mg = 2ma ⇒ 12mg − 2mg = 2ma ⇒ a = 5g。<br>答案 <b>C</b>。"}},{"id":"OA-2023S2-10","p":"1A","s":2023,"n":"10","t":"mech","x":false,"a":"B","pub":"OUP","st":2,"ex":{"E":"The firefighter is in equilibrium under three forces: his weight (vertical, through the c.g.), the rope tension (along the rope, up towards the top of the wall) and the reaction from the wall at O. Three non-parallel forces in equilibrium must pass through one point.<br>The line of the weight and the line of the rope meet at a point above and to the right of O, so the wall's reaction points from O up and to the right, i.e. along OM. (Check: the wall must push him away from the wall to balance the rope's pull towards it, and push up to help support his weight.)<br>Answer <b>B</b>.","C":"消防員在三個力作用下平衡：重量（豎直，通過重心）、繩的張力（沿繩向牆頂）、牆在 O 點的反作用力。三個不平行的力平衡時必須相交於同一點。<br>重量的作用線與繩的作用線交於 O 點右上方的一點，所以牆的反作用力由 O 指向右上方，即沿 OM。（核對：牆須把他推離牆壁，以平衡繩把他拉向牆的分力，並向上推以承托部分重量。）<br>答案 <b>B</b>。"}},{"id":"OA-2023S2-11","p":"1A","s":2023,"n":"11","t":"mech","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"(1) Correct: momentum is conserved during the push: m<sub>P</sub>v<sub>P</sub> = m<sub>Q</sub>v<sub>Q</sub>. P is heavier, so Q moves faster.<br>(2) Incorrect: KE = p<sup>2</sup>/(2m). With equal momentum, the lighter Q has more KE and rises higher.<br>(3) Incorrect: once the trolleys move up the curved track, the track exerts forces with horizontal components (and gravity acts), so the total momentum is no longer zero.<br>Answer <b>A</b>.","C":"(1) 正確：彈開時動量守恆：m<sub>P</sub>v<sub>P</sub> = m<sub>Q</sub>v<sub>Q</sub>。P 較重，所以 Q 較快。<br>(2) 不正確：動能 = p<sup>2</sup>/(2m)。動量相同時，較輕的 Q 動能較大，升得較高。<br>(3) 不正確：小車沿彎曲軌道上升時，軌道施加的力有水平分量（亦有重力），總動量不再為零。<br>答案 <b>A</b>。"}},{"id":"OA-2023S2-12","p":"1A","s":2023,"n":"12","t":"mech","x":true,"a":"B","pub":"OUP","st":2,"ex":{"E":"At X (on a slope): F<sub>X</sub> = mg cos θ &lt; mg.<br>At Z (horizontal, no vertical acceleration): F<sub>Z</sub> = mg.<br>At Y (bottom of a circular dip): F<sub>Y</sub> − mg = mv<sup>2</sup>/r ⇒ F<sub>Y</sub> &gt; mg.<br>So F<sub>X</sub> &lt; F<sub>Z</sub> &lt; F<sub>Y</sub>.<br>Answer <b>B</b>.","C":"X（斜面上）：F<sub>X</sub> = mg cos θ &lt; mg。<br>Z（水平、沒有豎直加速度）：F<sub>Z</sub> = mg。<br>Y（圓弧谷底）：F<sub>Y</sub> − mg = mv<sup>2</sup>/r ⇒ F<sub>Y</sub> &gt; mg。<br>故 F<sub>X</sub> &lt; F<sub>Z</sub> &lt; F<sub>Y</sub>。<br>答案 <b>B</b>。"}},{"id":"OA-2023S2-13","p":"1A","s":2023,"n":"13","t":"mech","x":true,"a":"C","pub":"OUP","st":2,"ex":{"E":"Surface g = GM/R<sup>2</sup> ⇒ M = gR<sup>2</sup>/G. M<sub>E</sub>/M<sub>M</sub> = (6)(4<sup>2</sup>) = 96.<br>Zero resultant field at O: GM<sub>E</sub>/OE<sup>2</sup> = GM<sub>M</sub>/OM<sup>2</sup> ⇒ OE/OM = √96 ≈ 9.8 ≈ 10.<br>OE : OM ≈ 10 : 1.<br>Answer <b>C</b>.","C":"表面 g = GM/R<sup>2</sup> ⇒ M = gR<sup>2</sup>/G。M<sub>地</sub>/M<sub>月</sub> = (6)(4<sup>2</sup>) = 96。<br>O 點合引力場為零：GM<sub>地</sub>/OE<sup>2</sup> = GM<sub>月</sub>/OM<sup>2</sup> ⇒ OE/OM = √96 ≈ 9.8 ≈ 10。<br>OE : OM ≈ 10 : 1。<br>答案 <b>C</b>。"}},{"id":"OA-2023S2-14","p":"1A","s":2023,"n":"14","t":"wave","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"(1) Reflection: the waves are reflected by the barrier.<br>(2) Diffraction: the waves bend around the ends of the barrier.<br>(3) Interference: the incident and reflected waves overlap and interfere.<br>All three can be observed.<br>Answer <b>D</b>.","C":"(1) 反射：水波被障礙物反射。<br>(2) 衍射：水波繞過障礙物的兩端。<br>(3) 干涉：入射波與反射波重疊而產生干涉。<br>三種現象都可觀察到。<br>答案 <b>D</b>。"}},{"id":"OA-2023S2-15","p":"1A","s":2023,"n":"15","t":"wave","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"Compare each particle with its equilibrium position: c, d, e, f crowd around e, which is undisplaced — e is the centre of a compression. d (left of e) is displaced to the right; f is displaced to the left by the largest amount, so f is at its maximum displacement and momentarily at rest.<br>d is displaced right and is moving left, i.e. its displacement is decreasing towards that of e. Each particle takes on the motion of its neighbour on the right, so the waveform moves to the <b>left</b>.<br>Answer <b>D</b>.","C":"比較各粒子與其平衡位置：c、d、e、f 聚在沒有位移的 e 附近，e 是密部中心。d（在 e 左方）向右偏移；f 向左偏移最多，處於最大位移，瞬時靜止。<br>d 向右偏移而正向左移，即位移正減小，變得與右方的 e 相近。各粒子重複其右方粒子的運動，所以波向<b>左</b>傳播。<br>答案 <b>D</b>。"}},{"id":"OA-2023S2-16","p":"1A","s":2023,"n":"16","t":"wave","x":false,"a":"B","pub":"OUP","st":2,"ex":{"E":"(1) Correct: three loops → 3 antinodes.<br>(2) Incorrect: 3 × (λ/2) = 1.2 m ⇒ λ = 0.8 m. v = fλ = 30 × 0.8 = 24 m s<sup>−1</sup>.<br>(3) Correct: at 40 Hz, λ = 24/40 = 0.6 m, so 1.2 m = 4 × (λ/2) → a stationary wave with 4 antinodes.<br>Answer <b>B</b>.","C":"(1) 正確：三個波環 → 3 個波腹。<br>(2) 不正確：3 × (λ/2) = 1.2 m ⇒ λ = 0.8 m。v = fλ = 30 × 0.8 = 24 m s<sup>−1</sup>。<br>(3) 正確：40 Hz 時 λ = 24/40 = 0.6 m，1.2 m = 4 × (λ/2) → 形成 4 個波腹的駐波。<br>答案 <b>B</b>。"}},{"id":"OA-2023S2-17","p":"1A","s":2023,"n":"17","t":"wave","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"Sound intensity level depends on the intensity at that position, and intensity ∝ (amplitude)<sup>2</sup>. A higher intensity level means a larger amplitude. Waveform (quality) and pitch (frequency) need not differ, and the speed of sound in air is the same for both.<br>Answer <b>D</b>.","C":"聲強級取決於該位置的聲強，而聲強 ∝（振幅）<sup>2</sup>。聲強級較高表示振幅較大。波形（音品）和音調（頻率）不一定不同，兩者在空氣中的聲速亦相同。<br>答案 <b>D</b>。"}},{"id":"OA-2023S2-18","p":"1A","s":2023,"n":"18","t":"wave","x":false,"a":"B","pub":"OUP","st":2,"ex":{"E":"(1) Incorrect: all waves, including ultrasound, transmit energy.<br>(2) Correct: UV is an electromagnetic wave and travels in a vacuum; ultrasound needs a medium.<br>(3) Incorrect: humans can neither see UV nor hear ultrasound.<br>Answer <b>B</b>.","C":"(1) 不正確：所有波（包括超聲波）都能傳遞能量。<br>(2) 正確：紫外輻射是電磁波，可在真空中傳播；超聲波需要介質。<br>(3) 不正確：人類既看不到紫外輻射，也聽不到超聲波。<br>答案 <b>B</b>。"}},{"id":"OA-2023S2-19","p":"1A","s":2023,"n":"19","t":"wave","x":true,"a":"A","pub":"OUP","st":2,"ex":{"E":"Grating: d sin θ = nλ. From red: d = 700 nm / sin 10° = 4031 nm.<br>(1) Correct: green 1st order: sin θ = 550/4031 ⇒ θ = 7.8° &lt; 10°.<br>(2) Incorrect: sin θ for red orders = 0.174n, for green = 0.136n. Green 4th (0.546) and 5th (0.682) have no red fringe between them (red 4th is at 0.694).<br>(3) Incorrect: n ≤ d/λ = 4031/700 = 5.8, so the highest red order is 5.<br>Answer <b>A</b>.","C":"光柵：d sin θ = nλ。由紅光：d = 700 nm / sin 10° = 4031 nm。<br>(1) 正確：綠光第一級 sin θ = 550/4031 ⇒ θ = 7.8° &lt; 10°。<br>(2) 不正確：紅光各級 sin θ = 0.174n，綠光 = 0.136n。綠光第 4 級（0.546）與第 5 級（0.682）之間沒有紅色亮紋（紅光第 4 級在 0.694）。<br>(3) 不正確：n ≤ d/λ = 4031/700 = 5.8，紅光最高級數是 5。<br>答案 <b>A</b>。"}},{"id":"OA-2023S2-20","p":"1A","s":2023,"n":"20","t":"wave","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"A plane mirror facing the paper reverses left and right (laterally inverted) but keeps top and bottom. In the image, Q is top-left and P is top-right, S is bottom-left and R is bottom-right. Swapping left and right back: P top-left, Q top-right, R bottom-left, S bottom-right.<br>Answer <b>D</b>.","C":"平面鏡的像左右倒置，上下不變。像中 Q 在左上、P 在右上、S 在左下、R 在右下。把左右換回來：P 在左上、Q 在右上、R 在左下、S 在右下。<br>答案 <b>D</b>。"}},{"id":"OA-2023S2-21","p":"1A","s":2023,"n":"21","t":"wave","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"The two faces of the block are parallel, so each ray emerges <b>parallel</b> to its incident direction (rules out D), only shifted sideways.<br>Violet has the larger refractive index, so it bends more inside the glass and its sideways shift is slightly larger than red's. Since the indices differ by only 3%, the emerging rays stay parallel to the incident ones and their separation changes only slightly — the violet ray is shifted a little further from the red ray.<br>Answer <b>C</b>.","C":"玻璃塊兩面平行，所以每條光線射出時與入射方向<b>平行</b>（排除 D），只是側向位移。<br>紫光折射率較大，在玻璃中偏折較多，側向位移比紅光稍大。由於折射率只相差 3%，射出的光線仍與入射光線平行，兩者的間距只略為改變——紫光與紅光的距離稍為拉開。<br>答案 <b>C</b>。"}},{"id":"OA-2023S2-22","p":"1A","s":2023,"n":"22","t":"em","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"(1) Possible: with the negative charge between two positive charges, each outer charge is attracted inwards by −Q<sub>Z</sub> and repelled outwards by the other positive charge; with suitable magnitudes all forces balance.<br>(2) Impossible: +Q<sub>Y</sub> in the middle is repelled by +Q<sub>X</sub> (pushed right) and attracted by −Q<sub>Z</sub> (pulled right) — both forces point the same way.<br>(3) Impossible: −Q<sub>Z</sub> is attracted towards both +Q<sub>X</sub> and +Q<sub>Y</sub>; both forces have upward components, so they cannot cancel.<br>Answer <b>A</b>.","C":"(1) 可能：負電荷在兩個正電荷之間，外側每個電荷被 −Q<sub>Z</sub> 向內吸、被另一個正電荷向外推，大小適當時各力可平衡。<br>(2) 不可能：中間的 +Q<sub>Y</sub> 被 +Q<sub>X</sub> 推向右，又被 −Q<sub>Z</sub> 吸向右，兩力同向。<br>(3) 不可能：−Q<sub>Z</sub> 同時被 +Q<sub>X</sub> 和 +Q<sub>Y</sub> 吸引，兩力都有向上分量，不能抵消。<br>答案 <b>A</b>。"}},{"id":"OA-2023S2-23","p":"1A","s":2023,"n":"23","t":"em","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"X and Y are both connected directly across the battery, so they are in parallel with the same voltage V.<br>P = V<sup>2</sup>/R: R<sub>X</sub> = V<sup>2</sup>/4 = R, R<sub>Y</sub> = V<sup>2</sup>/8 = R/2.<br>Equivalent resistance = (R)(R/2)/(R + R/2) = R/3.<br>Answer <b>A</b>.","C":"X 和 Y 都直接接在電池兩端，兩者並聯，電壓同為 V。<br>P = V<sup>2</sup>/R：R<sub>X</sub> = V<sup>2</sup>/4 = R，R<sub>Y</sub> = V<sup>2</sup>/8 = R/2。<br>等效電阻 = (R)(R/2)/(R + R/2) = R/3。<br>答案 <b>A</b>。"}},{"id":"OA-2023S2-24","p":"1A","s":2023,"n":"24","t":"em","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"X is in series with the rest of the circuit: [P in series with (Q ∥ R)] in parallel with S. X becomes brighter when the total resistance falls, so that more current flows through X.<br>Short-circuiting P, Q or S each lowers the resistance of the network → X brighter. (Shorting S shorts out the whole network, giving X the full battery voltage.)<br>Answer <b>D</b>.","C":"X 與電路其餘部分串聯：[P 與 (Q ∥ R) 串聯] 再與 S 並聯。總電阻下降時通過 X 的電流增加，X 變亮。<br>把 P、Q 或 S 短路都會令網絡電阻下降 → X 變亮。（短路 S 會把整個網絡短路，X 得到全部電池電壓。）<br>答案 <b>D</b>。"}},{"id":"OA-2023S2-25","p":"1A","s":2023,"n":"25","t":"em","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"For the same battery (negligible internal resistance), P = ε<sup>2</sup>/R<sub>total</sub>, so the arrangement with the smallest total resistance consumes the most power. Connecting all three in parallel gives a resistance smaller than any single resistor — the smallest of all arrangements.<br>Answer <b>D</b>.","C":"同一電池（內阻可略）下 P = ε<sup>2</sup>/R<sub>總</sub>，總電阻最小的組合消耗最多功率。三個電阻並聯時，總電阻比任何一個電阻都小，是各組合中最小的。<br>答案 <b>D</b>。"}},{"id":"OA-2023S2-26","p":"1A","s":2023,"n":"26","t":"em","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"The ideal voltmeter draws no current, so the current I in the wire MN is constant, whatever the position of O. The voltmeter measures the p.d. across NO = I × resistance of NO ∝ length NO = L − OM.<br>So V decreases linearly with OM and reaches zero when OM = L (O at N). At OM = 0 it reads the terminal p.d. across the whole wire.<br>Answer <b>A</b>.","C":"理想伏特計不取電流，所以不論 O 在哪裏，金屬線 MN 的電流 I 不變。伏特計量度 NO 兩端的電勢差 = I × NO 段的電阻 ∝ NO 長度 = L − OM。<br>所以 V 隨 OM 線性下降，OM = L（O 在 N）時為零；OM = 0 時讀數是整條金屬線兩端的端電壓。<br>答案 <b>A</b>。"}},{"id":"OA-2023S2-27","p":"1A","s":2023,"n":"27","t":"em","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"All four wires are the same distance from O, so the field from each ∝ its current: B, 3B, 2B and 4B. Using the right-hand grip rule:<br>• PQ (I, to the right, above O): into the paper, B.<br>• bottom wire (3I, to the left, below O): into the paper, 3B.<br>• left wire (2I, upward, left of O): into the paper, 2B.<br>• right wire (4I, upward, right of O): out of the paper, 4B.<br>Resultant = B + 3B + 2B − 4B = 2B, into the paper.<br>Answer <b>A</b>.","C":"四條導線與 O 的距離相同，各自在 O 的磁場 ∝ 電流：B、3B、2B 和 4B。用右手握拳定則：<br>• PQ（I，向右，在 O 上方）：指入頁面，B。<br>• 底部導線（3I，向左，在 O 下方）：指入頁面，3B。<br>• 左方導線（2I，向上，在 O 左方）：指入頁面，2B。<br>• 右方導線（4I，向上，在 O 右方）：指出頁面，4B。<br>合磁場 = B + 3B + 2B − 4B = 2B，指入頁面。<br>答案 <b>A</b>。"}},{"id":"OA-2023S2-28","p":"1A","s":2023,"n":"28","t":"em","x":true,"a":"B","pub":"OUP","st":2,"ex":{"E":"The particle enters the field moving right and is deflected upward to T. With B into the paper, Fleming's left-hand rule gives an upward force on a <b>positive</b> charge.<br>To reach S it must bend more, i.e. move in a smaller circle: r = mv/(qB) ⇒ v must be smaller. Since qV = ½mv<sup>2</sup>, V must <b>decrease</b>.<br>Answer <b>B</b>.","C":"粒子向右進入磁場後向上偏轉至 T。磁場指入頁面，用佛林明左手定則可知<b>正</b>電荷受向上的力。<br>要到達 S 須偏轉得更多，即圓周半徑較小：r = mv/(qB) ⇒ v 須較小。由於 qV = ½mv<sup>2</sup>，V 須<b>減小</b>。<br>答案 <b>B</b>。"}},{"id":"OA-2023S2-29","p":"1A","s":2023,"n":"29","t":"em","x":true,"a":"A","pub":"OUP","st":2,"ex":{"E":"(1) Incorrect: N<sub>p</sub>/N<sub>s</sub> &lt; 20 would give an output <b>higher</b> than 240/20 = 12 V.<br>(2) Correct: if some flux from the primary does not link the secondary, the induced e.m.f. in the secondary is smaller.<br>(3) Incorrect: eddy currents waste energy as heat (lowering efficiency), but they are not the reason the voltage ratio is lower.<br>Answer <b>A</b>.","C":"(1) 不正確：N<sub>原</sub>/N<sub>副</sub> &lt; 20 會令輸出<b>高於</b> 240/20 = 12 V。<br>(2) 正確：若原線圈部分磁通量沒有穿過副線圈，副線圈的感生電動勢會較小。<br>(3) 不正確：渦電流令能量以熱的形式損失（效率下降），但不是電壓比較低的原因。<br>答案 <b>A</b>。"}},{"id":"OA-2023S2-30","p":"1A","s":2023,"n":"30","t":"em","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"By Lenz's law the induced current always opposes the relative motion.<br>• As the magnet falls towards the ring, the ring repels it, so the ring is pushed <b>down</b> → tension &gt; T.<br>• When the magnet is in the middle of the ring, the flux is momentarily not changing → tension = T.<br>• As the magnet leaves below, the ring attracts it, so the ring is pulled <b>down</b> again → tension &gt; T.<br>Two peaks above T → <b>C</b>.","C":"根據楞次定律，感生電流總是反抗相對運動。<br>• 磁棒落向銅環時，銅環推斥磁棒，自己被推<b>向下</b> → 張力 &gt; T。<br>• 磁棒在銅環中央時，磁通量瞬間沒有變化 → 張力 = T。<br>• 磁棒從下方離開時，銅環吸引磁棒，自己又被拉<b>向下</b> → 張力 &gt; T。<br>兩個高於 T 的峰 → <b>C</b>。"}},{"id":"OA-2023S2-31","p":"1A","s":2023,"n":"31","t":"nuc","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"(1) Correct: Q = Pu-239 + n = Pu-240, an isotope of plutonium.<br>(2) Incorrect: balancing the equation, R has A = 240 − 103 − 3 = 134 and Z = 94 − 40 = 54, so R (Xe-134) is heavier than Zr-103.<br>(3) Correct: each fission releases 3 neutrons, which can cause further fissions.<br>Answer <b>C</b>.","C":"(1) 正確：Q = 鈈-239 + n = 鈈-240，是鈈的同位素。<br>(2) 不正確：平衡方程，R 的 A = 240 − 103 − 3 = 134，Z = 94 − 40 = 54，所以 R（氙-134）比鋯-103 重。<br>(3) 正確：每次裂變釋出 3 個中子，可引發更多裂變。<br>答案 <b>C</b>。"}},{"id":"OA-2023S2-32","p":"1A","s":2023,"n":"32","t":"nuc","x":false,"a":"B","pub":"OUP","st":2,"ex":{"E":"α particles are stopped by the paper wrapping, so only γ rays reach the film.<br>(1) Correct: γ rays pass through the thin aluminium almost unchanged, so O and P are blackened about equally.<br>(2) Correct: lead absorbs part of the γ radiation, so P is darker than Q.<br>(3) Incorrect: γ rays pass through the plastic case too, so the rest of the film is also blackened.<br>Answer <b>B</b>.","C":"α 粒子被包裹菲林的紙阻擋，只有 γ 射線到達菲林。<br>(1) 正確：γ 射線幾乎不受薄鋁片影響，O 和 P 變黑程度相若。<br>(2) 正確：鉛片吸收部分 γ 輻射，P 比 Q 黑。<br>(3) 不正確：γ 射線亦會穿過塑膠外殼，菲林其他部分同樣會變黑。<br>答案 <b>B</b>。"}},{"id":"OA-2023S2-33","p":"1A","s":2023,"n":"33","t":"nuc","x":true,"a":"B","pub":"OUP","st":2,"ex":{"E":"Mass of 2 protons + 2 neutrons = 2(1.0073) + 2(1.0087) = 4.0320 u, which is more than the α particle (4.00151 u). Energy must be <b>absorbed</b> to break it up.<br>Δm = 4.0320 − 4.00151 = 0.03049 u → E = 0.03049 × 931 = 28.4 MeV = 28.4 × 10<sup>6</sup> × 1.6 × 10<sup>−19</sup> = 4.54 × 10<sup>−12</sup> J.<br>Answer <b>B</b>.","C":"2 個質子 + 2 個中子的質量 = 2(1.0073) + 2(1.0087) = 4.0320 u，比 α 粒子（4.00151 u）大，所以拆開時須<b>吸收</b>能量。<br>Δm = 4.0320 − 4.00151 = 0.03049 u → E = 0.03049 × 931 = 28.4 MeV = 28.4 × 10<sup>6</sup> × 1.6 × 10<sup>−19</sup> = 4.54 × 10<sup>−12</sup> J。<br>答案 <b>B</b>。"}},{"id":"OP-2023S2-11","p":"P2","s":2023,"n":"1.1","t":"ast","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"Voyager 1 travels at about 17 km s<sup>−1</sup>. In 46 years: 17 × 10<sup>3</sup> × 46 × 3.16 × 10<sup>7</sup> ≈ 2.5 × 10<sup>13</sup> m ≈ 160 AU.<br>14 pc and 45 ly are far beyond the Solar System (the nearest star is 1.3 pc away), and 2.0 × 10<sup>11</sup> m is only about 1.3 AU.<br>Answer <b>C</b>.","C":"航行者 1 號速率約 17 km s<sup>−1</sup>，46 年內：17 × 10<sup>3</sup> × 46 × 3.16 × 10<sup>7</sup> ≈ 2.5 × 10<sup>13</sup> m ≈ 160 AU。<br>14 pc 和 45 ly 遠超太陽系（最近的恆星也只是 1.3 pc），2.0 × 10<sup>11</sup> m 只約 1.3 AU。<br>答案 <b>C</b>。"}},{"id":"OP-2023S2-12","p":"P2","s":2023,"n":"1.2","t":"ast","x":false,"a":"B","pub":"OUP","st":2,"ex":{"E":"(1) Correct: Galileo observed the full cycle of phases of Venus, supporting the heliocentric model.<br>(2) Incorrect: elliptical orbits were Kepler's discovery.<br>(3) Correct: Galileo discovered four moons of Jupiter.<br>Answer <b>B</b>.","C":"(1) 正確：伽利略觀察到金星完整的相位變化，支持日心說。<br>(2) 不正確：行星軌道是橢圓形，是開普勒的發現。<br>(3) 正確：伽利略發現木星的四顆衛星。<br>答案 <b>B</b>。"}},{"id":"OP-2023S2-13","p":"P2","s":2023,"n":"1.3","t":"ast","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"Parallax p ∝ baseline/distance. The star is the same distance away; the baseline changes from 1 AU (Earth's orbital radius) to 2.3 × 10<sup>11</sup>/1.5 × 10<sup>11</sup> = 1.53 AU.<br>p = 0.10″ × 1.53 ≈ 0.15″.<br>Answer <b>C</b>.","C":"視差 p ∝ 基線/距離。恆星距離不變，基線由 1 AU（地球軌道半徑）變為 2.3 × 10<sup>11</sup>/1.5 × 10<sup>11</sup> = 1.53 AU。<br>p = 0.10″ × 1.53 ≈ 0.15″。<br>答案 <b>C</b>。"}},{"id":"OP-2023S2-14","p":"P2","s":2023,"n":"1.4","t":"ast","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"L = 4πR<sup>2</sup>σT<sup>4</sup> ⇒ R ∝ √L / T<sup>2</sup>.<br>From the graph, going from X to Y to Z the temperature halves each step while L rises by a factor of about 40. Each step R changes by √40 × 2<sup>2</sup> ≈ 25 — R increases.<br>So Z &gt; Y &gt; X.<br>Answer <b>A</b>.","C":"L = 4πR<sup>2</sup>σT<sup>4</sup> ⇒ R ∝ √L / T<sup>2</sup>。<br>從圖可見，由 X 到 Y 再到 Z，温度每次減半，光度增加約 40 倍。每一步 R 改變 √40 × 2<sup>2</sup> ≈ 25 倍——R 增大。<br>故 Z &gt; Y &gt; X。<br>答案 <b>A</b>。"}},{"id":"OP-2023S2-15","p":"P2","s":2023,"n":"1.5","t":"ast","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"P: longer wavelength (red shift) → moving away. Q: shorter wavelength (blue shift) → moving towards Earth.<br>Radial speed v = cΔλ/λ. Both shifts are 10 nm, but the hydrogen red line (≈ 656 nm) has a longer λ than the calcium violet line (≈ 393 nm), so |v<sub>P</sub>| &lt; |v<sub>Q</sub>|.<br>Answer <b>A</b>.","C":"P：波長變長（紅移）→ 遠離地球。Q：波長變短（藍移）→ 移向地球。<br>徑向速率 v = cΔλ/λ。兩者 Δλ 同為 10 nm，但氫紅線（約 656 nm）的 λ 比鈣紫線（約 393 nm）長，所以 |v<sub>P</sub>| &lt; |v<sub>Q</sub>|。<br>答案 <b>A</b>。"}},{"id":"OP-2023S2-16","p":"P2","s":2023,"n":"1.6","t":"ast","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"Let US = UV = d, so VS = √2 d. Brightness seen from the Sun (Earth) b = L/(4πr<sup>2</sup>).<br>b<sub>U</sub> ∝ (L<sub>☉</sub>/2)/d<sup>2</sup>; b<sub>V</sub> ∝ (L<sub>☉</sub>/4)/(2d<sup>2</sup>) = (L<sub>☉</sub>/8)/d<sup>2</sup>.<br>b<sub>U</sub>/b<sub>V</sub> = (1/2)/(1/8) = 4.<br>Answer <b>D</b>.","C":"設 US = UV = d，則 VS = √2 d。從太陽（地球）觀察的視亮度 b = L/(4πr<sup>2</sup>)。<br>b<sub>U</sub> ∝ (L<sub>☉</sub>/2)/d<sup>2</sup>；b<sub>V</sub> ∝ (L<sub>☉</sub>/4)/(2d<sup>2</sup>) = (L<sub>☉</sub>/8)/d<sup>2</sup>。<br>b<sub>U</sub>/b<sub>V</sub> = (1/2)/(1/8) = 4。<br>答案 <b>D</b>。"}},{"id":"OP-2023S2-17","p":"P2","s":2023,"n":"1.7","t":"ast","x":false,"a":"B","pub":"OUP","st":2,"ex":{"E":"Wien's law: λ<sub>max</sub>T = constant. P peaks at a shorter wavelength, so P is hotter than Q.<br>Spectral classes from hot to cool: O B A F G K M. Only option B (P: O, Q: K) has P hotter than Q.<br>Answer <b>B</b>.","C":"維恩定律：λ<sub>max</sub>T = 常數。P 的峰值波長較短，P 比 Q 熱。<br>光譜型由熱至冷：O B A F G K M。只有選項 B（P：O，Q：K）符合 P 比 Q 熱。<br>答案 <b>B</b>。"}},{"id":"OP-2023S2-18","p":"P2","s":2023,"n":"1.8","t":"ast","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"(1) Correct: beyond 15 kpc the observed speeds stay at about 250 km s<sup>−1</sup>, well above the predicted curve.<br>(2) Incorrect: the prediction already includes the visible stars; more stars would be seen.<br>(3) Correct: higher speeds need more gravitational pull, i.e. more mass than we can see — evidence for dark matter.<br>Answer <b>C</b>.","C":"(1) 正確：15 kpc 以外，觀測速率維持約 250 km s<sup>−1</sup>，遠高於預測曲線。<br>(2) 不正確：預測已計及可見的恆星；若有更多恆星應可觀察到。<br>(3) 正確：較高的速率需要更大的引力，即比可見物質更多的質量——暗物質的證據。<br>答案 <b>C</b>。"}},{"id":"OP-2023S2-21","p":"P2","s":2023,"n":"2.1","t":"atom","x":false,"a":"B","pub":"OUP","st":2,"ex":{"E":"Lower intensity → fewer photons per second → fewer photoelectrons → lower saturation current.<br>Higher frequency → larger K<sub>max</sub> = hf − Φ → a larger stopping voltage, so the current reaches zero at a more negative V.<br>The dotted graph that starts further left and levels off lower is <b>B</b>.","C":"強度較低 → 每秒光子數目較少 → 光電子較少 → 飽和電流較低。<br>頻率較高 → K<sub>max</sub> = hf − Φ 較大 → 截止電壓較大，電流在更負的 V 才降至零。<br>由較左方開始、飽和值較低的虛線圖是 <b>B</b>。"}},{"id":"OP-2023S2-22","p":"P2","s":2023,"n":"2.2","t":"atom","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"K<sub>max</sub> = hf − Φ.<br>3f: 9.0 = 3hf − Φ; 2f: 5.0 = 2hf − Φ. Subtracting: hf = 4.0 eV, so Φ = 3.0 eV.<br>At f: K<sub>max</sub> = 4.0 − 3.0 = 1.0 eV.<br>Answer <b>C</b>.","C":"K<sub>max</sub> = hf − Φ。<br>3f：9.0 = 3hf − Φ；2f：5.0 = 2hf − Φ。相減：hf = 4.0 eV，Φ = 3.0 eV。<br>頻率為 f 時：K<sub>max</sub> = 4.0 − 3.0 = 1.0 eV。<br>答案 <b>C</b>。"}},{"id":"OP-2023S2-23","p":"P2","s":2023,"n":"2.3","t":"atom","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"(1) Correct: the atom contains positive charges (in the nucleus) and negative electrons.<br>(2) Correct: all the positive charge (and almost all the mass) is in a tiny nucleus.<br>(3) Incorrect: discrete (allowed) orbits belong to Bohr's model, not Rutherford's.<br>Answer <b>C</b>.","C":"(1) 正確：原子包含（原子核內的）正電荷和帶負電的電子。<br>(2) 正確：所有正電荷（及幾乎全部質量）集中在微小的原子核內。<br>(3) 不正確：分立的（容許的）軌道屬玻爾模型，並非盧瑟福模型。<br>答案 <b>C</b>。"}},{"id":"OP-2023S2-24","p":"P2","s":2023,"n":"2.4","t":"atom","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"Six photon energies means the atoms were excited to n = 4 (number of transitions from n = 4 = 4 × 3/2 = 6). The energies in decreasing order are:<br>E<sub>1</sub>: 4→1, E<sub>2</sub>: 3→1, E<sub>3</sub>: 2→1, E<sub>4</sub>: 4→2, E<sub>5</sub>: 3→2, E<sub>6</sub>: 4→3.<br>(1) 4→1 = (4→3) + (3→1): E<sub>1</sub> = E<sub>6</sub> + E<sub>2</sub> ✓.<br>(2) 4→2 = (4→3) + (3→2): E<sub>4</sub> = E<sub>6</sub> + E<sub>5</sub> ✓.<br>(3) 3→1 = (3→2) + (2→1): E<sub>2</sub> = E<sub>5</sub> + E<sub>3</sub> ✓.<br>Answer <b>D</b>.","C":"共有六種光子能量，表示原子被激發至 n = 4（由 n = 4 開始的躍遷數目 = 4 × 3/2 = 6）。能量由大至小為：<br>E<sub>1</sub>：4→1，E<sub>2</sub>：3→1，E<sub>3</sub>：2→1，E<sub>4</sub>：4→2，E<sub>5</sub>：3→2，E<sub>6</sub>：4→3。<br>(1) 4→1 = (4→3) + (3→1)：E<sub>1</sub> = E<sub>6</sub> + E<sub>2</sub> ✓。<br>(2) 4→2 = (4→3) + (3→2)：E<sub>4</sub> = E<sub>6</sub> + E<sub>5</sub> ✓。<br>(3) 3→1 = (3→2) + (2→1)：E<sub>2</sub> = E<sub>5</sub> + E<sub>3</sub> ✓。<br>答案 <b>D</b>。"}},{"id":"OP-2023S2-25","p":"P2","s":2023,"n":"2.5","t":"atom","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"Photon: λ<sub>p</sub> = hc/E = (6.63 × 10<sup>−34</sup>)(3 × 10<sup>8</sup>)/(1.6 × 10<sup>−19</sup>) ≈ 1.24 × 10<sup>−6</sup> m.<br>Electron: λ<sub>e</sub> = h/√(2mE) = 6.63 × 10<sup>−34</sup>/√(2 × 9.11 × 10<sup>−31</sup> × 1.6 × 10<sup>−19</sup>) ≈ 1.23 × 10<sup>−9</sup> m.<br>λ<sub>p</sub>/λ<sub>e</sub> ≈ 1000.<br>Answer <b>A</b>.","C":"光子：λ<sub>p</sub> = hc/E = (6.63 × 10<sup>−34</sup>)(3 × 10<sup>8</sup>)/(1.6 × 10<sup>−19</sup>) ≈ 1.24 × 10<sup>−6</sup> m。<br>電子：λ<sub>e</sub> = h/√(2mE) = 6.63 × 10<sup>−34</sup>/√(2 × 9.11 × 10<sup>−31</sup> × 1.6 × 10<sup>−19</sup>) ≈ 1.23 × 10<sup>−9</sup> m。<br>λ<sub>p</sub>/λ<sub>e</sub> ≈ 1000。<br>答案 <b>A</b>。"}},{"id":"OP-2023S2-26","p":"P2","s":2023,"n":"2.6","t":"atom","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"Same speed, but a helium ion is about 7000 times heavier than an electron, so it has a much larger momentum and a much shorter de Broglie wavelength (λ = h/mv). By the Rayleigh criterion θ ≈ 1.22λ/d, shorter λ gives higher resolving power: helium ions &gt; electrons.<br>Accelerating voltage: qV = ½mv<sup>2</sup>. Same charge e and same speed, so the heavier ion needs a larger V: helium ions &gt; electrons.<br>Answer <b>C</b>.","C":"速率相同，但氦離子質量約為電子的 7000 倍，動量大得多，德布羅意波長（λ = h/mv）短得多。根據瑞利判據 θ ≈ 1.22λ/d，λ 越短解像能力越高：氦離子 &gt; 電子。<br>加速電壓：qV = ½mv<sup>2</sup>。電荷同為 e、速率相同，較重的離子需要較大的 V：氦離子 &gt; 電子。<br>答案 <b>C</b>。"}},{"id":"OP-2023S2-27","p":"P2","s":2023,"n":"2.7","t":"atom","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"(1) Correct: both can resolve individual atoms (about 0.1 nm).<br>(2) Incorrect: a TEM uses accelerating voltages of tens to hundreds of kV, but an STM uses only a small bias voltage (mV to a few V) between tip and surface.<br>(3) Incorrect: only the STM needs a conducting surface; a TEM needs a very thin specimen.<br>Answer <b>A</b>.","C":"(1) 正確：兩者都能分辨個別原子（約 0.1 nm）。<br>(2) 不正確：透射電子顯微鏡使用數十至數百 kV 的加速電壓，但掃描隧道顯微鏡只在探針與表面之間加上很小的電壓（mV 至數 V）。<br>(3) 不正確：只有掃描隧道顯微鏡需要導電的表面；透射電子顯微鏡需要極薄的樣本。<br>答案 <b>A</b>。"}},{"id":"OP-2023S2-28","p":"P2","s":2023,"n":"2.8","t":"atom","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"A, B and C are correct: nanomaterials have a large surface-area-to-volume ratio and are more reactive; inhaled nanoparticles can reach deep into the lungs and harm health; colour can change with size (e.g. gold nanoparticles look red).<br>D is incorrect: not all carbon nanostructures conduct — some carbon nanotubes are semiconductors, and nanodiamond is an insulator.<br>Answer <b>D</b>.","C":"A、B、C 都正確：納米物料的表面積與體積比大，反應性較強；吸入的納米粒子可深入肺部，危害健康；顏色可隨大小改變（例如金納米粒子呈紅色）。<br>D 不正確：並非所有碳納米結構都導電——部分碳納米管是半導體，納米鑽石是絕緣體。<br>答案 <b>D</b>。"}},{"id":"OP-2023S2-31","p":"P2","s":2023,"n":"3.1","t":"energy","x":false,"a":"B","pub":"OUP","st":2,"ex":{"E":"(1) Microwave oven: the microwaves heat the food directly; the container is heated only by the food, so it is not hotter than the food ✗.<br>(2) Induction cooker: eddy currents are induced in the metal pot itself, so the pot is the hottest — hotter than the cooker surface and the food ✓.<br>(3) Electric hotplate: the hotplate heats the utensil by conduction, so the hotplate is hotter than the utensil ✗.<br>Answer <b>B</b>.","C":"(1) 微波爐：微波直接加熱食物，器皿只靠食物傳熱，不會比食物熱 ✗。<br>(2) 電磁爐：渦電流在金屬鍋本身產生，鍋最熱——比爐面和食物都熱 ✓。<br>(3) 電熱平板爐：熱板以傳導加熱器皿，熱板比器皿熱 ✗。<br>答案 <b>B</b>。"}},{"id":"OP-2023S2-32","p":"P2","s":2023,"n":"3.2","t":"energy","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"(1) Incorrect: luminous flux = efficacy × power = 96 × 10 = 960 lm (no division by 2).<br>(2) Correct: same brightness ⇒ same flux 960 lm. CFL efficacy = 960/16 = 60 lm W<sup>−1</sup>.<br>(3) Correct: incandescent = 960/83 ≈ 11.6 lm W<sup>−1</sup> &lt; CFL 60 &lt; LED 96.<br>Answer <b>D</b>.","C":"(1) 不正確：光通量 = 發光效能 × 功率 = 96 × 10 = 960 lm（不用除以 2）。<br>(2) 正確：亮度相同 ⇒ 光通量同為 960 lm。緊湊型熒光燈效能 = 960/16 = 60 lm W<sup>−1</sup>。<br>(3) 正確：白熾燈 = 960/83 ≈ 11.6 lm W<sup>−1</sup> &lt; 熒光燈 60 &lt; 發光二極管 96。<br>答案 <b>D</b>。"}},{"id":"OP-2023S2-33","p":"P2","s":2023,"n":"3.3","t":"energy","x":false,"a":"B","pub":"OUP","st":2,"ex":{"E":"Illuminance from a point source on a horizontal surface: E = (Φ/4π) cos θ / r<sup>2</sup>.<br>Lamp P: r = √(15<sup>2</sup> + 20<sup>2</sup>) x = 25x, cos θ = 20/25 = 0.8.<br>Lamp Q: r = √(3<sup>2</sup> + 4<sup>2</sup>) x = 5x, cos θ = 4/5 = 0.8.<br>Equal illuminance: 15 000/(25x)<sup>2</sup> = Φ<sub>Q</sub>/(5x)<sup>2</sup> ⇒ Φ<sub>Q</sub> = 15 000/25 = 600 lm.<br>Answer <b>B</b>.","C":"點光源在水平面上的照明度：E = (Φ/4π) cos θ / r<sup>2</sup>。<br>燈 P：r = √(15<sup>2</sup> + 20<sup>2</sup>) x = 25x，cos θ = 20/25 = 0.8。<br>燈 Q：r = √(3<sup>2</sup> + 4<sup>2</sup>) x = 5x，cos θ = 4/5 = 0.8。<br>照明度相同：15 000/(25x)<sup>2</sup> = Φ<sub>Q</sub>/(5x)<sup>2</sup> ⇒ Φ<sub>Q</sub> = 15 000/25 = 600 lm。<br>答案 <b>B</b>。"}},{"id":"OP-2023S2-34","p":"P2","s":2023,"n":"3.4","t":"energy","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"The 1500 W is the electrical input. Heat removed from the room = COP × input = 3 × 1500 = 4500 W.<br>Heat released outside = heat removed + electrical input = 4500 + 1500 = 6000 W.<br>Answer <b>D</b>.","C":"1500 W 是輸入電功率。從房間移走的熱 = 性能係數 × 輸入功率 = 3 × 1500 = 4500 W。<br>排放至室外的熱 = 移走的熱 + 輸入電能 = 4500 + 1500 = 6000 W。<br>答案 <b>D</b>。"}},{"id":"OP-2023S2-35","p":"P2","s":2023,"n":"3.5","t":"energy","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"OTTV = (rate of heat transfer through the envelope)/(total area of the envelope) = UAΔT/A = UΔT.<br>With no windows and a uniform wall, the area cancels, so the OTTV depends only on the U-value. The smallest U-value (2.0 W m<sup>−2</sup> K<sup>−1</sup>) gives the lowest OTTV.<br>Answer <b>D</b>.","C":"總熱轉移值 = 通過外殼的傳熱率 / 外殼總面積 = UAΔT/A = UΔT。<br>沒有窗、牆身均勻時面積互相抵消，總熱轉移值只取決於 U 值。U 值最小（2.0 W m<sup>−2</sup> K<sup>−1</sup>）的總熱轉移值最低。<br>答案 <b>D</b>。"}},{"id":"OP-2023S2-36","p":"P2","s":2023,"n":"3.6","t":"energy","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"(1) Correct: regenerative braking, engine shut-off when idle and running the engine at its most efficient speed give hybrids a higher end-use efficiency, so they burn less fuel and emit less CO<sub>2</sub>.<br>(2) Incorrect: hybrid cars also have friction brakes for hard or emergency braking.<br>(3) Incorrect: a (non-plug-in) hybrid is refuelled with petrol in the same way; its battery is charged by the engine and regenerative braking.<br>Answer <b>A</b>.","C":"(1) 正確：再生制動、停車時關掉引擎、讓引擎在最高效的轉速運作，令混合動力車的終端能源效率較高，用油較少，排放的二氧化碳亦較少。<br>(2) 不正確：混合動力車亦有摩擦制動器，用於急剎。<br>(3) 不正確：（非插電式）混合動力車同樣以汽油入油；電池由引擎和再生制動充電。<br>答案 <b>A</b>。"}},{"id":"OP-2023S2-37","p":"P2","s":2023,"n":"3.7","t":"energy","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"In a PWR the pressurized water acts as the coolant (absorbs the energy from fission, C ✓) and the moderator (slows down fast neutrons, B ✓); it is kept under high pressure so it stays liquid (D ✓).<br>Absorbing neutrons to control the fission rate is the job of the <b>control rods</b> (e.g. boron or cadmium), not the water. A is incorrect.<br>Answer <b>A</b>.","C":"壓水式反應堆中，加壓水作為冷卻劑（吸收裂變釋出的能量，C ✓）和減速劑（減慢快中子，B ✓）；水處於高壓下，保持液態（D ✓）。<br>吸收中子以控制裂變速率是<b>控制棒</b>（例如硼或鎘）的工作，並非水的工作。A 不正確。<br>答案 <b>A</b>。"}},{"id":"OP-2023S2-38","p":"P2","s":2023,"n":"3.8","t":"energy","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"The Sun is overhead at X. Y is 22.3° from X along the same longitude, so at Y sunlight arrives at 22.3° to the vertical (the normal of the horizontal panel).<br>Intensity reaching the ground (perpendicular to the rays) = 1366 × (1 − 0.35) = 888 W m<sup>−2</sup>.<br>Power on the panel = 888 × 0.5 × cos 22.3° ≈ 411 W.<br>Answer <b>C</b>.","C":"太陽在 X 正上方。Y 與 X 在同一經線上相差 22.3°，所以陽光在 Y 與豎直方向（水平太陽能板的法線）成 22.3°。<br>到達地面（垂直於光線）的強度 = 1366 × (1 − 0.35) = 888 W m<sup>−2</sup>。<br>太陽能板接收的功率 = 888 × 0.5 × cos 22.3° ≈ 411 W。<br>答案 <b>C</b>。"}},{"id":"OP-2023S2-41","p":"P2","s":2023,"n":"4.1","t":"med","x":false,"a":"B","pub":"OUP","st":2,"ex":{"E":"Minimum angle of resolution θ ≈ 1.22λ/d (d = pupil diameter); smaller θ means higher resolving power.<br>(1) Incorrect: red light has a longer λ → θ larger → lower resolving power.<br>(2) Correct: in a dark room the pupil dilates, d increases → θ smaller.<br>(3) Incorrect: standing closer makes the LEDs' angular separation larger, so they are easier to tell apart, but the eye's resolving power (its minimum angle) is unchanged.<br>Answer <b>B</b>.","C":"最小分辨角 θ ≈ 1.22λ/d（d = 瞳孔直徑）；θ 越小，解像能力越高。<br>(1) 不正確：紅光 λ 較長 → θ 較大 → 解像能力較低。<br>(2) 正確：房間黑暗時瞳孔擴大，d 增加 → θ 較小。<br>(3) 不正確：站近一點令兩盞燈的角距增大，較易分辨，但眼睛本身的解像能力（最小分辨角）不變。<br>答案 <b>B</b>。"}},{"id":"OP-2023S2-42","p":"P2","s":2023,"n":"4.2","t":"med","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"With the spectacles, an object at 25 cm must form a virtual image at Peter's own near point. A convex lens of f = 18 cm would give a real image (25 cm &gt; f), which is impossible, so the lens is <b>concave</b>, f = −18 cm.<br>1/v = 1/f − 1/u = −1/18 − 1/25 ⇒ v = −10.5 cm.<br>His near point without spectacles is 10.5 cm (he is short-sighted).<br>Answer <b>A</b>.","C":"戴上眼鏡後，25 cm 處的物體須在家富自己的近點形成虛像。若用 f = 18 cm 的凸透鏡，因 25 cm &gt; f 會形成實像，不可能，所以是<b>凹透鏡</b>，f = −18 cm。<br>1/v = 1/f − 1/u = −1/18 − 1/25 ⇒ v = −10.5 cm。<br>他不戴眼鏡時的近點是 10.5 cm（近視）。<br>答案 <b>A</b>。"}},{"id":"OP-2023S2-43","p":"P2","s":2023,"n":"4.3","t":"med","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"For a point source I ∝ 1/r<sup>2</sup>, so ΔL = 20 log(r<sub>2</sub>/r<sub>1</sub>).<br>A to B: 14 = 20 log(r<sub>B</sub>/r<sub>A</sub>) ⇒ r<sub>B</sub>/r<sub>A</sub> ≈ 5. With r<sub>B</sub> − r<sub>A</sub> = 4 m: r<sub>A</sub> = 1 m, r<sub>B</sub> = 5 m.<br>A to C: 28 = 20 log(r<sub>C</sub>/r<sub>A</sub>) ⇒ r<sub>C</sub>/r<sub>A</sub> ≈ 25 ⇒ r<sub>C</sub> = 25 m.<br>BC = 25 − 5 = 20.0 m.<br>Answer <b>D</b>.","C":"點聲源 I ∝ 1/r<sup>2</sup>，所以 ΔL = 20 log(r<sub>2</sub>/r<sub>1</sub>)。<br>A 至 B：14 = 20 log(r<sub>B</sub>/r<sub>A</sub>) ⇒ r<sub>B</sub>/r<sub>A</sub> ≈ 5。又 r<sub>B</sub> − r<sub>A</sub> = 4 m：r<sub>A</sub> = 1 m，r<sub>B</sub> = 5 m。<br>A 至 C：28 = 20 log(r<sub>C</sub>/r<sub>A</sub>) ⇒ r<sub>C</sub>/r<sub>A</sub> ≈ 25 ⇒ r<sub>C</sub> = 25 m。<br>BC = 25 − 5 = 20.0 m。<br>答案 <b>D</b>。"}},{"id":"OP-2023S2-44","p":"P2","s":2023,"n":"4.4","t":"med","x":false,"a":"B","pub":"OUP","st":2,"ex":{"E":"The 0 phon curve is this person's threshold of hearing: a sound is heard only if its intensity level is above the curve at that frequency. The undetectable sounds are those <b>below</b> the curve, i.e. the whole region under it.<br>Answer <b>B</b>.","C":"0 方曲線是此人的聽覺閾：聲音的聲強級須高於該頻率的曲線才聽得到。聽不到的聲音是曲線<b>以下</b>的整個區域。<br>答案 <b>B</b>。"}},{"id":"OP-2023S2-45","p":"P2","s":2023,"n":"4.5","t":"med","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"(1) Correct: an endoscope gives a direct (real colour) view of the organ's inner surface.<br>(2) Incorrect: a conventional X-ray radiograph is a 2D projection with overlapping structures; cross-sectional images come from CT.<br>(3) Correct: the uptake of the radiotracer shows how well the organ is working (functional information).<br>Answer <b>C</b>.","C":"(1) 正確：內窺鏡可直接（以真實顏色）觀察器官內壁。<br>(2) 不正確：傳統 X 射線照片是重疊的二維投影；橫切面影像來自電腦斷層掃描。<br>(3) 正確：示蹤劑的攝取情況反映器官的運作（功能資料）。<br>答案 <b>C</b>。"}},{"id":"OP-2023S2-46","p":"P2","s":2023,"n":"4.6","t":"med","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"P passes more urine, so X is removed from P's body faster → shorter biological half-life: P &lt; Q.<br>1/T<sub>eff</sub> = 1/T<sub>phy</sub> + 1/T<sub>bio</sub>. The physical half-life is the same, so a shorter T<sub>bio</sub> gives a shorter T<sub>eff</sub>: P &lt; Q.<br>Answer <b>A</b>.","C":"P 排尿較多，X 較快被排出體外 → 生物半衰期較短：P &lt; Q。<br>1/T<sub>有效</sub> = 1/T<sub>物理</sub> + 1/T<sub>生物</sub>。物理半衰期相同，T<sub>生物</sub> 較短則 T<sub>有效</sub> 亦較短：P &lt; Q。<br>答案 <b>A</b>。"}},{"id":"OP-2023S2-47","p":"P2","s":2023,"n":"4.7","t":"med","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"A ✓: radionuclide imaging uses γ rays and CT uses X-rays; both are ionizing. B ✓: bone scans and CT can both image bone. D ✓: radionuclide images have low resolution.<br>C is incorrect: the radiation from a CT scan lasts only for the scanning time; the higher dose comes from the many X-ray exposures taken from all angles. The tracer in radionuclide imaging actually stays in the body for longer.<br>Answer <b>C</b>.","C":"A ✓：放射性核素造影用 γ 射線，電腦斷層掃描用 X 射線，兩者都是電離輻射。B ✓：骨骼掃描和電腦斷層掃描都可顯示骨骼。D ✓：放射性核素造影的解像度較低。<br>C 不正確：電腦斷層掃描的輻射只在掃描期間出現；劑量較高是因為從各個角度拍攝大量 X 射線影像。其實放射性核素造影的示蹤劑留在體內的時間更長。<br>答案 <b>C</b>。"}},{"id":"OP-2023S2-48","p":"P2","s":2023,"n":"4.8","t":"med","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"P alone: 1/8 = (½)<sup>3</sup> ⇒ t = 3 half-value thicknesses of P ⇒ HVT<sub>P</sub> = t/3.<br>P and Q together: 1/16 = (½)<sup>4</sup>, so Q adds one more halving ⇒ 2t = 1 HVT<sub>Q</sub> ⇒ HVT<sub>Q</sub> = 2t.<br>HVT<sub>P</sub>/HVT<sub>Q</sub> = (t/3)/(2t) = 1/6.<br>Answer <b>D</b>.","C":"只有 P：1/8 = (½)<sup>3</sup> ⇒ t = P 的 3 個半值厚度 ⇒ HVT<sub>P</sub> = t/3。<br>P 加 Q：1/16 = (½)<sup>4</sup>，Q 再令強度減半一次 ⇒ 2t = 1 個 HVT<sub>Q</sub> ⇒ HVT<sub>Q</sub> = 2t。<br>HVT<sub>P</sub>/HVT<sub>Q</sub> = (t/3)/(2t) = 1/6。<br>答案 <b>D</b>。"}}], lang="E", S=null, timerId=null;

function solHTML(q){const t=T[lang];if(q.pub==="OUP")return `<div class="sol"><h3>${t.solution}</h3><div class="more"><div>${q.ex[lang]}</div></div></div>`;return `<div class="sol"><h3>${t.solution}</h3><a href="${solImg(q)}" target="_blank" rel="noopener"><img class="qimg" src="${solImg(q)}" alt="" loading="lazy"></a>`+(q.ex?`<div class="more"><b>${t.more}</b><div>${q.ex[lang]}</div></div>`:"")+`</div>`}

function chip(label,val,pressed,onclick){const b=document.createElement("button");b.className="chip";b.textContent=label;b.dataset.v=val;b.setAttribute("aria-pressed",pressed);b.onclick=onclick||(()=>{toggle(b);refresh()});return b}
function toggle(b){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")}
function radio(container,b){[...container.children].forEach(c=>c.setAttribute("aria-pressed",c===b));refresh()}
const on=id=>[...$(id).children].filter(c=>c.getAttribute("aria-pressed")==="true").map(c=>c.dataset.v);

function buildSetup(){
  const t=T[lang];
  const keep=(id,def)=>{const prev=$(id).children.length?on(id):null;return v=>prev?prev.includes(String(v)):def(v)};
  const kt=keep("topicChips",()=>true), ke=keep("elecChips",()=>true), kn=keep("numChips",v=>v==="10"), ko=keep("orderChips",v=>v==="random"), km=keep("modeChips",v=>v==="practice");
  $("topicChips").replaceChildren(...CORE.map(k=>chip(t.topicsN[k],k,kt(k))));
  $("elecChips").replaceChildren(...ELEC.map(k=>chip(t.topicsN[k],k,ke(k))));
  const nc=$("numChips"); nc.replaceChildren(...["5","10","15","20","30","all"].map(v=>{const b=chip(v==="all"?t.all:v,v,kn(v));b.onclick=()=>radio(nc,b);return b}));
  const oc=$("orderChips"); oc.replaceChildren(...[["random",t.random],["paper",t.paper]].map(([v,l])=>{const b=chip(l,v,ko(v));b.onclick=()=>radio(oc,b);return b}));
  const mc=$("modeChips"); mc.replaceChildren(...[["practice",t.practice],["exam",t.exam]].map(([v,l])=>{const b=chip(l,v,km(v));b.onclick=()=>radio(mc,b);return b}));
  refresh();
}
const coOK=q=>true;
function pool(){
  const ts=[...on("topicChips"),...on("elecChips")], ext=$("extChip").getAttribute("aria-pressed")==="true";
  return Q.filter(q=>ts.includes(q.t)&&(ext||!q.x)&&coOK(q));
}
function allTopics(v){[...$("topicChips").children,...$("elecChips").children].forEach(c=>c.setAttribute("aria-pressed",v));refresh()}
function refresh(){
  const t=T[lang], n=pool().length;
  $("poolInfo").textContent=t.pool(n); $("startBtn").disabled=!n; $("numHint").textContent=t.numHint(n);
  const ext=$("extChip").getAttribute("aria-pressed")==="true";
  [...$("topicChips").children,...$("elecChips").children].forEach(c=>{const k=c.dataset.v;c.textContent=`${t.topicsN[k]} (${Q.filter(q=>q.t===k&&(ext||!q.x)&&coOK(q)).length})`});
  $("modeHint").textContent=on("modeChips")[0]==="exam"?t.examHint:t.practiceHint;
  const w=store.get("dsemock2_wrong",[]); $("wrongInfo").textContent=t.wrongInfo(w.length); $("wrongBtn").disabled=!w.length;
}
function applyLang(){
  const t=T[lang]; document.documentElement.lang=lang==="C"?"zh-Hant":"en";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  $("lgE").className=lang==="E"?"on":""; $("lgC").className=lang==="C"?"on":"";
  $("extChip").textContent=t.extOn; $("startBtn").textContent=t.start; $("wrongBtn").textContent=t.redoSaved;
  $("prevBtn").textContent=t.prev; $("onlyWrongChip").textContent=t.onlyWrong;
}
function setLang(l){lang=l;store.set("dsemock2_lang",l);applyLang();buildSetup();if(S){if(!$("quiz").classList.contains("hidden"))renderQ();if(!$("results").classList.contains("hidden"))renderResults()}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(list){
  let qs=list||pool();
  const order=list?"random":on("orderChips")[0], num=list?"all":on("numChips")[0];
  if(order==="random")shuffle(qs=[...qs]); else qs=[...qs].sort((a,b)=>(a.pub>b.pub)-(a.pub<b.pub)||a.s-b.s||(a.st||1)-(b.st||1)||(a.p>b.p)-(a.p<b.p)||parseFloat(a.n)-parseFloat(b.n));
  if(num!=="all")qs=qs.slice(0,+num);
  const mode=list?"practice":on("modeChips")[0];
  S={qs,ans:Array(qs.length).fill(null),flag:Array(qs.length).fill(false),i:0,mode,t0:Date.now(),limit:mode==="exam"?Math.round(qs.length*1.8*60):0};
  $("setup").classList.add("hidden");$("results").classList.add("hidden");$("quiz").classList.remove("hidden");
  clearInterval(timerId);
  if(S.limit){$("timerBox").classList.remove("hidden");tick();timerId=setInterval(tick,1000)}else $("timerBox").classList.add("hidden");
  renderQ(); scrollTo(0,0);
}
function startWrong(){const w=new Set(store.get("dsemock2_wrong",[]));start(Q.filter(q=>w.has(qid(q))))}
function clearWrong(){store.set("dsemock2_wrong",[]);refresh()}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function tick(){const left=S.limit-Math.floor((Date.now()-S.t0)/1000);$("timer").textContent=fmt(Math.max(0,left));$("timer").classList.toggle("low",left<120);if(left<=0){clearInterval(timerId);finish(true);ask(T[lang].timeUp,true)}}

function renderQ(){
  const t=T[lang], q=S.qs[S.i], a=S.ans[S.i], n=S.qs.length, reveal=S.mode==="practice"&&a;
  $("qPos").textContent=t.q(S.i+1,n);
  $("qTags").innerHTML=`<span class="tag">${t.topicsN[q.t]}</span>`+(q.x?`<span class="tag ext">*</span>`:"")+`<span style="font-size:.85rem">${t.paperQ(q)}</span>`;
  $("progBar").style.width=`${100*S.ans.filter(Boolean).length/n}%`;
  $("qImg").src=img(q); $("qLink").href=img(q); $("qImg").alt=t.paperQ(q);
  $("opts").replaceChildren(...["A","B","C","D"].map(L=>{const b=document.createElement("button");b.className="opt";b.textContent=L;
    if(reveal){if(L===ak(q))b.classList.add("right");else if(L===a)b.classList.add("wrong")}else if(L===a)b.classList.add("sel");
    b.onclick=()=>choose(L);return b}));
  const fb=$("fb");
  if(reveal){fb.classList.remove("hidden");const ok=a===ak(q);fb.className="feedback "+(ok?"ok":"no");fb.textContent=(ok?t.correctFb:t.wrongFb(ak(q)))+""}else fb.classList.add("hidden");
  $("solBox").innerHTML=reveal?solHTML(q):"";
  $("prevBtn").disabled=S.i===0;
  $("nextBtn").textContent=S.i===n-1?t.finish:t.next;
  $("flagBtn").textContent=S.flag[S.i]?t.unflag:t.flag;
  $("dots").replaceChildren(...S.qs.map((_,k)=>{const d=document.createElement("button");d.className="dot";d.textContent=k+1;
    if(S.ans[k])d.classList.add("ans");if(k===S.i)d.classList.add("cur");if(S.flag[k])d.classList.add("flag");
    if(S.mode==="practice"&&S.ans[k]){d.style.background=S.ans[k]===ak(S.qs[k])?"var(--good-soft)":"var(--bad-soft)";d.style.borderColor=S.ans[k]===ak(S.qs[k])?"var(--good)":"var(--bad)";d.style.color=d.style.borderColor}
    d.onclick=()=>{S.i=k;renderQ()};return d}));
}
function choose(L){if(S.mode==="practice"&&S.ans[S.i])return;S.ans[S.i]=L;renderQ()}
function flag(){S.flag[S.i]=!S.flag[S.i];renderQ()}
async function go(d){if(S.i+d>=S.qs.length){const left=S.ans.filter(x=>!x).length;if(left&&!(await ask(T[lang].confirmFinish(left))))return;finish();return}S.i=Math.max(0,S.i+d);renderQ();scrollTo(0,0)}
async function quit(){if(await ask(T[lang].confirmQuit)){clearInterval(timerId);S=null;showSetup()}}
function finish(){
  clearInterval(timerId); S.used=Math.floor((Date.now()-S.t0)/1000);
  const w=new Set(store.get("dsemock2_wrong",[]));
  S.qs.forEach((q,k)=>{if(S.ans[k]===ak(q))w.delete(qid(q));else w.add(qid(q))});
  store.set("dsemock2_wrong",[...w]);
  $("quiz").classList.add("hidden");$("results").classList.remove("hidden");renderResults();scrollTo(0,0);
}
function renderResults(){
  const t=T[lang], n=S.qs.length, c=S.qs.filter((q,k)=>S.ans[k]===ak(q)).length;
  $("score").textContent=`${Math.round(100*c/n)}%`;
  $("scoreSub").textContent=t.scoreSub(c,n,fmt(S.used));
  $("topicTable").innerHTML=TOPICS.map(k=>{const qs=S.qs.map((q,i)=>[q,i]).filter(([q])=>q.t===k);if(!qs.length)return"";
    const ok=qs.filter(([q,i])=>S.ans[i]===ak(q)).length,p=Math.round(100*ok/qs.length);
    return `<tr><td>${t.topicsN[k]}</td><td>${ok} / ${qs.length}</td><td style="width:35%"><div class="bar"><i style="width:${p}%"></i></div></td></tr>`}).join("");
  const wrong=S.qs.filter((q,k)=>S.ans[k]!==ak(q)).length;
  $("redoBtn").textContent=t.redo(wrong);$("redoBtn").classList.toggle("hidden",!wrong);
  renderReview();
}
function renderReview(){
  const t=T[lang], only=$("onlyWrongChip").getAttribute("aria-pressed")==="true";
  $("reviewList").innerHTML=S.qs.map((q,k)=>{const a=S.ans[k],ok=a===ak(q);if(only&&ok)return"";
    return `<div class="rev"><div><span class="tag">${t.topicsN[q.t]}</span>${q.x?'<span class="tag ext">*</span>':""}<b>${t.paperQ(q)}</b></div>
      <img class="qimg" src="${img(q)}" alt="" loading="lazy">
      <div>${t.yours}: <span class="${ok?"ok":"no"}">${a||t.none}</span> &nbsp; ${t.key}: <span class="ok">${ak(q)}</span></div><details class="solbox"${S.mode==="practice"?"":""}><summary>${t.showSol}</summary>${solHTML(q)}</details></div>`}).join("");
}
function redoWrong(){start(S.qs.filter((q,k)=>S.ans[k]!==ak(q)))}
function showSetup(){$("quiz").classList.add("hidden");$("results").classList.add("hidden");$("setup").classList.remove("hidden");refresh();scrollTo(0,0)}
document.addEventListener("keydown",e=>{if(!S||$("quiz").classList.contains("hidden")||!$("modal").classList.contains("hidden"))return;const k=e.key.toUpperCase();
  if("ABCD".includes(k)&&k.length===1)choose(k);else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft"&&S.i>0)go(-1)});

lang=store.get("dsemock2_lang","E");
applyLang();buildSetup();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSE Physics Mock MC Practice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6feb'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EMC%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--ink:#1b2430;--muted:#5d6b7a;--line:#dde2e8;--accent:#1f6feb;--accent-soft:#e8f0fe;
    --good:#1a7f37;--good-soft:#dafbe1;--bad:#cf222e;--bad-soft:#ffebe9;--warn:#9a6700;--chip:#eef1f4;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:24px 14px 60px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:clamp(1.4rem,4vw,1.9rem);margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-top:18px}
  .card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
  .row{margin-bottom:18px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:.95rem;cursor:pointer;user-select:none}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .hint{color:var(--muted);font-size:.85rem;margin-top:6px}
  .grp{font-size:.85rem;font-weight:600;color:var(--ink);margin:10px 0 6px}
  .sol{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
  .sol h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px}
  .sol .qimg{margin:6px 0}
  .more{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:.95rem;line-height:1.65}
  .more>b{display:block;color:var(--accent);font-size:.85rem;margin-bottom:4px}
  details.solbox{margin-top:8px}details.solbox summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
  .btn{font:inherit;border:0;border-radius:12px;padding:11px 20px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  .btn.small{padding:7px 12px;font-size:.9rem}
  .count{font-weight:600;color:var(--accent)}
  .langsw{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .langsw button{font:inherit;border:0;background:var(--panel);padding:6px 12px;cursor:pointer;color:var(--muted)}
  .langsw button.on{background:var(--accent);color:#fff}
  /* quiz */
  .qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
  .prog{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin:10px 0 0}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 8px;font-size:.8rem;font-weight:600;margin-right:6px}
  .tag.ext{background:#fff4d6;color:var(--warn)}
  .qimg{width:100%;height:auto;display:block;border-radius:8px;margin:14px 0;background:#fff}
  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .opt{font:inherit;font-size:1.25rem;font-weight:700;padding:14px 0;border-radius:12px;border:2px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
  .feedback{margin-top:12px;padding:10px 14px;border-radius:10px;font-weight:600}
  .feedback.ok{background:var(--good-soft);color:var(--good)}
  .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
  .timer.low{color:var(--bad)}
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
  .dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:.78rem;cursor:pointer;color:var(--muted)}
  .dot.ans{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .dot.cur{outline:2px solid var(--accent);outline-offset:1px}
  .dot.flag{border-color:var(--warn);border-width:2px}
  /* results */
  .big{font-size:2.6rem;font-weight:800;margin:0}
  table{width:100%;border-collapse:collapse;font-size:.93rem}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
  .bar{height:8px;background:var(--chip);border-radius:9px;overflow:hidden;min-width:60px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
  .rev{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  footer{color:var(--muted);font-size:.8rem;margin-top:30px;text-align:center}
  .hidden{display:none!important}
  .modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
  .modal>div{background:var(--panel);border-radius:16px;padding:20px;max-width:380px;width:100%;box-shadow:var(--shadow)}
  .modal p{margin:0 0 16px;font-weight:600}.modal .nav{margin:0;justify-content:flex-end}
  @media(max-width:520px){.opt{font-size:1.1rem;padding:12px 0}.card{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
    <div class="langsw" role="group" aria-label="Language">
      <button id="lgE" onclick="setLang('E')">English</button>
      <button id="lgC" onclick="setLang('C')">中文</button>
    </div>
  </header>

  <!-- SETUP -->
  <section id="setup">
    <div class="card">
      <div class="row">
        <h2 data-t="topics"></h2>
        <div class="grp" data-t="compulsory"></div>
        <div class="chips" id="topicChips"></div>
        <div class="grp" data-t="electives"></div>
        <div class="chips" id="elecChips"></div>
        <div style="margin-top:8px;display:flex;gap:8px"><button class="btn ghost small" onclick="allTopics(true)" data-t="selAll"></button><button class="btn ghost small" onclick="allTopics(false)" data-t="selNone"></button></div>
      </div>
      <div class="row">
        <h2 data-t="ext"></h2>
        <div class="chips">
          <button class="chip" id="extChip" aria-pressed="true" onclick="toggle(this);refresh()"></button>
        </div>
        <div class="hint" data-t="extHint"></div>
      </div>
      <div class="row">
        <h2 data-t="howMany"></h2>
        <div class="chips" id="numChips"></div>
        <div class="hint" id="numHint"></div>
      </div>
      <div class="row">
        <h2 data-t="order"></h2>
        <div class="chips" id="orderChips"></div>
      </div>
      <div class="row">
        <h2 data-t="mode"></h2>
        <div class="chips" id="modeChips"></div>
        <div class="hint" id="modeHint"></div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <button class="btn" id="startBtn" onclick="start()"></button>
        <span id="poolInfo" class="hint" style="margin:0"></span>
      </div>
    </div>
    <div class="card" id="wrongCard">
      <h2 data-t="myWrong"></h2>
      <p id="wrongInfo" style="margin:0 0 10px"></p>
      <button class="btn ghost small" id="wrongBtn" onclick="startWrong()"></button>
      <button class="btn ghost small" onclick="clearWrong()" data-t="clear"></button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="card">
      <div class="qbar">
        <div><span id="qPos"></span> &nbsp; <span id="qTags"></span></div>
        <div id="timerBox" class="hidden">⏱ <span class="timer" id="timer"></span></div>
      </div>
      <div class="prog"><i id="progBar"></i></div>
      <a id="qLink" target="_blank" rel="noopener"><img class="qimg" id="qImg" alt=""></a>
      <div class="hint" style="margin-top:-8px;text-align:right" data-t="zoom"></div>
      <div class="opts" id="opts"></div>
      <div id="fb" class="feedback hidden"></div>
      <div id="solBox"></div>
      <div class="nav">
        <div style="display:flex;gap:8px">
          <button class="btn ghost small" id="prevBtn" onclick="go(-1)"></button>
          <button class="btn ghost small" id="flagBtn" onclick="flag()"></button>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn ghost small" onclick="quit()" data-t="quit"></button>
          <button class="btn small" id="nextBtn" onclick="go(1)"></button>
        </div>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="card">
      <h2 data-t="result"></h2>
      <p class="big" id="score"></p>
      <p class="sub" id="scoreSub"></p>
      <table style="margin-top:14px">
        <thead><tr><th data-t="topic"></th><th data-t="correct"></th><th></th></tr></thead>
        <tbody id="topicTable"></tbody>
      </table>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px">
        <button class="btn" onclick="showSetup()" data-t="newSet"></button>
        <button class="btn ghost" id="redoBtn" onclick="redoWrong()"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-t="review"></h2>
      <div class="chips" style="margin-bottom:6px">
        <button class="chip" id="onlyWrongChip" aria-pressed="true" onclick="toggle(this);renderReview()"></button>
      </div>
      <div id="reviewList"></div>
    </div>
  </section>

  <footer data-t="footer"></footer>
  <div class="modal hidden" id="modal"><div><p id="mMsg"></p><div class="nav"><button class="btn ghost small" id="mNo"></button><button class="btn small" id="mYes"></button></div></div></div>
</div>

<script>
const T = {
  E:{title:"DSE Physics Mock MC Practice",subtitle:"Choose topics and how many questions",selAll:"Select all",selNone:"Clear",numHint:n=>`Up to ${n} question(s) available.`,
     years:"Year",topics:"Topic",ext:"Extension questions (*)",extOn:"Include * questions",extHint:"Paper 1A questions marked * involve the extension component (not for Category A students).",
     howMany:"Number of questions",all:"All",order:"Order",random:"Random",paper:"Paper order",mode:"Mode",
     practice:"Practice",exam:"Exam",practiceHint:"See the answer straight after each question.",examHint:"Timed (1.8 min per question, like the real exam). Answers shown at the end.",
     start:"Start",pool:n=>`${n} question(s) match your choices`,myWrong:"My wrong questions",
     wrongInfo:n=>n?`You have ${n} question(s) you answered wrongly before (saved on this device).`:"No wrong questions saved yet.",
     redoSaved:"Practise these",clear:"Clear",prev:"← Prev",next:"Next →",finish:"Finish",flag:"⚑ Flag",unflag:"⚑ Unflag",quit:"Quit",
     q:(i,n)=>`Question ${i} of ${n}`,correctFb:"✓ Correct!",wrongFb:k=>`✗ The answer is ${k}.`,pct:p=>` (${p}% of DSE candidates got this right)`,
     confirmFinish:n=>`${n} question(s) not answered. Finish anyway?`,confirmQuit:"Quit this set? Your answers will be lost.",
     result:"Result",scoreSub:(c,n,t)=>`${c} out of ${n} correct${t?` · time used ${t}`:""}`,topic:"Topic",correct:"Correct",

     footer:"For internal teaching use only.",timeUp:"Time is up!",ok:"OK",cancel:"Cancel",zoom:"Tap the question to enlarge",
     topicsN:{heat:"Heat",mech:"Mechanics",wave:"Waves",em:"Electricity & Magnetism",nuc:"Radioactivity & Nuclear Energy",ast:"Astronomy & Space Science",atom:"Atomic World",energy:"Energy & Use of Energy",med:"Medical Physics"}},
  C:{title:"DSE 物理 模擬試卷 多項選擇題練習",subtitle:"自選課題及題目數量",selAll:"全選",selNone:"清除",numHint:n=>`最多可選 ${n} 題。`,
     years:"年份",topics:"課題",ext:"延伸部分題目 (*)",extOn:"包括 * 題目",extHint:"卷一甲中標有 * 的題目涉及延伸部分（甲類學生毋須作答）。",
     howMany:"題目數量",all:"全部",order:"次序",random:"隨機",paper:"按試卷次序",mode:"模式",
     practice:"練習",exam:"考試",practiceHint:"每題作答後即時顯示答案。",examHint:"計時（每題 1.8 分鐘，與正式考試相同），完成後才顯示答案。",
     start:"開始",pool:n=>`共有 ${n} 題符合你的選擇`,myWrong:"我的錯題",
     wrongInfo:n=>n?`你之前答錯了 ${n} 題（儲存在此裝置）。`:"暫時未有錯題紀錄。",
     redoSaved:"練習錯題",clear:"清除",prev:"← 上一題",next:"下一題 →",finish:"完成",flag:"⚑ 標記",unflag:"⚑ 取消標記",quit:"離開",
     q:(i,n)=>`第 ${i} 題（共 ${n} 題）`,correctFb:"✓ 答對了！",wrongFb:k=>`✗ 答案是 ${k}。`,pct:p=>`（${p}% 考生答對）`,
     confirmFinish:n=>`尚有 ${n} 題未作答，確定完成？`,confirmQuit:"確定離開？你的答案將不會保留。",
     result:"成績",scoreSub:(c,n,t)=>`${n} 題中答對 ${c} 題${t?` · 用時 ${t}`:""}`,topic:"課題",correct:"答對",
     newSet:"重新選題",redo:n=>`重做 ${n} 道錯題`,review:"題目檢討",onlyWrong:"只顯示答錯／未答",
     yours:"你的答案",key:"答案",none:"—",paperQ:q=>`${q.pub==="OUP"?"牛津":"培生"} ${q.s}${q.pub==="OUP"&&q.s===2023?(q.st===2?"（第二套）":"（第一套）"):""} 模擬卷 ${q.p==="1A"?"卷一甲":"卷二"} 第 ${q.n} 題`,coTitle:"",coOn:"",coHint:"",compulsory:"必修部分（卷一甲）",electives:"選修部分（卷二）",solution:"題解",more:"補充說明",showSol:"顯示題解",
     footer:"只供校內教學用途。",timeUp:"時間到！",ok:"確定",cancel:"取消",zoom:"點擊題目可放大",
     topicsN:{heat:"熱學",mech:"力學",wave:"波動學",em:"電與磁",nuc:"放射性及核能",ast:"天文學和航天科學",atom:"原子世界",energy:"能量和能源的使用",med:"醫學物理學"}}
};
const CORE=["heat","mech","wave","em","nuc"], ELEC=["ast","atom","energy","med"], TOPICS=[...CORE,...ELEC];
let Q=[{"id":"1A-2025-01","p":"1A","s":2025,"n":"1","t":"heat","x":false,"a":"B","pub":"Pearson"},{"id":"1A-2025-02","p":"1A","s":2025,"n":"2","t":"heat","x":false,"a":"C","pub":"Pearson"},{"id":"1A-2025-03","p":"1A","s":2025,"n":"3","t":"heat","x":true,"a":"C","ex":{"E":"(1) Correct: an ideal gas has no intermolecular forces, so the molecules never stick together to form a liquid.<br>(2) Incorrect: the temperature stays the same, so the average KE of the molecules does <b>not</b> change. (Collisions with the walls do become less frequent because the volume is larger.)<br>(3) Correct: with no intermolecular forces there is no molecular PE, so internal energy = total KE of the molecules.<br>Hence (1) and (3) only → <b>C</b>.","C":"(1) 正確：理想氣體分子之間沒有作用力，分子不會聚在一起成為液體。<br>(2) 不正確：温度不變，分子的平均動能<b>不變</b>。（體積增大，分子撞擊器壁的頻率確實會下降。）<br>(3) 正確：分子之間沒有作用力，即沒有分子勢能，內能 = 所有分子動能的總和。<br>故只有 (1) 和 (3) → <b>C</b>。"},"pub":"Pearson"},{"id":"1A-2025-04","p":"1A","s":2025,"n":"4","t":"mech","x":false,"a":"B","pub":"Pearson"},{"id":"1A-2025-05","p":"1A","s":2025,"n":"5","t":"mech","x":false,"a":"D","ex":{"E":"Take right as positive: u = +5 m s<sup>−1</sup>, a = −2 m s<sup>−2</sup>, so s = 5t − t<sup>2</sup>.<br>• 0 to 2.5 s: the car still moves right but slows down → s increases with a decreasing slope.<br>• At t = 2.5 s: v = 0, the s–t graph has a turning point (slope = 0, a smooth curve, no sharp corner).<br>• After 2.5 s: the car moves left and speeds up → s decreases with an increasingly negative slope.<br>A constant acceleration gives a parabola. The graph whose slope changes smoothly in this way is <b>D</b>.","C":"取向右為正：u = +5 m s<sup>−1</sup>，a = −2 m s<sup>−2</sup>，故 s = 5t − t<sup>2</sup>。<br>• 0 至 2.5 s：汽車仍向右移動但減速 → s 上升，斜率逐漸變小。<br>• t = 2.5 s：v = 0，s–t 線圖出現轉向點（斜率為零，線圖平滑，沒有尖角）。<br>• 2.5 s 後：汽車向左加速 → s 下降，斜率越來越負。<br>恆加速度的 s–t 線圖是拋物線，斜率平滑地變化的是 <b>D</b>。"},"pub":"Pearson"},{"id":"1A-2025-06","p":"1A","s":2025,"n":"6","t":"mech","x":false,"a":"B","pub":"Pearson"},{"id":"1A-2025-07","p":"1A","s":2025,"n":"7","t":"mech","x":false,"a":"B","pub":"Pearson"},{"id":"1A-2025-08","p":"1A","s":2025,"n":"8","t":"mech","x":false,"a":"C","pub":"Pearson"},{"id":"1A-2025-09","p":"1A","s":2025,"n":"9","t":"mech","x":false,"a":"D","pub":"Pearson"},{"id":"1A-2025-10","p":"1A","s":2025,"n":"10","t":"mech","x":false,"a":"C","ex":{"E":"An action–reaction pair: (i) same type of force, (ii) equal in size, opposite in direction, (iii) acting on <b>two different</b> objects (A on B, and B on A).<br>A: weight (gravitational) and normal force are different types and both act on Peter ✗.<br>B: both act on Peter ✗.<br>C: rope on Peter and Peter on rope — same interaction, two objects ✓.<br>D: these act on two different people and come from the ground, not from each other ✗.<br>Answer <b>C</b>.","C":"作用力與反作用力：(i) 屬同一類力；(ii) 大小相等、方向相反；(iii) 分別作用在<b>兩個不同</b>的物體上（A 對 B，B 對 A）。<br>A：重量（引力）與法向力屬不同類型，而且都作用在培傑身上 ✗。<br>B：兩力都作用在培傑身上 ✗。<br>C：繩對培傑的力與培傑對繩的力，是同一相互作用中兩物體間的一對力 ✓。<br>D：兩力分別來自地面、作用在兩個人身上，並非兩人之間的相互作用 ✗。<br>答案 <b>C</b>。"},"pub":"Pearson"},{"id":"1A-2025-11","p":"1A","s":2025,"n":"11","t":"mech","x":true,"a":"C","pub":"Pearson"},{"id":"1A-2025-12","p":"1A","s":2025,"n":"12","t":"mech","x":true,"a":"B","pub":"Pearson"},{"id":"1A-2025-13","p":"1A","s":2025,"n":"13","t":"mech","x":true,"a":"B","pub":"Pearson"},{"id":"1A-2025-15","p":"1A","s":2025,"n":"15","t":"wave","x":false,"a":"D","ex":{"E":"Treat each arm of the L-shaped reflector as a plane mirror. The part of the pulse that hits the upper arm is reflected as if it came from the image of the source behind the upper arm, so it is still circular (curved) and moves away from the upper arm, downward to the right. Likewise the part hitting the lower arm moves upward to the right. The two reflected curved fronts start from the corner and spread outward → <b>D</b>.","C":"把 L 形反射器的兩邊分別當作平面鏡。射向上邊的脈衝部分被反射後，就像來自上邊後方的像點，所以仍是圓弧形，並向右下方離開上邊；同理，射向下邊的部分向右上方離開。兩段反射的弧形波陣面由角落開始向外擴散 → <b>D</b>。"},"pub":"Pearson"},{"id":"1A-2025-16","p":"1A","s":2025,"n":"16","t":"wave","x":false,"a":"A","ex":{"E":"The angle between a wavefront and the boundary equals the angle between the direction of travel and the normal. So θ<sub>1</sub> and θ<sub>2</sub> act as the angles of incidence and refraction.<br>Snell's law for waves: sin θ<sub>1</sub> / sin θ<sub>2</sub> = v<sub>1</sub> / v<sub>2</sub> ⇒ v<sub>2</sub> sin θ<sub>1</sub> = v<sub>1</sub> sin θ<sub>2</sub> → <b>A</b>.","C":"波陣面與分界線的夾角，等於傳播方向與法線的夾角，所以 θ<sub>1</sub> 和 θ<sub>2</sub> 相當於入射角和折射角。<br>波的折射定律：sin θ<sub>1</sub> / sin θ<sub>2</sub> = v<sub>1</sub> / v<sub>2</sub> ⇒ v<sub>2</sub> sin θ<sub>1</sub> = v<sub>1</sub> sin θ<sub>2</sub> → <b>A</b>。"},"pub":"Pearson"},{"id":"1A-2025-17","p":"1A","s":2025,"n":"17","t":"wave","x":true,"a":"B","pub":"Pearson"},{"id":"1A-2025-18","p":"1A","s":2025,"n":"18","t":"wave","x":false,"a":"D","ex":{"E":"Check both conditions in each scenario.<br>• Light must go from higher n to lower n. Oil → glass (1.47 → 1.5) fails this.<br>• The angle of incidence (measured from the normal) must exceed the critical angle θ<sub>c</sub> = sin<sup>−1</sup>(n<sub>2</sub>/n<sub>1</sub>). For crystal → glass, θ<sub>c</sub> = sin<sup>−1</sup>(1.5/2.15) ≈ 44°; for crystal → oil, θ<sub>c</sub> ≈ 43°. Both are larger than the 40° angle of incidence, so no TIR.<br>• Diamond → oil: θ<sub>c</sub> = sin<sup>−1</sup>(1.47/2.42) ≈ 37.4° &lt; 40°, so TIR happens → <b>D</b>.","C":"逐一檢查兩個條件：<br>• 光必須由折射率較高的介質射向較低的介質。油 → 玻璃（1.47 → 1.5）不符合。<br>• 入射角（與法線的夾角）必須大於臨界角 θ<sub>c</sub> = sin<sup>−1</sup>(n<sub>2</sub>/n<sub>1</sub>)。晶體 → 玻璃：θ<sub>c</sub> ≈ 44°；晶體 → 油：θ<sub>c</sub> ≈ 43°，兩者都大於入射角 40°，不會全內反射。<br>• 鑽石 → 油：θ<sub>c</sub> ≈ 37.4° &lt; 40°，發生全內反射 → <b>D</b>。"},"pub":"Pearson"},{"id":"1A-2025-19","p":"1A","s":2025,"n":"19","t":"wave","x":true,"a":"D","pub":"Pearson"},{"id":"1A-2025-20","p":"1A","s":2025,"n":"20","t":"wave","x":false,"a":"C","pub":"Pearson"},{"id":"1A-2025-21","p":"1A","s":2025,"n":"21","t":"wave","x":false,"a":"D","ex":{"E":"Useful reference values: threshold of hearing 0 dB, rustling leaves/whisper about 20–30 dB, normal conversation about 60 dB, vacuum cleaner about 70–80 dB, pain threshold about 120 dB. The best match is whisper 30 dB and vacuum cleaner 70 dB → <b>D</b>.","C":"常見參考值：聽覺閾 0 dB，樹葉沙沙聲／耳語約 20–30 dB，正常談話約 60 dB，吸塵機約 70–80 dB，痛覺閾約 120 dB。最吻合的是耳語 30 dB、吸塵機 70 dB → <b>D</b>。"},"pub":"Pearson"},{"id":"1A-2025-22","p":"1A","s":2025,"n":"22","t":"em","x":false,"a":"B","pub":"Pearson"},{"id":"1A-2025-23","p":"1A","s":2025,"n":"23","t":"em","x":true,"a":"C","pub":"Pearson"},{"id":"1A-2025-24","p":"1A","s":2025,"n":"24","t":"em","x":false,"a":"D","pub":"Pearson"},{"id":"1A-2025-25","p":"1A","s":2025,"n":"25","t":"em","x":false,"a":"B","pub":"Pearson"},{"id":"1A-2025-26","p":"1A","s":2025,"n":"26","t":"em","x":false,"a":"A","pub":"Pearson"},{"id":"1A-2025-27","p":"1A","s":2025,"n":"27","t":"em","x":false,"a":"A","ex":{"E":"(1) Correct: by Lenz's law the solenoid opposes the motion of the magnet. The induced pole at the top attracts the receding magnet, which fixes the current direction through the resistor as X → Y.<br>(2) Incorrect: at the lowest point the magnet is momentarily at rest, so the rate of change of flux (and the current) is zero.<br>(3) Incorrect: electrical energy is dissipated as heat in the resistor, so the oscillation is damped and the amplitude decreases.<br>Answer: (1) only → <b>A</b>.","C":"(1) 正確：根據楞次定律，螺線管會反抗磁鐵的運動；磁鐵離開時，頂部感生的磁極吸引磁鐵，由此定出流經電阻器的電流方向為 X → Y。<br>(2) 不正確：磁鐵在最低點時瞬間靜止，磁通量的變率為零，感生電流亦為零。<br>(3) 不正確：電能在電阻器中轉為熱能散失，振動受阻尼，振幅逐漸減小。<br>答案：只有 (1) → <b>A</b>。"},"pub":"Pearson"},{"id":"1A-2025-28","p":"1A","s":2025,"n":"28","t":"em","x":true,"a":"D","pub":"Pearson"},{"id":"1A-2025-29","p":"1A","s":2025,"n":"29","t":"em","x":true,"a":"A","pub":"Pearson"},{"id":"1A-2025-30","p":"1A","s":2025,"n":"30","t":"em","x":false,"a":"B","ex":{"E":"All batteries and internal resistances are identical. The larger the external resistance R<sub>ext</sub>, the smaller the current, the smaller the voltage lost across the internal resistance, and so the larger the voltmeter reading (V = ε − Ir).<br>External resistance: circuit 1 = 2R, circuit 2 = R/2, circuit 3 = 3R/2, circuit 4 = R.<br>So V<sub>2</sub> &lt; V<sub>4</sub> &lt; V<sub>3</sub> &lt; V<sub>1</sub> → <b>B</b>.","C":"各電池及內阻相同。外電阻 R<sub>外</sub> 越大，電流越小，內阻上的電壓損失越小，伏特計讀數（V = ε − Ir）越大。<br>外電阻：電路 1 = 2R，電路 2 = R/2，電路 3 = 3R/2，電路 4 = R。<br>故 V<sub>2</sub> &lt; V<sub>4</sub> &lt; V<sub>3</sub> &lt; V<sub>1</sub> → <b>B</b>。"},"pub":"Pearson"},{"id":"1A-2025-31","p":"1A","s":2025,"n":"31","t":"nuc","x":false,"a":"D","ex":{"E":"Track (A, Z): Po-216 is (216, 84). α: A − 4, Z − 2 → R = (212, 82). β: Z + 1 → S = (212, 83). β → T = (212, 84). α → U = (208, 82).<br>(1) R and U both have Z = 82, so they are isotopes ✓.<br>(2) Neutrons: Po-216 has 216 − 84 = 132 and U has 208 − 82 = 126, which is 6 fewer ✓.<br>(3) S → β → (212, 84) → α → (208, 82) = U ✓.<br>Answer <b>D</b>.","C":"追蹤 (A, Z)：釙-216 為 (216, 84)。α 衰變：A − 4、Z − 2 → R = (212, 82)；β 衰變：Z + 1 → S = (212, 83)；β → T = (212, 84)；α → U = (208, 82)。<br>(1) R 和 U 的 Z 同為 82，屬同位素 ✓。<br>(2) 中子數：釙-216 為 216 − 84 = 132，U 為 208 − 82 = 126，少 6 個 ✓。<br>(3) S 先 β 衰變 → (212, 84)，再 α 衰變 → (208, 82) = U ✓。<br>答案 <b>D</b>。"},"pub":"Pearson"},{"id":"1A-2025-32","p":"1A","s":2025,"n":"32","t":"nuc","x":true,"a":"C","pub":"Pearson"},{"id":"1A-2025-33","p":"1A","s":2025,"n":"33","t":"nuc","x":true,"a":"B","pub":"Pearson"},{"id":"P2-2025-11","p":"P2","s":2025,"n":"1.1","t":"ast","x":false,"a":"B","pub":"Pearson"},{"id":"P2-2025-12","p":"P2","s":2025,"n":"1.2","t":"ast","x":false,"a":"B","pub":"Pearson"},{"id":"P2-2025-13","p":"P2","s":2025,"n":"1.3","t":"ast","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2025-14","p":"P2","s":2025,"n":"1.4","t":"ast","x":false,"a":"C","ex":{"E":"(1) Retrograde motion of Mars can be explained by both models (the geocentric model uses epicycles), so it does not specially support the heliocentric model.<br>(2) Galileo saw moons orbiting Jupiter: not everything orbits the Earth.<br>(3) Venus shows a full set of phases, which only works if Venus orbits the Sun.<br>Answer: (2) and (3) only → <b>C</b>.","C":"(1) 火星逆行可以用兩個模型解釋（地心說用本輪），並非特別支持日心說。<br>(2) 伽利略觀察到衞星環繞木星運行，說明並非所有天體都環繞地球。<br>(3) 金星呈現完整的位相變化，只有金星環繞太陽運行才能解釋。<br>答案：只有 (2) 和 (3) → <b>C</b>。"},"pub":"Pearson"},{"id":"P2-2025-15","p":"P2","s":2025,"n":"1.5","t":"ast","x":false,"a":"A","ex":{"E":"Luminosity depends on the absolute magnitude M: the smaller (more negative) M is, the more luminous the star. Deneb (M = −8.38) is the most luminous.<br>Distance: m − M = 5 log(d/10 pc). The more negative m − M is, the closer the star. Sirius A: m − M = −1.44 − 1.42 = −2.86, the most negative, so it is the closest.<br>Answer <b>A</b>.","C":"光度由絕對星等 M 決定：M 越小（越負），光度越大。天津四（M = −8.38）光度最大。<br>距離：m − M = 5 log(d/10 pc)，m − M 越負，恆星越近。天狼星A：m − M = −1.44 − 1.42 = −2.86，最負，所以最近。<br>答案 <b>A</b>。"},"pub":"Pearson"},{"id":"P2-2025-16","p":"P2","s":2025,"n":"1.6","t":"ast","x":false,"a":"A","pub":"Pearson"},{"id":"P2-2025-17","p":"P2","s":2025,"n":"1.7","t":"ast","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2025-18","p":"P2","s":2025,"n":"1.8","t":"ast","x":false,"a":"A","ex":{"E":"Dark dips in a star's continuous spectrum are absorption lines from elements in its outer atmosphere. Compare the wavelengths of the dips with each element's lab spectrum: the dips line up only with the hydrogen lines (e.g. about 410, 434, 486 and 656 nm). Helium, carbon and oxygen lines have no matching dips. → <b>A</b>.","C":"恆星連續光譜上的暗陷，是其外層大氣中元素造成的吸收線。把暗陷的波長與各元素的實驗室譜線比較：只與氫的譜線（約 410、434、486、656 nm）吻合，氦、碳、氧的譜線都沒有對應的暗陷 → <b>A</b>。"},"pub":"Pearson"},{"id":"P2-2025-21","p":"P2","s":2025,"n":"2.1","t":"atom","x":false,"a":"D","ex":{"E":"Rutherford's α-scattering showed that (i) most α particles pass straight through, so an atom is mostly empty space; (ii) a few are deflected through large angles, so there is a tiny, dense, <b>positive</b> nucleus holding most of the mass; and so the electrons must be outside the nucleus. Neutrons are neutral and do not affect the α particles. They were discovered later (Chadwick, 1932). → <b>D</b>.","C":"盧瑟福 α 粒子散射實驗顯示：(i) 大部分 α 粒子直穿，原子大部分是空的；(ii) 少數大角度偏折，原子中心有一個體積極小、密度極高、帶<b>正電</b>的原子核，集中了大部分質量；故電子位於原子核外。中子不帶電，不影響 α 粒子，要到 1932 年才由查德威克發現 → <b>D</b>。"},"pub":"Pearson"},{"id":"P2-2025-22","p":"P2","s":2025,"n":"2.2","t":"atom","x":false,"a":"A","ex":{"E":"(1) Using the Coulomb force as the centripetal force is classical physics ✗.<br>(2) Classically an accelerating (orbiting) charge radiates EM waves, loses energy and spirals into the nucleus. Bohr postulated stable orbits with no radiation, which violates classical physics ✓.<br>(3) A negative total energy just means a bound (attractive) system, which is also true classically ✗.<br>Answer: (2) only → <b>A</b>.","C":"(1) 以靜電力作向心力，屬經典物理 ✗。<br>(2) 根據經典物理，作圓周運動的加速電荷會輻射電磁波、損失能量並墜向原子核；玻爾假設電子在穩定軌道上不輻射，違反經典物理 ✓。<br>(3) 總能量為負只表示系統受束縛（吸引），在經典物理中亦成立 ✗。<br>答案：只有 (2) → <b>A</b>。"},"pub":"Pearson"},{"id":"P2-2025-23","p":"P2","s":2025,"n":"2.3","t":"atom","x":false,"a":"B","pub":"Pearson"},{"id":"P2-2025-24","p":"P2","s":2025,"n":"2.4","t":"atom","x":false,"a":"D","ex":{"E":"Below the threshold frequency f<sub>0</sub> there is no photocurrent, so I = 0 for f &lt; f<sub>0</sub>.<br>Above f<sub>0</sub>: the light power P = Nhf is fixed, so the number of photons per second N = P/(hf) ∝ 1/f. The maximum (saturation) current I ∝ N ∝ 1/f, so I jumps up at f<sub>0</sub> and then decreases as f increases → <b>D</b>.","C":"頻率低於臨閾頻率 f<sub>0</sub> 時沒有光電流，故 f &lt; f<sub>0</sub> 時 I = 0。<br>高於 f<sub>0</sub>：光功率 P = Nhf 固定，每秒光子數 N = P/(hf) ∝ 1/f；最大（飽和）電流 I ∝ N ∝ 1/f，故 I 在 f<sub>0</sub> 處開始出現，隨後隨 f 增大而減小 → <b>D</b>。"},"pub":"Pearson"},{"id":"P2-2025-25","p":"P2","s":2025,"n":"2.5","t":"atom","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2025-26","p":"P2","s":2025,"n":"2.6","t":"atom","x":false,"a":"B","pub":"Pearson"},{"id":"P2-2025-27","p":"P2","s":2025,"n":"2.7","t":"atom","x":false,"a":"C","ex":{"E":"Electrons are charged, so a <b>magnetic field</b> (produced by coils, called magnetic lenses) can bend their paths and bring them to a focus, just as glass lenses focus light. A high voltage only accelerates them (shortening λ), and option D describes an STM. → <b>C</b>.","C":"電子帶電，可利用線圈產生的<b>磁場</b>（磁透鏡）使其路徑偏折而聚焦，好像玻璃透鏡使光聚焦一樣。高電壓只用於加速電子（使 λ 變短），選項 D 描述的是掃描隧穿顯微鏡 → <b>C</b>。"},"pub":"Pearson"},{"id":"P2-2025-28","p":"P2","s":2025,"n":"2.8","t":"atom","x":false,"a":"A","ex":{"E":"Catalysis happens at the surface. Breaking the metal into nanoparticles greatly increases the surface-area-to-volume ratio, so more metal atoms are exposed for reactions. This makes the converter more effective with less precious metal → <b>A</b>.","C":"催化反應在表面進行。把金屬製成納米顆粒，表面面積對體積之比大大增加，更多金屬原子暴露出來參與反應，用較少貴金屬便得到更好的效果 → <b>A</b>。"},"pub":"Pearson"},{"id":"P2-2025-31","p":"P2","s":2025,"n":"3.1","t":"energy","x":false,"a":"B","pub":"Pearson"},{"id":"P2-2025-32","p":"P2","s":2025,"n":"3.2","t":"energy","x":false,"a":"A","pub":"Pearson"},{"id":"P2-2025-33","p":"P2","s":2025,"n":"3.3","t":"energy","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2025-34","p":"P2","s":2025,"n":"3.4","t":"energy","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2025-35","p":"P2","s":2025,"n":"3.5","t":"energy","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2025-36","p":"P2","s":2025,"n":"3.6","t":"energy","x":false,"a":"B","pub":"Pearson"},{"id":"P2-2025-37","p":"P2","s":2025,"n":"3.7","t":"energy","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2025-38","p":"P2","s":2025,"n":"3.8","t":"energy","x":false,"a":"B","pub":"Pearson"},{"id":"P2-2025-41","p":"P2","s":2025,"n":"4.1","t":"med","x":false,"a":"D","ex":{"E":"Rayleigh criterion: the minimum angular separation θ ≈ 1.22λ/d, where d is the pupil diameter. In daylight the pupil becomes smaller (d ↓), so θ<sub>min</sub> increases, which makes the resolution worse. The angle subtended by the bulbs (≈ d<sub>bulbs</sub>/s) must be at least θ<sub>min</sub>, so the bulbs must be moved further apart (or Peter must move closer) → <b>D</b>.","C":"瑞利判據：最小可分辨角 θ ≈ 1.22λ/d（d 為瞳孔直徑）。日光下瞳孔變小（d ↓），θ<sub>min</sub> 增大，分辨能力變差。燈泡所張的角（≈ 燈距/s）必須不小於 θ<sub>min</sub>，故要把燈泡分得更開（或走近一點）→ <b>D</b>。"},"pub":"Pearson"},{"id":"P2-2025-42","p":"P2","s":2025,"n":"4.2","t":"med","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2025-43","p":"P2","s":2025,"n":"4.3","t":"med","x":false,"a":"A","ex":{"E":"Damage to the eardrum or the ear bones (the conductive path) reduces the transmission of sound at <b>all</b> frequencies. The whole threshold curve is shifted upward while keeping roughly its normal shape. Andrew's curve (A) is raised by about 60 dB across the whole range → <b>A</b>. (A dip or peak only near certain frequencies, such as around 4 kHz, suggests damage to the inner ear instead.)","C":"耳膜或聽小骨（傳導部分）受損，會令<b>所有</b>頻率的聲音傳導都減弱，整條聽覺閾曲線上移，但形狀大致不變。安德魯（A）的曲線在整個頻率範圍上移約 60 dB → <b>A</b>。（只在某些頻率附近出現突變，例如約 4 kHz，較可能是內耳受損。）"},"pub":"Pearson"},{"id":"P2-2025-44","p":"P2","s":2025,"n":"4.4","t":"med","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2025-45","p":"P2","s":2025,"n":"4.5","t":"med","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2025-46","p":"P2","s":2025,"n":"4.6","t":"med","x":false,"a":"B","pub":"Pearson"},{"id":"P2-2025-47","p":"P2","s":2025,"n":"4.7","t":"med","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2025-48","p":"P2","s":2025,"n":"4.8","t":"med","x":false,"a":"A","pub":"Pearson"},{"id":"1A-2026-01","p":"1A","s":2026,"n":"1","t":"heat","x":false,"a":"B","ex":{"E":"Heat capacity C = Q/ΔT is the energy needed to raise the temperature of the <b>whole body</b> by 1 °C; it is proportional to mass (C = mc).<br>A: that describes specific heat capacity ✗. B: a bucket of water has a larger mass, so a larger C ✓. C: if C is the same, the energy per °C is the same whatever the material ✗. D: 4200 J kg<sup>−1</sup> °C<sup>−1</sup> is the specific heat capacity of water (per kg), not its heat capacity ✗.<br>Answer <b>B</b>.","C":"熱容量 C = Q/ΔT，是使<b>整個物體</b>温度升高 1 °C 所需的能量，與質量成正比（C = mc）。<br>A：那是比熱容量的定義 ✗。B：一桶水質量較大，熱容量較大 ✓。C：熱容量相同，每升高 1 °C 所需能量就相同，與物料無關 ✗。D：4200 J kg<sup>−1</sup> °C<sup>−1</sup> 是水的比熱容量（每 kg），並非熱容量 ✗。<br>答案 <b>B</b>。"},"pub":"Pearson"},{"id":"1A-2026-02","p":"1A","s":2026,"n":"2","t":"heat","x":false,"a":"D","pub":"Pearson"},{"id":"1A-2026-03","p":"1A","s":2026,"n":"3","t":"heat","x":true,"a":"A","ex":{"E":"For a fixed volume, pV = nRT ⇒ p = (nR/V)·T<sub>K</sub>, so the slope of the p–T graph is proportional to n.<br>(1) Gas X has the steeper line, so it has more moles ✓.<br>(2) Mass = n × molar mass. The molar masses are unknown, so the masses cannot be compared ✗.<br>(3) At the same temperature the average KE per molecule is the same, but c<sub>rms</sub> = √(3kT/m) also depends on the molecular mass, which is unknown ✗.<br>Answer: (1) only → <b>A</b>.","C":"體積固定時，pV = nRT ⇒ p = (nR/V)·T<sub>K</sub>，p–T 線圖的斜率與 n 成正比。<br>(1) 氣體 X 的斜率較大，摩爾數較多 ✓。<br>(2) 質量 = n × 摩爾質量，摩爾質量未知，無法比較 ✗。<br>(3) 同一温度下分子的平均動能相同，但 c<sub>rms</sub> = √(3kT/m) 亦取決於分子質量，而分子質量未知 ✗。<br>答案：只有 (1) → <b>A</b>。"},"pub":"Pearson"},{"id":"1A-2026-04","p":"1A","s":2026,"n":"4","t":"mech","x":false,"a":"C","pub":"Pearson"},{"id":"1A-2026-05","p":"1A","s":2026,"n":"5","t":"mech","x":false,"a":"C","ex":{"E":"Friction is constant and opposes the motion, so the block decelerates uniformly: the s–t graph rises with a gradually decreasing slope (a curve bending down). Once the block stops, friction does not push it back, so s stays constant and the graph becomes a horizontal line. The only graph that curves and then levels off is <b>C</b>.","C":"摩擦力恆定並阻礙運動，金屬塊作勻減速：s–t 線圖上升而斜率逐漸變小（向下彎）。金屬塊停下後，摩擦力不會把它推回，s 保持不變，線圖變成水平線。先彎曲後變平的線圖是 <b>C</b>。"},"pub":"Pearson"},{"id":"1A-2026-06","p":"1A","s":2026,"n":"6","t":"mech","x":false,"a":"A","ex":{"E":"(1) Normal force on the person by the ground and the weight of the person act on the <b>same</b> body and are different types of force, so they are not a pair (they only balance) ✗.<br>(2) Rope on block and block on rope: same contact interaction between two bodies ✓.<br>(3) Air resistance and gravity both act on the raindrop ✗.<br>Answer: (2) only → <b>A</b>.","C":"(1) 地面對人的法向力和人的重量作用在<b>同一</b>物體上，而且屬不同類型的力，只是互相平衡，不是作用與反作用 ✗。<br>(2) 繩對方塊的拉力和方塊對繩的力：兩物體之間同一接觸作用的一對力 ✓。<br>(3) 空氣阻力和重力都作用在雨點上 ✗。<br>答案：只有 (2) → <b>A</b>。"},"pub":"Pearson"},{"id":"1A-2026-07","p":"1A","s":2026,"n":"7","t":"mech","x":false,"a":"B","pub":"Pearson"},{"id":"1A-2026-08","p":"1A","s":2026,"n":"8","t":"mech","x":false,"a":"B","ex":{"E":"(1) F = mg tan 30° = 28.3 N, not 24.5 N ✗. (2) F = mg tan 30° depends on m ✗.<br>(3) Vertically T cos 30° = mg; horizontally T sin 30° = F, so T = √(F<sup>2</sup> + (mg)<sup>2</sup>). If F increases, T increases ✓.<br>Answer: (3) only → <b>B</b>.","C":"(1) F = mg tan 30° = 28.3 N，不是 24.5 N ✗。(2) F = mg tan 30°，與 m 有關 ✗。<br>(3) 鉛垂方向 T cos 30° = mg，水平方向 T sin 30° = F，故 T = √(F<sup>2</sup> + (mg)<sup>2</sup>)。F 增大，T 隨之增大 ✓。<br>答案：只有 (3) → <b>B</b>。"},"pub":"Pearson"},{"id":"1A-2026-09","p":"1A","s":2026,"n":"9","t":"mech","x":false,"a":"A","pub":"Pearson"},{"id":"1A-2026-10","p":"1A","s":2026,"n":"10","t":"mech","x":false,"a":"D","pub":"Pearson"},{"id":"1A-2026-11","p":"1A","s":2026,"n":"11","t":"mech","x":true,"a":"B","ex":{"E":"(1) Thrown upward, the ball first rises and then falls from a greater height, so the time of flight is longer ✗.<br>(2) Energy conservation: ½mv<sub>land</sub><sup>2</sup> = ½mu<sup>2</sup> + mgh. With the same initial speed u and the same drop height h, the landing speed is the same ✓.<br>(3) The horizontal velocity component (u cos θ) and the time of flight both change, so the range changes ✗.<br>Answer: (2) only → <b>B</b>.","C":"(1) 斜向上拋出時，鉛球先上升再下落，飛行時間較長 ✗。<br>(2) 能量守恆：½mv<sub>落地</sub><sup>2</sup> = ½mu<sup>2</sup> + mgh。初速率 u 與下落高度 h 相同，落地速率相同 ✓。<br>(3) 水平速度分量（u cos θ）和飛行時間都改變，水平距離改變 ✗。<br>答案：只有 (2) → <b>B</b>。"},"pub":"Pearson"},{"id":"1A-2026-12","p":"1A","s":2026,"n":"12","t":"mech","x":true,"a":"D","pub":"Pearson"},{"id":"1A-2026-13","p":"1A","s":2026,"n":"13","t":"wave","x":false,"a":"D","ex":{"E":"The ray enters normally, so it is not bent at the first face. It then meets the slanted face with an angle of incidence of 45°. The critical angle is θ<sub>c</sub> = sin<sup>−1</sup>(1/1.35) = 47.8°. Since 45° &lt; 47.8°, total internal reflection does <b>not</b> occur. The ray refracts out into the air, bending <b>away</b> from the normal (angle of refraction = sin<sup>−1</sup>(1.35 sin 45°) ≈ 73°), with a weak partially reflected ray → <b>D</b>.","C":"光線垂直射入，在第一個面不會偏折；到達斜面時入射角為 45°。臨界角 θ<sub>c</sub> = sin<sup>−1</sup>(1/1.35) = 47.8°。由於 45° &lt; 47.8°，<b>不會</b>發生全內反射。光線折射進入空氣並<b>偏離</b>法線（折射角 = sin<sup>−1</sup>(1.35 sin 45°) ≈ 73°），另有較弱的部分反射光 → <b>D</b>。"},"pub":"Pearson"},{"id":"1A-2026-14","p":"1A","s":2026,"n":"14","t":"wave","x":false,"a":"D","pub":"Pearson"},{"id":"1A-2026-15","p":"1A","s":2026,"n":"15","t":"wave","x":false,"a":"A","ex":{"E":"Separation = 12 cm = 4λ.<br>(1) On a nodal line the path difference is a <b>half-integer</b> multiple of λ, i.e. (n + ½)λ, not nλ ✗.<br>(2) Antinodal lines have path difference nλ with |nλ| &lt; 12 cm, so n = −3 … +3, giving 7 antinodal lines between the sources, not 8 ✗.<br>(3) Along S<sub>1</sub>S<sub>2</sub> a stationary wave forms. Adjacent antinodes are λ/2 apart, so the central antinode and the next node are λ/4 apart ✓.<br>Answer: (3) only → <b>A</b>.","C":"兩波源相距 12 cm = 4λ。<br>(1) 節線上各點的程差是 λ 的<b>半整數</b>倍，即 (n + ½)λ，不是 nλ ✗。<br>(2) 腹線上程差 = nλ，且 |nλ| &lt; 12 cm，故 n = −3 … +3，兩波源之間共有 7 條腹線，不是 8 條 ✗。<br>(3) 在 S<sub>1</sub>S<sub>2</sub> 連線上形成駐波，相鄰波腹相距 λ/2，中央波腹與相鄰波節相距 λ/4 ✓。<br>答案：只有 (3) → <b>A</b>。"},"pub":"Pearson"},{"id":"1A-2026-16","p":"1A","s":2026,"n":"16","t":"wave","x":true,"a":"B","pub":"Pearson"},{"id":"1A-2026-17","p":"1A","s":2026,"n":"17","t":"wave","x":false,"a":"C","ex":{"E":"Fringe separation Δy = λD/a. Moving the screen further away increases D.<br>(1) The same light energy is spread over a larger area, so each fringe is dimmer ✓.<br>(2) Δy increases, not decreases ✗.<br>(3) The fringes are more widely spaced, so fewer of them fit on a screen of finite size ✓.<br>Answer: (1) and (3) only → <b>C</b>.","C":"條紋間距 Δy = λD/a，屏幕移遠即 D 增大。<br>(1) 同樣的光能分佈在較大的面積上，每條亮紋變暗 ✓。<br>(2) Δy 增大，不是減小 ✗。<br>(3) 條紋間距增大，有限大小的屏幕上可見的亮紋數目減少 ✓。<br>答案：只有 (1) 和 (3) → <b>C</b>。"},"pub":"Pearson"},{"id":"1A-2026-18","p":"1A","s":2026,"n":"18","t":"wave","x":true,"a":"D","pub":"Pearson"},{"id":"1A-2026-19","p":"1A","s":2026,"n":"19","t":"wave","x":false,"a":"A","ex":{"E":"(1) Reflection does not change the frequency ✓.<br>(2) Some energy is absorbed by the walls and the sound spreads out, so the echo has a smaller amplitude ✓.<br>(3) The echo travels in the same air at the same speed. Since λ = v/f and both are unchanged, λ is unchanged ✗.<br>Answer: (1) and (2) only → <b>A</b>.","C":"(1) 反射不會改變頻率 ✓。<br>(2) 部分能量被牆壁吸收，聲音亦向外擴散，回聲振幅較小 ✓。<br>(3) 回聲在同一空氣中傳播，速率不變；λ = v/f，v 和 f 不變，λ 亦不變 ✗。<br>答案：只有 (1) 和 (2) → <b>A</b>。"},"pub":"Pearson"},{"id":"1A-2026-20","p":"1A","s":2026,"n":"20","t":"wave","x":false,"a":"D","ex":{"E":"(1) Quality (timbre) depends on the <b>waveform</b> (the mix of overtones); frequency sets the pitch ✗.<br>(2) A larger force gives a larger amplitude and hence a louder sound ✓.<br>(3) Same pitch means the same frequency. Both sounds travel in air at the same speed, so λ = v/f is the same ✓.<br>Answer: (2) and (3) only → <b>D</b>.","C":"(1) 音品（音色）取決於<b>波形</b>（泛音的組合）；頻率決定音調 ✗。<br>(2) 用力較大，振幅較大，響度較大 ✓。<br>(3) 音調相同即頻率相同；兩者都在空氣中傳播，速率相同，故 λ = v/f 相同 ✓。<br>答案：只有 (2) 和 (3) → <b>D</b>。"},"pub":"Pearson"},{"id":"1A-2026-21","p":"1A","s":2026,"n":"21","t":"em","x":false,"a":"B","ex":{"E":"Repulsion only happens between two charged bodies with like charges, so Y and Z <b>must</b> carry like charges ✓ (3).<br>Attraction can happen between opposite charges <b>or</b> between a charged body and a neutral body (by induction). So X may be neutral: (1) and (2) are not necessarily true.<br>Answer: (3) only → <b>B</b>.","C":"只有帶同種電荷的兩個物體才會互相排斥，故 Y 和 Z <b>必定</b>帶同種電荷 (3) ✓。<br>互相吸引可以是異種電荷，<b>亦可以</b>是帶電體吸引中性物體（感應起電）。X 可能是中性的，故 (1) 和 (2) 不一定正確。<br>答案：只有 (3) → <b>B</b>。"},"pub":"Pearson"},{"id":"1A-2026-22","p":"1A","s":2026,"n":"22","t":"em","x":true,"a":"C","pub":"Pearson"},{"id":"1A-2026-23","p":"1A","s":2026,"n":"23","t":"em","x":false,"a":"A","ex":{"E":"Bulbs X and Y are in series, and this branch is in parallel with Z across an ideal battery, so Z always gets the full battery voltage (its brightness never changes).<br>If X becomes a short circuit, X has no voltage and goes out, while Y now gets the whole battery voltage instead of half → Y becomes brighter.<br>If X became an open circuit, Y would go out too. So the cause is <b>A</b>.","C":"燈泡 X 和 Y 串聯，這一支路與 Z 並聯接到理想電池，所以 Z 的電壓始終等於電池電壓，亮度不變。<br>若 X 短路，X 兩端沒有電壓而熄滅；Y 由原本分得一半電壓變為取得全部電池電壓 → 變亮。<br>若 X 斷路，Y 亦會熄滅。故原因是 <b>A</b>。"},"pub":"Pearson"},{"id":"1A-2026-24","p":"1A","s":2026,"n":"24","t":"em","x":false,"a":"C","pub":"Pearson"},{"id":"1A-2026-25","p":"1A","s":2026,"n":"25","t":"em","x":false,"a":"B","ex":{"E":"Overloading means too large a current. A <b>fuse</b> melts and a <b>circuit breaker</b> trips to cut off the circuit when the current is too large.<br>The <b>earth wire</b> provides a low-resistance path to earth so that a user does not get an electric shock if the metal casing becomes live. It does not cut off an overload by itself.<br>Answer: (1) and (2) only → <b>B</b>.","C":"超負荷即電流過大。電流過大時，<b>保險絲</b>熔斷、<b>斷路器</b>跳掣，切斷電路。<br><b>地線</b>提供低電阻通路到地，金屬外殼帶電時保護用戶免觸電，但它本身不能切斷超負荷的電路。<br>答案：只有 (1) 和 (2) → <b>B</b>。"},"pub":"Pearson"},{"id":"1A-2026-26","p":"1A","s":2026,"n":"26","t":"em","x":true,"a":"B","ex":{"E":"(1) The magnetic force is always perpendicular to v, so it changes the direction but not the speed: the velocity changes while KE is constant ✓.<br>(2) qvB provides the centripetal force: qvB = mv<sup>2</sup>/r ✓.<br>(3) T = 2πm/(qB): a stronger B gives a <b>shorter</b> period ✗.<br>Answer: (1) and (2) only → <b>B</b>.","C":"(1) 磁力恆與速度垂直，只改變方向不改變速率：速度不斷改變，動能不變 ✓。<br>(2) 磁力 qvB 提供向心力：qvB = mv<sup>2</sup>/r ✓。<br>(3) T = 2πm/(qB)：B 越大，週期越<b>短</b> ✗。<br>答案：只有 (1) 和 (2) → <b>B</b>。"},"pub":"Pearson"},{"id":"1A-2026-27","p":"1A","s":2026,"n":"27","t":"em","x":false,"a":"A","pub":"Pearson"},{"id":"1A-2026-28","p":"1A","s":2026,"n":"28","t":"em","x":true,"a":"C","pub":"Pearson"},{"id":"1A-2026-29","p":"1A","s":2026,"n":"29","t":"em","x":true,"a":"C","pub":"Pearson"},{"id":"1A-2026-30","p":"1A","s":2026,"n":"30","t":"em","x":true,"a":"C","ex":{"E":"P = V<sub>rms</sub><sup>2</sup>/R.<br>(1) V<sub>rms</sub> → √2 V<sub>rms</sub> gives P → 2P ✓.<br>(2) The power of a resistor does not depend on the frequency ✗.<br>(3) R → R/2 gives P → 2P ✓.<br>Answer: (1) and (3) only → <b>C</b>.","C":"P = V<sub>rms</sub><sup>2</sup>/R。<br>(1) V<sub>rms</sub> → √2 V<sub>rms</sub>，P → 2P ✓。<br>(2) 電阻器的功率與頻率無關 ✗。<br>(3) R → R/2，P → 2P ✓。<br>答案：只有 (1) 和 (3) → <b>C</b>。"},"pub":"Pearson"},{"id":"1A-2026-31","p":"1A","s":2026,"n":"31","t":"nuc","x":false,"a":"D","ex":{"E":"(1) k = ln 2 / t<sub>½</sub>, so k<sub>I</sub>/k<sub>Co</sub> = (5.27 × 365)/8.0 ≈ 240 ✓.<br>(2) After 4 half-lives (32 days), I-131 has dropped to 1/16 &lt; 1/10, so it reaches 1/10 in under 32 days. Co-60 needs 5.27 years to reach 1/2 ✓.<br>(3) A = kN. For the same A, the nuclide with the smaller k (Co-60) must have more nuclei ✓.<br>Answer <b>D</b>.","C":"(1) k = ln 2 / t<sub>½</sub>，k<sub>碘</sub>/k<sub>鈷</sub> = (5.27 × 365)/8.0 ≈ 240 ✓。<br>(2) 4 個半衰期（32 日）後，碘-131 已降至 1/16 &lt; 1/10，所以降到 1/10 不足 32 日；鈷-60 要 5.27 年才降至 1/2 ✓。<br>(3) A = kN，放射強度相同時，k 較小的鈷-60 原子核數目較多 ✓。<br>答案 <b>D</b>。"},"pub":"Pearson"},{"id":"1A-2026-32","p":"1A","s":2026,"n":"32","t":"nuc","x":true,"a":"B","pub":"Pearson"},{"id":"1A-2026-33","p":"1A","s":2026,"n":"33","t":"nuc","x":false,"a":"A","ex":{"E":"(1) Correct: this is the definition of fission and fusion.<br>(2) Incorrect: fission products are medium-mass nuclei (U-235 is the <b>fuel</b>), and fusion can produce radioactive products such as tritium.<br>(3) Incorrect: in both reactions the total mass <b>decreases</b>; the mass defect is released as energy (E = Δmc<sup>2</sup>).<br>Answer: (1) only → <b>A</b>.","C":"(1) 正確：這是核裂變和核聚變的定義。<br>(2) 不正確：核裂變的產物是中等質量的原子核（鈾-235 是<b>燃料</b>），核聚變亦可能產生放射性產物（如氚）。<br>(3) 不正確：兩種反應的總質量都<b>減少</b>，質量虧損以能量釋放（E = Δmc<sup>2</sup>）。<br>答案：只有 (1) → <b>A</b>。"},"pub":"Pearson"},{"id":"P2-2026-11","p":"P2","s":2026,"n":"1.1","t":"ast","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2026-13","p":"P2","s":2026,"n":"1.3","t":"ast","x":false,"a":"B","pub":"Pearson"},{"id":"P2-2026-14","p":"P2","s":2026,"n":"1.4","t":"ast","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2026-16","p":"P2","s":2026,"n":"1.6","t":"ast","x":false,"a":"B","ex":{"E":"Kepler's 2nd law: the line joining the Sun and the comet sweeps out equal areas in equal times. Since A<sub>1</sub> = A<sub>2</sub>, t<sub>1</sub> = t<sub>2</sub> ✓ (3).<br>(1) PQ is nearer the Sun, so the arc PQ is longer than RS for the same time, and the average speeds are different ✗.<br>(2) From P to Q the comet is moving away from perihelion (the point nearest the Sun), so it is slowing down. From R to S it is moving towards perihelion, so it is speeding up. This is the opposite of statement (2) ✗.<br>Answer: (3) only → <b>B</b>.","C":"開普勒第二定律：太陽與彗星的連線在相等時間內掃過相等面積。A<sub>1</sub> = A<sub>2</sub>，故 t<sub>1</sub> = t<sub>2</sub> (3) ✓。<br>(1) PQ 段較近太陽，相同時間內走過的弧長較 RS 長，平均速率不同 ✗。<br>(2) 由 P 至 Q，彗星正遠離近日點，速率減慢；由 R 至 S，彗星正移向近日點，速率加快。與描述 (2) 剛好相反 ✗。<br>答案：只有 (3) → <b>B</b>。"},"pub":"Pearson"},{"id":"P2-2026-17","p":"P2","s":2026,"n":"1.7","t":"ast","x":false,"a":"A","ex":{"E":"(1) Luminosity is compared using the absolute magnitude: X (−1.0) is smaller than Y (0.0), so X is more luminous ✓.<br>(2) Apparent brightness is compared using the apparent magnitude: Y (−1.5) is the smallest, so Y is the <b>brightest</b>, not the dimmest ✗.<br>(3) m − M = 5 log(d/10 pc): X 5.5, Y −1.5, Z 1.5. Y has the most negative value, so Y is the closest ✗.<br>Answer: (1) only → <b>A</b>.","C":"(1) 比較光度用絕對星等：X（−1.0）小於 Y（0.0），X 光度較大 ✓。<br>(2) 比較視亮度用視星等：Y（−1.5）最小，Y 看起來<b>最亮</b>，不是最暗 ✗。<br>(3) m − M = 5 log(d/10 pc)：X 為 5.5，Y 為 −1.5，Z 為 1.5；Y 的值最負，Y 最近 ✗。<br>答案：只有 (1) → <b>A</b>。"},"pub":"Pearson"},{"id":"P2-2026-18","p":"P2","s":2026,"n":"1.8","t":"ast","x":false,"a":"A","ex":{"E":"Spectral classes O B A F G K M run from hottest to coolest.<br>(1) K is cooler than G ✗.<br>(2) Wien's law λ<sub>max</sub>T = constant: hotter O stars have a <b>shorter</b> peak wavelength than M stars ✗.<br>(3) Blue stars are hotter than yellow stars ✓.<br>Answer: (3) only → <b>A</b>.","C":"光譜型 O B A F G K M 由最熱排到最冷。<br>(1) K 型比 G 型冷 ✗。<br>(2) 維恩定律 λ<sub>max</sub>T = 常數：較熱的 O 型星峰值波長較<b>短</b> ✗。<br>(3) 藍色恆星比黃色恆星熱 ✓。<br>答案：只有 (3) → <b>A</b>。"},"pub":"Pearson"},{"id":"P2-2026-21","p":"P2","s":2026,"n":"2.1","t":"atom","x":false,"a":"A","ex":{"E":"(1) Most α particles pass straight through, and only very few are scattered through large angles. So the nucleus is tiny compared with the atom ✓.<br>(2) Large-angle scattering shows the positive charge is concentrated in the nucleus, not spread uniformly (that was the plum-pudding model) ✗.<br>(3) Specific electron orbits come from Bohr's model and atomic spectra, not from α scattering ✗.<br>Answer: (1) only → <b>A</b>.","C":"(1) 大部分 α 粒子直穿，只有極少數大角度散射，可見原子核相對原子極小 ✓。<br>(2) 大角度散射顯示正電荷集中在原子核，而不是均勻分佈（那是「葡萄乾布丁」模型）✗。<br>(3) 電子在特定軌道上，是玻爾模型和原子光譜的結論，並非由 α 散射實驗直接推論 ✗。<br>答案：只有 (1) → <b>A</b>。"},"pub":"Pearson"},{"id":"P2-2026-22","p":"P2","s":2026,"n":"2.2","t":"atom","x":false,"a":"B","ex":{"E":"Bohr's key postulate: electrons can only occupy certain stationary orbits with fixed energies, and they do not radiate while in them (2) ✓.<br>(1) Excited states are also stationary (stable) states, not only the ground state ✗.<br>(3) The photon's energy hf = hc/λ equals the energy difference between two levels; λ is not proportional to the orbital radius ✗.<br>Answer: (2) only → <b>B</b>.","C":"玻爾的關鍵假設：電子只能處於某些能量固定的定態軌道，在軌道上不會輻射 (2) ✓。<br>(1) 激發態同樣是定態，並非只有基態穩定 ✗。<br>(3) 光子能量 hf = hc/λ 等於兩能級之差，λ 與軌道半徑並非成正比 ✗。<br>答案：只有 (2) → <b>B</b>。"},"pub":"Pearson"},{"id":"P2-2026-23","p":"P2","s":2026,"n":"2.3","t":"atom","x":false,"a":"C","ex":{"E":"Spectrum I is a continuous spectrum with dark lines, which is an <b>absorption</b> spectrum. Spectrum II has bright lines on a dark background, which is an <b>emission</b> spectrum.<br>(1) White light through a cool, low-pressure gas gives an absorption spectrum like I ✓.<br>(2) The line positions are set by the electron energy levels, not by the nuclear mass ✗.<br>(3) Bright lines come from electrons dropping to lower levels and emitting photons of specific wavelengths ✓.<br>Answer: (1) and (3) only → <b>C</b>.","C":"光譜 I 是帶暗線的連續光譜，屬<b>吸收</b>光譜；光譜 II 是黑色背景上的亮線，屬<b>發射</b>光譜。<br>(1) 白光穿過低壓氣體，會得到類似 I 的吸收光譜 ✓。<br>(2) 譜線位置由電子能級決定，與原子核質量無關 ✗。<br>(3) 亮線源於電子由高能級躍遷到低能級，放出特定波長的光子 ✓。<br>答案：只有 (1) 和 (3) → <b>C</b>。"},"pub":"Pearson"},{"id":"P2-2026-24","p":"P2","s":2026,"n":"2.4","t":"atom","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2026-25","p":"P2","s":2026,"n":"2.5","t":"atom","x":false,"a":"A","pub":"Pearson"},{"id":"P2-2026-26","p":"P2","s":2026,"n":"2.6","t":"atom","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2026-27","p":"P2","s":2026,"n":"2.7","t":"atom","x":false,"a":"C","ex":{"E":"An STM does not use an electron beam or lenses. A sharp tip is held a few atomic diameters above the surface, and the electron <b>tunnelling current</b> across the gap changes exponentially with the gap width. A change in height of a fraction of an atom changes the current a lot, so atomic-scale bumps can be mapped → <b>C</b>.","C":"掃描隧穿顯微鏡不使用電子束或透鏡。尖銳的探針懸於樣本表面上方數個原子的距離，電子越過空隙的<b>隧穿電流</b>隨距離作指數變化；高度即使只改變不足一個原子，電流亦有顯著變化，因此能描繪原子尺度的起伏 → <b>C</b>。"},"pub":"Pearson"},{"id":"P2-2026-28","p":"P2","s":2026,"n":"2.8","t":"atom","x":false,"a":"B","ex":{"E":"(1) At the nanoscale a large fraction of atoms are on the surface and less tightly bound, so the melting point is lower ✓.<br>(2) More surface atoms are exposed, so reactivity and catalytic efficiency increase ✓.<br>(3) The surface-area-to-volume ratio <b>increases</b> as size decreases (it is ∝ 1/size) ✗.<br>Answer: (1) and (2) only → <b>B</b>.","C":"(1) 納米尺度下，大比例的原子位於表面，束縛較弱，熔點較低 ✓。<br>(2) 暴露的表面原子較多，化學活性及催化效率提高 ✓。<br>(3) 尺寸越小，表面面積對體積之比越<b>大</b>（∝ 1/尺寸）✗。<br>答案：只有 (1) 和 (2) → <b>B</b>。"},"pub":"Pearson"},{"id":"P2-2026-31","p":"P2","s":2026,"n":"3.1","t":"energy","x":false,"a":"D","ex":{"E":"In an LED, electrons cross the p–n junction and recombine with holes. Each electron drops from the conduction band (higher energy) to the valence band (lower energy) and the energy difference is emitted as a photon. This is direct conversion of electrical energy to light, not fluorescence, re-emission or friction → <b>D</b>.","C":"LED 中，電子越過 p–n 結與空穴復合，由導帶（較高能量）落到價帶（較低能量），能量差以光子形式釋出。這是電能直接轉為光能，並非熒光、吸收後再發射或摩擦生光 → <b>D</b>。"},"pub":"Pearson"},{"id":"P2-2026-32","p":"P2","s":2026,"n":"3.2","t":"energy","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2026-33","p":"P2","s":2026,"n":"3.3","t":"energy","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2026-34","p":"P2","s":2026,"n":"3.4","t":"energy","x":false,"a":"A","ex":{"E":"Rate of heat loss = U A ΔT.<br>(1) A lower U means less heat lost, so less heating energy is needed ✓.<br>(2) U ≈ k/d: to reduce U, use a <b>lower</b> conductivity k or a thicker wall. A higher k raises U ✗.<br>(3) U is a conduction property and does not depend on colour (colour affects the absorption of solar radiation instead) ✗.<br>Answer: (1) only → <b>A</b>.","C":"熱損失率 = U A ΔT。<br>(1) U 越低，熱損失越少，暖氣耗能越少 ✓。<br>(2) U ≈ k/d：要降低 U，應用導熱率 k <b>較低</b>的物料或加厚牆壁；k 較高反而使 U 上升 ✗。<br>(3) U 值反映熱傳導，與顏色無關（顏色影響的是對太陽輻射的吸收）✗。<br>答案：只有 (1) → <b>A</b>。"},"pub":"Pearson"},{"id":"P2-2026-35","p":"P2","s":2026,"n":"3.5","t":"energy","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2026-36","p":"P2","s":2026,"n":"3.6","t":"energy","x":false,"a":"B","ex":{"E":"(1) Kinetic energy is first converted into electrical energy by the motor acting as a generator, and then stored as chemical energy in the battery, so it is not direct ✗.<br>(2) Stop-and-go city traffic has many braking events, so more energy is recovered than in steady highway driving ✓.<br>(3) The electric motor and battery assist at peak demand, so the engine can be <b>smaller</b>, not larger ✗.<br>Answer: (2) only → <b>B</b>.","C":"(1) 動能先經作為發電機的電動機轉為電能，再以化學能儲存在電池中，並非直接轉換 ✗。<br>(2) 市區走走停停，剎車次數多，回收的能量比在公路上穩定行駛時多 ✓。<br>(3) 電動機和電池在高功率需求時協助，故內燃機可以<b>較小</b>，而非更大 ✗。<br>答案：只有 (2) → <b>B</b>。"},"pub":"Pearson"},{"id":"P2-2026-37","p":"P2","s":2026,"n":"3.7","t":"energy","x":false,"a":"A","pub":"Pearson"},{"id":"P2-2026-38","p":"P2","s":2026,"n":"3.8","t":"energy","x":false,"a":"B","ex":{"E":"(1) In a PWR the radioactive primary water is kept in a closed loop. It heats a separate secondary loop in the steam generator, so the steam reaching the turbine is not radioactive ✗.<br>(2) Slow (thermal) neutrons are much more likely to cause fission of U-235, so a moderator slows them down ✓.<br>(3) Control rods <b>absorb</b> neutrons to control the reaction rate; slowing neutrons is the moderator's job ✗.<br>Answer: (2) only → <b>B</b>.","C":"(1) 壓水式反應堆中，帶放射性的一次迴路水在封閉系統內循環，只在蒸汽發生器加熱另一獨立的二次迴路，推動渦輪機的蒸汽沒有放射性 ✗。<br>(2) 慢（熱）中子較易使鈾-235 裂變，所以要用減速劑使中子減速 ✓。<br>(3) 控制棒用來<b>吸收</b>中子以控制反應速率；使中子減速的是減速劑 ✗。<br>答案：只有 (2) → <b>B</b>。"},"pub":"Pearson"},{"id":"P2-2026-41","p":"P2","s":2026,"n":"4.1","t":"med","x":false,"a":"A","ex":{"E":"(1) The cornea and lens converge light to form a real, inverted image on the retina ✓.<br>(2) To focus on a near object the lens must become <b>thicker</b> (larger power) ✗.<br>(3) When the ciliary muscles contract, the suspensory ligaments slacken and the lens becomes <b>thicker</b> ✗.<br>Answer: (1) only → <b>A</b>.","C":"(1) 角膜和晶狀體使光會聚，在視網膜上形成倒立實像 ✓。<br>(2) 看近物時晶狀體要變<b>厚</b>（焦強增大）✗。<br>(3) 睫狀肌收縮時，懸韌帶放鬆，晶狀體變<b>厚</b> ✗。<br>答案：只有 (1) → <b>A</b>。"},"pub":"Pearson"},{"id":"P2-2026-42","p":"P2","s":2026,"n":"4.2","t":"med","x":false,"a":"A","pub":"Pearson"},{"id":"P2-2026-43","p":"P2","s":2026,"n":"4.3","t":"med","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2026-44","p":"P2","s":2026,"n":"4.4","t":"med","x":false,"a":"B","ex":{"E":"(1) Loudness is a subjective perception that depends on both intensity and frequency ✗.<br>(2) The phon scale is defined so that, at 1000 Hz, loudness in phon = sound intensity level in dB ✓.<br>(3) The ear is most sensitive at about 2000–4000 Hz, not at 1000 Hz ✗.<br>Answer: (2) only → <b>B</b>.","C":"(1) 響度是主觀感覺，取決於強度和頻率 ✗。<br>(2) 方 (phon) 的定義：在 1000 Hz 時，響度（方）的數值等於聲強級（dB）的數值 ✓。<br>(3) 人耳對約 2000–4000 Hz 最敏感，而不是 1000 Hz ✗。<br>答案：只有 (2) → <b>B</b>。"},"pub":"Pearson"},{"id":"P2-2026-45","p":"P2","s":2026,"n":"4.5","t":"med","x":false,"a":"D","ex":{"E":"Light stays in the fibre only if the angle of incidence at the core–cladding boundary is larger than the critical angle θ<sub>c</sub> = sin<sup>−1</sup>(n<sub>cladding</sub>/n<sub>core</sub>).<br>(1) A larger θ at the entrance makes the ray steeper, so the angle at the core–cladding boundary becomes <b>smaller</b>, which is worse ✗.<br>(2) A higher n<sub>core</sub> gives a smaller θ<sub>c</sub>, so TIR is easier ✓.<br>(3) A lower n<sub>cladding</sub> gives a smaller θ<sub>c</sub> ✓.<br>Answer: (2) and (3) only → <b>D</b>.","C":"光要留在光纖內，在纖芯與包層分界面的入射角必須大於臨界角 θ<sub>c</sub> = sin<sup>−1</sup>(n<sub>包層</sub>/n<sub>纖芯</sub>)。<br>(1) 入口處 θ 增大，光線更斜，在分界面的入射角反而<b>變小</b>，更易漏光 ✗。<br>(2) n<sub>纖芯</sub> 增大，θ<sub>c</sub> 變小，較易全內反射 ✓。<br>(3) n<sub>包層</sub> 減小，θ<sub>c</sub> 變小 ✓。<br>答案：只有 (2) 和 (3) → <b>D</b>。"},"pub":"Pearson"},{"id":"P2-2026-46","p":"P2","s":2026,"n":"4.6","t":"med","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2026-47","p":"P2","s":2026,"n":"4.7","t":"med","x":false,"a":"D","ex":{"E":"(1) Both use X-rays in a similar energy range. CT differs in taking many projections from different angles and reconstructing slices by computer ✗.<br>(2) Because it reconstructs cross-sections without overlapping structures, CT shows much better contrast between soft tissues ✓.<br>(3) Many exposures from different angles mean CT usually gives a much higher dose than a single X-ray film ✓.<br>Answer: (2) and (3) only → <b>D</b>.","C":"(1) 兩者所用 X 射線能量範圍相若；CT 的分別在於從多個角度取像，再由電腦重建切面 ✗。<br>(2) CT 重建切面，影像沒有重疊，軟組織之間的對比度遠勝傳統 X 光 ✓。<br>(3) CT 需要從多角度多次曝光，病人所受劑量通常遠高於單張 X 光片 ✓。<br>答案：只有 (2) 和 (3) → <b>D</b>。"},"pub":"Pearson"},{"id":"P2-2026-48","p":"P2","s":2026,"n":"4.8","t":"med","x":false,"a":"B","ex":{"E":"An ideal RNI tracer should: bind <b>selectively</b> to the target organ, so (1) is wrong; have a half-life just long enough to complete the scan (minutes to hours), so a very long half-life in (2) is wrong; and be cleared from the body quickly to minimise the internal dose, so (3) is right.<br>Answer: (3) only → <b>B</b>.","C":"理想的放射性核素顯像示蹤物應：<b>選擇性地</b>與目標器官結合，故 (1) 錯；半衰期剛好足夠完成掃描（數分鐘至數小時），半衰期很長會增加劑量，故 (2) 錯；並能迅速排出體外以減少體內劑量，故 (3) 對。<br>答案：只有 (3) → <b>B</b>。"},"pub":"Pearson"},{"id":"OA-2024-01","p":"1A","s":2024,"n":"1","t":"heat","x":false,"a":"D","pub":"OUP","ex":{"C":"兩方塊由同一温度 80 °C 開始冷卻，最終都冷卻至室温 25 °C，所以温度改變的幅度相同（ΔT = 55 °C）→ D 必定正確。<br>冷卻曲線的快慢取決於熱容量 (mc)、表面積、物料等多項因素，單憑曲線不能判斷 P 的質量或比熱容量是否較大，亦不能比較損失的能量 (mcΔT)。<br>答案 <b>D</b>。","E":"Both blocks start at 80 °C and finally cool to the room temperature of 25 °C, so their temperature change is the same (ΔT = 55 °C) → D must be correct.<br>The shape of a cooling curve depends on heat capacity (mc), surface area, material and so on, so we cannot tell whether P has a larger mass or specific heat capacity, nor compare the heat lost (mcΔT).<br>Answer <b>D</b>."}},{"id":"OA-2024-02","p":"1A","s":2024,"n":"2","t":"heat","x":false,"a":"B","pub":"OUP","ex":{"C":"(1) 水吸收的能量 = mcΔT = (1)(4200)(100 − 25) = 315 000 J，需時 300 s ⇒ 有效功率 = 1050 W。能量散失率 = 1500 − 1050 = 450 W ✓。<br>(2) 汽化 1 kg 水需 2.26 × 10<sup>6</sup> J，以 1050 W 計，需時 2.26 × 10<sup>6</sup> / 1050 ≈ 2150 s ≈ 36 分鐘，並非 25 分鐘 ✗。<br>(3) 水量加倍，所需能量加倍 (630 000 J)；有效功率不變，所需時間 = 600 s，亦加倍 ✓。<br>答案 <b>B</b>。","E":"(1) Energy absorbed by the water = mcΔT = (1)(4200)(100 − 25) = 315 000 J in 300 s ⇒ useful power = 1050 W. Rate of heat loss = 1500 − 1050 = 450 W ✓.<br>(2) Vaporizing 1 kg needs 2.26 × 10<sup>6</sup> J. At 1050 W this takes 2.26 × 10<sup>6</sup>/1050 ≈ 2150 s ≈ 36 min, not 25 min ✗.<br>(3) Doubling the mass doubles the energy needed (630 000 J). The useful power is unchanged, so the time becomes 600 s, i.e. doubled ✓.<br>Answer <b>B</b>."}},{"id":"OA-2024-03","p":"1A","s":2024,"n":"3","t":"heat","x":true,"a":"B","pub":"OUP","ex":{"C":"温度以開氏温標計，由 T 升至 2T：<br>(1) c<sub>rms</sub> ∝ √T，只上升至 √2 倍 ✗。<br>(2) 容器體積不變，撞擊器壁的頻率 ∝ 分子速率 ∝ √T，只上升至 √2 倍 ✗。<br>(3) 平均動能 = (3/2)kT ∝ T，上升至 2 倍 ✓。<br>答案 <b>B</b>。","E":"The temperature (in kelvin) goes from T to 2T:<br>(1) c<sub>rms</sub> ∝ √T, so it only becomes √2 times ✗.<br>(2) The volume is fixed, so the collision frequency on the wall ∝ molecular speed ∝ √T, only √2 times ✗.<br>(3) Average KE = (3/2)kT ∝ T, so it doubles ✓.<br>Answer <b>B</b>."}},{"id":"OA-2024-04","p":"1A","s":2024,"n":"4","t":"mech","x":false,"a":"B","pub":"OUP","ex":{"C":"設 Y 的質量為 m，X 的質量為 2m，桌面光滑。<br>(1) 整個系統：mg = (2m + m)a ⇒ a = g/3 ✓。<br>(2) 輕繩繞過光滑滑輪，繩上各處張力相同，T<sub>1</sub> = T<sub>2</sub> ✓。<br>(3) Y 向下加速：mg − T<sub>2</sub> = ma ⇒ T<sub>2</sub> = (2/3)mg，小於 Y 的重量 ✗。<br>答案 <b>B</b>。","E":"Let Y have mass m and X have mass 2m; the table is smooth.<br>(1) Whole system: mg = (2m + m)a ⇒ a = g/3 ✓.<br>(2) A light string over a smooth pulley has the same tension throughout, so T<sub>1</sub> = T<sub>2</sub> ✓.<br>(3) Y accelerates downward: mg − T<sub>2</sub> = ma ⇒ T<sub>2</sub> = (2/3)mg, less than the weight of Y ✗.<br>Answer <b>B</b>."}},{"id":"OA-2024-05","p":"1A","s":2024,"n":"5","t":"mech","x":false,"a":"A","pub":"OUP","ex":{"C":"方塊在光滑斜面上，只受重力 mg 和法向力 N。要與楔子一起作水平加速 a 而不滑動：<br>鉛垂方向 N cos θ = mg，水平方向 N sin θ = ma ⇒ a = g tan θ。<br>把方塊和楔子視為一個系統（地面光滑）：F = (m + M)a = (m + M)g tan θ。<br>答案 <b>A</b>。","E":"The block on the smooth incline is acted on only by its weight mg and the normal force N. To accelerate horizontally with the wedge at a without sliding:<br>vertically N cos θ = mg, horizontally N sin θ = ma ⇒ a = g tan θ.<br>Treat block + wedge as one system (smooth ground): F = (m + M)a = (m + M)g tan θ.<br>Answer <b>A</b>."}},{"id":"OA-2024-06","p":"1A","s":2024,"n":"6","t":"mech","x":false,"a":"C","pub":"OUP","ex":{"C":"達到終端速率時速度不變，加速度為零，所以作用於跳傘員的淨力為零（空氣阻力 = 重力）✓。<br>A：跳傘員正是靠空氣阻力減速，不可略去 ✗。B：重力 mg 基本不變 ✗。D：打開降落傘時跳傘員仍在下墜，速度向下（只是減速）✗。<br>答案 <b>C</b>。","E":"At terminal speed the velocity is constant, so the acceleration and hence the net force are zero (air resistance = weight) ✓.<br>A ✗: air resistance is what slows the skydiver down. B ✗: the weight mg stays essentially the same. D ✗: when the parachute opens the skydiver is still falling, so the velocity is downward (only decelerating).<br>Answer <b>C</b>."}},{"id":"OA-2024-07","p":"1A","s":2024,"n":"7","t":"mech","x":false,"a":"B","pub":"OUP","ex":{"C":"乘客由碰撞前的速度減至零，動量變化 Δp 是固定的，氣袋不能減少 Δp，故 (3) ✗。<br>根據 F = Δp/Δt，氣袋延長撞擊時間 Δt，使乘客所受的平均衝擊力減小，故 (2) ✓。氣袋並不是令乘客「迅速」停下，故 (1) ✗。<br>答案 <b>B</b>。","E":"The passenger goes from the collision speed to rest, so the change in momentum Δp is fixed and the airbag cannot reduce it: (3) ✗.<br>By F = Δp/Δt, the airbag lengthens the impact time Δt, reducing the average impact force on the passenger: (2) ✓. It does not stop the passenger 'quickly': (1) ✗.<br>Answer <b>B</b>."}},{"id":"OA-2024-08","p":"1A","s":2024,"n":"8","t":"mech","x":false,"a":"B","pub":"OUP","ex":{"C":"取向上為正。<br>水平速度 u<sub>x</sub> = 20 cos 15° = 19.32 m s<sup>−1</sup>（保持不變）。<br>鉛垂初速度 u<sub>y</sub> = 20 sin 15° = 5.18 m s<sup>−1</sup>；4 s 後 v<sub>y</sub> = 5.18 − 9.81 × 4 = −34.06 m s<sup>−1</sup>。<br>速率 v = √(19.32<sup>2</sup> + 34.06<sup>2</sup>) ≈ 39.2 m s<sup>−1</sup>。<br>答案 <b>B</b>。","E":"Take upward as positive.<br>Horizontal velocity u<sub>x</sub> = 20 cos 15° = 19.32 m s<sup>−1</sup> (unchanged).<br>Initial vertical velocity u<sub>y</sub> = 20 sin 15° = 5.18 m s<sup>−1</sup>; after 4 s, v<sub>y</sub> = 5.18 − 9.81 × 4 = −34.06 m s<sup>−1</sup>.<br>Speed v = √(19.32<sup>2</sup> + 34.06<sup>2</sup>) ≈ 39.2 m s<sup>−1</sup>.<br>Answer <b>B</b>."}},{"id":"OA-2024-09","p":"1A","s":2024,"n":"9","t":"mech","x":false,"a":"B","pub":"OUP","ex":{"C":"軌道光滑而箱子以恆速率移動，動能不變，工人所作的功全部轉為箱子的重力勢能。<br>在水平的 XY 段，高度不變，不用作功；在 YZ 段，箱子升高 h = 30 sin 30° = 15 m。<br>W = mgh = 1000 × 15 = 15 000 J。<br>答案 <b>B</b>。","E":"The track is smooth and the speed is constant, so the KE does not change and all the work done becomes gravitational PE.<br>On the horizontal part XY the height does not change (no work needed); on YZ the box rises h = 30 sin 30° = 15 m.<br>W = mgh = 1000 × 15 = 15 000 J.<br>Answer <b>B</b>."}},{"id":"OA-2024-10","p":"1A","s":2024,"n":"10","t":"mech","x":false,"a":"A","pub":"OUP","ex":{"C":"支點與左端相距 0.3 m，與右端相距 0.7 m；棒的重心在中點，與支點相距 0.2 m（在 m 那一側）。<br>以支點取力矩：Mg(0.3) = mg(0.7) + (1)g(0.2) ⇒ 0.3M = 0.7m + 0.2。<br>代入各選項：A：0.3 × 3 = 0.9，0.7 × 1 + 0.2 = 0.9 ✓；其餘選項不平衡。<br>答案 <b>A</b>。","E":"The pivot is 0.3 m from the left end and 0.7 m from the right end; the rod's centre of gravity is at its midpoint, 0.2 m from the pivot on the m side.<br>Taking moments about the pivot: Mg(0.3) = mg(0.7) + (1)g(0.2) ⇒ 0.3M = 0.7m + 0.2.<br>Check the options: A: 0.3 × 3 = 0.9 and 0.7 × 1 + 0.2 = 0.9 ✓; the others do not balance.<br>Answer <b>A</b>."}},{"id":"OA-2024-11","p":"1A","s":2024,"n":"11","t":"mech","x":true,"a":"D","pub":"OUP","ex":{"C":"作用於擺錘的力只有兩個：沿繩子指向懸點的張力，以及鉛垂向下的重力。<br>向心力並不是另一個力，而是張力的水平分量所提供的，所以不應另外畫出一個指向圓心的水平力。<br>答案 <b>D</b>。","E":"Only two forces act on the bob: the tension along the string towards the point of suspension, and the weight vertically downward.<br>The centripetal force is not an extra force; it is provided by the horizontal component of the tension, so no separate horizontal force towards the centre should be drawn.<br>Answer <b>D</b>."}},{"id":"OA-2024-12","p":"1A","s":2024,"n":"12","t":"mech","x":false,"a":"C","pub":"OUP","ex":{"C":"設 X 的質量為 m，Y 的質量為 2m，取向右為正。總動量 = m(4) + 2m(−2) = 0，碰撞後總動量仍為零：mv<sub>X</sub> + 2mv<sub>Y</sub> = 0。<br>(1) v<sub>X</sub> = +2 ⇒ v<sub>Y</sub> = −1：X 在 Y 左方，碰後 X 向右而 Y 向左，兩球會互相穿過，不可能 ✗。<br>(2) v<sub>X</sub> = −2 ⇒ v<sub>Y</sub> = +1：碰後動能 = ½m(4) + ½(2m)(1) = 3m，小於碰前動能 ½m(16) + ½(2m)(4) = 12m，可能 ✓。<br>(3) v<sub>X</sub> = 0 ⇒ v<sub>Y</sub> = 0：完全非彈性碰撞，可能 ✓。<br>答案 <b>C</b>。","E":"Let X have mass m and Y have mass 2m; take right as positive. Total momentum = m(4) + 2m(−2) = 0, so after the collision mv<sub>X</sub> + 2mv<sub>Y</sub> = 0.<br>(1) v<sub>X</sub> = +2 ⇒ v<sub>Y</sub> = −1: X is on the left of Y, so X moving right while Y moves left means they pass through each other — impossible ✗.<br>(2) v<sub>X</sub> = −2 ⇒ v<sub>Y</sub> = +1: KE after = ½m(4) + ½(2m)(1) = 3m, less than KE before = ½m(16) + ½(2m)(4) = 12m — possible ✓.<br>(3) v<sub>X</sub> = 0 ⇒ v<sub>Y</sub> = 0: a perfectly inelastic collision — possible ✓.<br>Answer <b>C</b>."}},{"id":"OA-2024-13","p":"1A","s":2024,"n":"13","t":"mech","x":true,"a":"D","pub":"OUP","ex":{"C":"根據 GMm/r<sup>2</sup> = m(2π/T)<sup>2</sup>r，得 T<sup>2</sup> ∝ r<sup>3</sup>。T 加倍 ⇒ r 變為 2<sup>2/3</sup> 倍。<br>軌道速率 v = √(GM/r) ∝ r<sup>−1/2</sup> ⇒ v<sub>Y</sub>/v<sub>X</sub> = (2<sup>2/3</sup>)<sup>−1/2</sup> = 2<sup>−1/3</sup> = 1 : ∛2。<br>（亦可用 v = 2πr/T ∝ T<sup>2/3</sup>/T = T<sup>−1/3</sup>。）<br>答案 <b>D</b>。","E":"From GMm/r<sup>2</sup> = m(2π/T)<sup>2</sup>r, T<sup>2</sup> ∝ r<sup>3</sup>. Doubling T ⇒ r becomes 2<sup>2/3</sup> times.<br>Orbital speed v = √(GM/r) ∝ r<sup>−1/2</sup> ⇒ v<sub>Y</sub>/v<sub>X</sub> = (2<sup>2/3</sup>)<sup>−1/2</sup> = 2<sup>−1/3</sup> = 1 : ∛2.<br>(Or: v = 2πr/T ∝ T<sup>2/3</sup>/T = T<sup>−1/3</sup>.)<br>Answer <b>D</b>."}},{"id":"OA-2024-14","p":"1A","s":2024,"n":"14","t":"wave","x":false,"a":"D","pub":"OUP","ex":{"C":"由線圖：週期 T = 8 s，頻率 f = 1/8 = 0.125 Hz，(2) ✓。<br>(1) P 與 Q 的相位相差 1/4 週期，但它們的距離可以是 (n + ¼)λ 或 (n + ¾)λ，不一定是 ¼λ ✗。<br>(3) 在 t = 4 s，Q 位於平衡位置並向正方向（向右）移動。對向右傳播的縱波，處於平衡位置而向傳播方向移動的粒子位於密部中心 ✓。<br>答案 <b>D</b>。","E":"From the graph: period T = 8 s, so f = 1/8 = 0.125 Hz: (2) ✓.<br>(1) P and Q differ in phase by 1/4 period, but their separation could be (n + ¼)λ or (n + ¾)λ, not necessarily ¼λ ✗.<br>(3) At t = 4 s, Q is at its equilibrium position and moving in the positive direction (to the right). For a longitudinal wave travelling to the right, a particle at equilibrium moving in the direction of travel is at the centre of a compression ✓.<br>Answer <b>D</b>."}},{"id":"OA-2024-15","p":"1A","s":2024,"n":"15","t":"wave","x":false,"a":"B","pub":"OUP","ex":{"C":"設按喇叭時汽車與懸崖相距 d。1.5 s 內聲音走了 340 × 1.5 = 510 m，汽車前進了 24 × 1.5 = 36 m。<br>聲音去程 + 回程 = 2d − 36 ⇒ 2d − 36 = 510 ⇒ d = 273 m。<br>答案 <b>B</b>。","E":"Let the car be d from the cliff when the horn sounds. In 1.5 s the sound travels 340 × 1.5 = 510 m and the car moves 24 × 1.5 = 36 m forward.<br>Sound path out and back = 2d − 36 ⇒ 2d − 36 = 510 ⇒ d = 273 m.<br>Answer <b>B</b>."}},{"id":"OA-2024-16","p":"1A","s":2024,"n":"16","t":"wave","x":false,"a":"A","pub":"OUP","ex":{"C":"水波進入淺水區時速率減小、波長變短，頻率由波源決定，保持不變。<br>(1) 若波以斜角進入分界，會發生折射，傳播方向改變 ✓。(2) 頻率不變 ✗。(3) 速率減小 ✗。<br>答案 <b>A</b>。","E":"Entering shallow water, the wave slows down and the wavelength becomes shorter; the frequency is set by the source and does not change.<br>(1) If the wave meets the boundary at an angle it refracts, so its direction changes ✓. (2) Frequency unchanged ✗. (3) Speed decreases ✗.<br>Answer <b>A</b>."}},{"id":"OA-2024-17","p":"1A","s":2024,"n":"17","t":"wave","x":false,"a":"B","pub":"OUP","ex":{"C":"程差 = 3.9 − 3.5 = 0.4 m。兩波源<b>反相</b>，所以程差為 (n + ½)λ 時才是相長干涉（響亮）。<br>λ = v/f：<br>(1) 425 Hz：λ = 0.8 m，程差 = 0.5λ ✓。<br>(2) 850 Hz：λ = 0.4 m，程差 = 1λ → 相消（微弱）✗。<br>(3) 1275 Hz：λ = 0.267 m，程差 = 1.5λ ✓。<br>答案 <b>B</b>。","E":"Path difference = 3.9 − 3.5 = 0.4 m. The sources are in <b>antiphase</b>, so a loud sound (constructive interference) needs a path difference of (n + ½)λ.<br>λ = v/f:<br>(1) 425 Hz: λ = 0.8 m, path difference = 0.5λ ✓.<br>(2) 850 Hz: λ = 0.4 m, path difference = 1λ → destructive (soft) ✗.<br>(3) 1275 Hz: λ = 0.267 m, path difference = 1.5λ ✓.<br>Answer <b>B</b>."}},{"id":"OA-2024-18","p":"1A","s":2024,"n":"18","t":"wave","x":false,"a":"C","pub":"OUP","ex":{"C":"繩上形成駐波時 L = nλ/2，波節數目隨 n 增加。λ = v/f，v 取決於張力。<br>(1) 縮短繩子而 f、v 不變，λ 不變，可容納的半波長數目減少 ✗。<br>(2) 減小張力 ⇒ v 減小 ⇒ λ 變短 ⇒ 波節增加 ✓。<br>(3) 提升頻率 ⇒ λ 變短 ⇒ 波節增加 ✓。<br>答案 <b>C</b>。","E":"For a stationary wave L = nλ/2, and the number of nodes increases with n. λ = v/f, and v depends on the tension.<br>(1) Shortening the string with f and v unchanged keeps λ the same, so fewer half-wavelengths fit ✗.<br>(2) Lower tension ⇒ smaller v ⇒ shorter λ ⇒ more nodes ✓.<br>(3) Higher frequency ⇒ shorter λ ⇒ more nodes ✓.<br>Answer <b>C</b>."}},{"id":"OA-2024-19","p":"1A","s":2024,"n":"19","t":"wave","x":true,"a":"C","pub":"OUP","ex":{"C":"圖中 7 道亮紋，最外兩道相距 9 cm，包含 6 個條紋間距 ⇒ 紅光的條紋間距 Δy = 9/6 = 1.5 cm。<br>Δy = λD/a ∝ λ ⇒ 綠光的 Δy′ = 1.5 × 560/700 = 1.2 cm。<br>兩道第二級亮紋位於中央亮紋兩側，相距 4Δy′ = 4.8 cm。<br>答案 <b>C</b>。","E":"There are 7 bright fringes and the outermost two are 9 cm apart, i.e. 6 fringe spacings ⇒ red-light fringe separation Δy = 9/6 = 1.5 cm.<br>Δy = λD/a ∝ λ ⇒ for green light Δy′ = 1.5 × 560/700 = 1.2 cm.<br>The two 2nd-order bright fringes are on opposite sides of the central fringe, 4Δy′ = 4.8 cm apart.<br>Answer <b>C</b>."}},{"id":"OA-2024-20","p":"1A","s":2024,"n":"20","t":"wave","x":true,"a":"D","pub":"OUP","ex":{"C":"像在透鏡另一側，屬實像，只有凸透鏡能形成實像。<br>透鏡公式（實正虛負）：1/f = 1/u + 1/v = 1/30 + 1/20 = 1/12 ⇒ f = 12 cm。<br>答案 <b>D</b>。","E":"The image is on the other side of the lens, so it is real; only a convex lens forms a real image.<br>Lens formula (real-is-positive): 1/f = 1/u + 1/v = 1/30 + 1/20 = 1/12 ⇒ f = 12 cm.<br>Answer <b>D</b>."}},{"id":"OA-2024-21","p":"1A","s":2024,"n":"21","t":"wave","x":false,"a":"A","pub":"OUP","ex":{"C":"平放的平面鏡使像上下顛倒（鉛垂方向反轉），但左右不變。字母 F 的直筆仍在左邊，兩條橫筆仍指向右方，只是由上方變到下方 → 選項 A 的圖形。<br>答案 <b>A</b>。","E":"A mirror lying flat on the table inverts the image vertically (top and bottom swap) but not left and right. The vertical stroke of the F stays on the left and the two horizontal strokes still point to the right, but they move from the top to the bottom → the figure in A.<br>Answer <b>A</b>."}},{"id":"OA-2024-22","p":"1A","s":2024,"n":"22","t":"wave","x":false,"a":"C","pub":"OUP","ex":{"C":"A：超聲波是縱波，電磁波是橫波 ✓。B：聲波需要介質，電磁波可在真空中傳播 ✓。D：聲波在水中較快；光在水中較慢 ✓。<br>C 不正確：電磁波（如光、微波）同樣會被牆壁反射。<br>答案 <b>C</b>。","E":"A: ultrasonic waves are longitudinal, EM waves are transverse ✓. B: sound needs a medium, EM waves can travel in vacuum ✓. D: sound is faster in water, light is slower in water ✓.<br>C is incorrect: EM waves (light, microwaves …) are also reflected by walls.<br>Answer <b>C</b>."}},{"id":"OA-2024-23","p":"1A","s":2024,"n":"23","t":"em","x":true,"a":"B","pub":"OUP","ex":{"C":"兩電荷電性相反，在它們之間兩者的電場同向，不可能抵消。中和點必在兩電荷外側，而且靠近電荷量較小的一方（X），才能令 kq/r<sup>2</sup> 相等。因此中和點位於 X 的左側。<br>答案 <b>B</b>。","E":"The two charges are opposite, so between them their fields point the same way and cannot cancel. The neutral point must be outside the pair, closer to the smaller charge (X), so that kq/r<sup>2</sup> can be equal. Hence it lies on the left side of X.<br>Answer <b>B</b>."}},{"id":"OA-2024-24","p":"1A","s":2024,"n":"24","t":"em","x":false,"a":"B","pub":"OUP","ex":{"C":"理想安培計的電阻為零，理想伏特計的電阻無限大。設每個電阻器為 R。<br>電路化簡：左方的電阻器與右方的組合串聯；右方的組合是「上方電阻器 + 右側電阻器」(2R) 與「下方電阻器」(R) 並聯，等效電阻 = 2R/3。<br>總電阻 = R + 2R/3 = 5R/3。伏特計量度左方電阻器兩端的電壓：V = 6 × R/(5R/3) = 3.6 V。<br>答案 <b>B</b>。","E":"An ideal ammeter has zero resistance and an ideal voltmeter has infinite resistance. Let each resistor be R.<br>The left resistor is in series with the right-hand combination: (top resistor + right resistor) = 2R in parallel with the bottom resistor R, giving 2R/3.<br>Total resistance = R + 2R/3 = 5R/3. The voltmeter measures the p.d. across the left resistor: V = 6 × R/(5R/3) = 3.6 V.<br>Answer <b>B</b>."}},{"id":"OA-2024-25","p":"1A","s":2024,"n":"25","t":"em","x":false,"a":"D","pub":"OUP","ex":{"C":"R = ρL/A，體積 V = AL ⇒ L = V/A ⇒ R = ρV/A<sup>2</sup> ∝ 1/A<sup>2</sup>。<br>A<sub>X</sub> = π(1)<sup>2</sup> = π mm<sup>2</sup>，A<sub>Y</sub> = 1 mm<sup>2</sup>。<br>R<sub>X</sub> : R<sub>Y</sub> = 1/π<sup>2</sup> : 1 = 1 : π<sup>2</sup>。<br>答案 <b>D</b>。","E":"R = ρL/A and volume V = AL ⇒ L = V/A ⇒ R = ρV/A<sup>2</sup> ∝ 1/A<sup>2</sup>.<br>A<sub>X</sub> = π(1)<sup>2</sup> = π mm<sup>2</sup>, A<sub>Y</sub> = 1 mm<sup>2</sup>.<br>R<sub>X</sub> : R<sub>Y</sub> = 1/π<sup>2</sup> : 1 = 1 : π<sup>2</sup>.<br>Answer <b>D</b>."}},{"id":"OA-2024-26","p":"1A","s":2024,"n":"26","t":"em","x":false,"a":"D","pub":"OUP","ex":{"C":"Q（指出）和 R（指入）位於同一對角線的兩端，電流方向相反，它們在 O 點產生的磁場同向、互相加強，方向垂直於 QR 對角線。<br>S 與 P 在另一對角線上，S 的磁場只能沿垂直於 PS 對角線的方向，只可抵消 P 的磁場，無法抵消 Q 和 R 的合磁場。所以無論 S 的電流是多少，O 點的合磁場都不會是零。<br>答案 <b>D</b>。","E":"Q (out) and R (in) are at opposite ends of one diagonal with opposite currents, so their fields at O are in the same direction and add up, perpendicular to diagonal QR.<br>S is on the other diagonal with P; the field of S at O can only be perpendicular to diagonal PS, so it can only cancel P's field, never the combined field of Q and R. So whatever the current in S, the resultant field at O cannot be zero.<br>Answer <b>D</b>."}},{"id":"OA-2024-27","p":"1A","s":2024,"n":"27","t":"em","x":false,"a":"A","pub":"OUP","ex":{"C":"鋁片在磁場中擺動時切割磁場線，在鋁片內產生渦電流。根據楞次定律，渦電流所受的磁力阻礙鋁片的運動，令動能迅速轉為熱能，鋁片很快停下（電磁阻尼）。<br>答案 <b>A</b>。","E":"As the aluminium plate swings through the field it cuts magnetic field lines, inducing eddy currents in the plate. By Lenz's law the magnetic force on these currents opposes the motion, quickly converting KE into heat, so the plate stops very quickly (electromagnetic damping).<br>Answer <b>A</b>."}},{"id":"OA-2024-28","p":"1A","s":2024,"n":"28","t":"em","x":false,"a":"B","pub":"OUP","ex":{"C":"磁鐵被排斥並靜止於 P，表示受到恆定的推斥力，所以螺線管連接的是穩定的直流電（交流電的磁極不斷轉換，平均而言不會令磁鐵停在一側）。<br>磁鐵的 S 極向着螺線管 → 螺線管右端應是 S 極才會互相排斥。從右端觀看，電流應為順時針方向；按圖中線圈的繞向，電流由 Y 經螺線管流向 X。<br>答案 <b>B</b>。","E":"The magnet is repelled and stays at rest at P, so it feels a steady repulsive force: the solenoid carries a steady d.c. (an a.c. would keep reversing the poles and could not hold the magnet on one side).<br>The S pole of the magnet faces the solenoid, so the right end of the solenoid must be an S pole to repel it. Viewed from the right end, the current must be clockwise; from the way the coil is wound, the current flows from Y to X through the solenoid.<br>Answer <b>B</b>."}},{"id":"OA-2024-29","p":"1A","s":2024,"n":"29","t":"em","x":true,"a":"C","pub":"OUP","ex":{"C":"輸出功率 = 3 × (5)(2) = 30 W；輸入功率 = (220)(0.18) = 39.6 W。<br>效率 = 30/39.6 × 100% ≈ 76%。<br>答案 <b>C</b>。","E":"Output power = 3 × (5)(2) = 30 W; input power = (220)(0.18) = 39.6 W.<br>Efficiency = 30/39.6 × 100% ≈ 76%.<br>Answer <b>C</b>."}},{"id":"OA-2024-30","p":"1A","s":2024,"n":"30","t":"em","x":true,"a":"A","pub":"OUP","ex":{"C":"交流電峯值 220 V ⇒ V<sub>rms</sub> = 220/√2 ≈ 155.6 V，P = V<sub>rms</sub><sup>2</sup>/R = 24 200/R。<br>110 V 直流：P′ = 110<sup>2</sup>/R = 12 100/R = ½P（假設燈泡電阻不變）。<br>答案 <b>A</b>。","E":"Peak 220 V a.c. ⇒ V<sub>rms</sub> = 220/√2 ≈ 155.6 V, P = V<sub>rms</sub><sup>2</sup>/R = 24 200/R.<br>110 V d.c.: P′ = 110<sup>2</sup>/R = 12 100/R = ½P (assuming the bulb's resistance is constant).<br>Answer <b>A</b>."}},{"id":"OA-2024-31","p":"1A","s":2024,"n":"31","t":"nuc","x":false,"a":"A","pub":"OUP","ex":{"C":"沒有阻隔物約 254，一張紙後約 148：紙能阻隔的是 α，故有 α 輻射。<br>5 mm 鋁片後降至約 51：鋁片能阻隔的是 β，故有 β 輻射。<br>25 mm 鉛塊後仍約 50，與鋁片時相同，說明剩下的只是本底輻射，沒有 γ 輻射（否則鉛塊會令讀數再下降）。<br>答案 <b>A</b>。","E":"No shielding ≈ 254; with paper ≈ 148: paper stops α, so α is emitted.<br>With 5 mm aluminium ≈ 51: aluminium stops β, so β is emitted.<br>With 25 mm lead still ≈ 50, the same as with aluminium, so what remains is just background; there is no γ (otherwise lead would reduce the reading further).<br>Answer <b>A</b>."}},{"id":"OA-2024-32","p":"1A","s":2024,"n":"32","t":"nuc","x":false,"a":"D","pub":"OUP","ex":{"C":"24 小時 = 6 個半衰期。現在的放射強度 = 原來 × (½)<sup>6</sup> ⇒ 原來 = 12 × 2<sup>6</sup> = 768 MBq。<br>答案 <b>D</b>。","E":"24 hours = 6 half-lives. Activity now = original × (½)<sup>6</sup> ⇒ original = 12 × 2<sup>6</sup> = 768 MBq.<br>Answer <b>D</b>."}},{"id":"OA-2024-33","p":"1A","s":2024,"n":"33","t":"nuc","x":false,"a":"B","pub":"OUP","ex":{"C":"A ✗：本底輻射（氡氣、岩石、宇宙射線、食物）無處不在。B ✓：X 射線能令物質電離。C ✗：致電離輻射的危險在於破壞細胞和 DNA，而非加熱。D ✗：X 射線管、粒子加速器等可人工產生致電離輻射。<br>答案 <b>B</b>。","E":"A ✗: background radiation (radon, rocks, cosmic rays, food) is everywhere. B ✓: X-rays can ionize matter. C ✗: ionizing radiation is dangerous because it damages cells and DNA, not because it heats the body. D ✗: X-ray tubes and particle accelerators produce ionizing radiation artificially.<br>Answer <b>B</b>."}},{"id":"OP-2024-11","p":"P2","s":2024,"n":"1.1","t":"ast","x":false,"a":"C","pub":"OUP","ex":{"C":"只有內行星（軌道在地球軌道以內的金星和水星）才會在地球上看到由新月到接近滿月的明顯相位變化。木星是外行星，從地球看來幾乎總是「滿」的。<br>答案 <b>C</b>。","E":"Only the inferior planets (inside the Earth's orbit: Venus and Mercury) show a noticeable cycle of phases from crescent to nearly full. Jupiter is a superior planet and always appears almost 'full' from the Earth.<br>Answer <b>C</b>."}},{"id":"OP-2024-12","p":"P2","s":2024,"n":"1.2","t":"ast","x":false,"a":"B","pub":"OUP","ex":{"C":"(1) 光譜型 O B A F G K M 由熱到冷，A 型比 B 型<b>冷</b> ✗。<br>(2) O 型恆星表面温度最高，呈藍色 ✓。<br>(3) 紅巨星呈紅色，表面温度較低（體積大所以光度高）✗。<br>答案 <b>B</b>。","E":"(1) Spectral classes O B A F G K M run from hot to cool, so A-type stars are <b>cooler</b> than B-type ✗.<br>(2) O-type stars have the highest surface temperature and look blue ✓.<br>(3) A red giant is red, with a low surface temperature (it is luminous because it is huge) ✗.<br>Answer <b>B</b>."}},{"id":"OP-2024-13","p":"P2","s":2024,"n":"1.3","t":"ast","x":false,"a":"A","pub":"OUP","ex":{"C":"比較光度要用絕對星等：M = m − 5 log(d/10 pc)，1 pc ≈ 3.26 光年。<br>瑶光：d = 31.9 pc，M ≈ 1.9 − 2.52 = −0.62；開陽：d = 23.9 pc，M ≈ 0.21；天璣：d = 25.8 pc，M ≈ 0.34；天璇：d = 24.2 pc，M ≈ 0.48。<br>瑶光的絕對星等最小（最負），光度最大。（直觀理解：瑶光距離最遠，視星等卻最小，所以光度一

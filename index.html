定最大。）<br>答案 <b>A</b>。","E":"Compare luminosity using absolute magnitude: M = m − 5 log(d/10 pc), with 1 pc ≈ 3.26 ly.<br>Alkaid: d = 31.9 pc, M ≈ 1.9 − 2.52 = −0.62; Mizar: d = 23.9 pc, M ≈ 0.21; Phecda: d = 25.8 pc, M ≈ 0.34; Merak: d = 24.2 pc, M ≈ 0.48.<br>Alkaid has the smallest (most negative) absolute magnitude, so it is the most luminous. (Intuitively: Alkaid is the farthest yet has the smallest apparent magnitude.)<br>Answer <b>A</b>."}},{"id":"OP-2024-14","p":"P2","s":2024,"n":"1.4","t":"ast","x":false,"a":"B","pub":"OUP","ex":{"C":"表面引力場強度 g = GM/R<sup>2</sup>：天王星 / 地球 = 14.54/3.981<sup>2</sup> = 0.917 < 1 ⇒ 地球表面的引力較大。<br>逃逸速度 v = √(2GM/R)：比值 = √(14.54/3.981) = 1.91 > 1 ⇒ 天王星的逃逸速度較高。<br>答案 <b>B</b>。","E":"Surface gravity g = GM/R<sup>2</sup>: Uranus/Earth = 14.54/3.981<sup>2</sup> = 0.917 < 1 ⇒ the Earth has the higher surface gravity.<br>Escape velocity v = √(2GM/R): ratio = √(14.54/3.981) = 1.91 > 1 ⇒ Uranus has the higher escape velocity.<br>Answer <b>B</b>."}},{"id":"OP-2024-15","p":"P2","s":2024,"n":"1.5","t":"ast","x":false,"a":"C","pub":"OUP","ex":{"C":"都卜勒效應：Δλ/λ = v/c ⇒ v = 0.00428 × 3.00 × 10<sup>5</sup> km s<sup>−1</sup> ≈ 1284 km s<sup>−1</sup>。<br>波長變長（紅移），表示恆星正在移離地球。<br>答案 <b>C</b>。","E":"Doppler effect: Δλ/λ = v/c ⇒ v = 0.00428 × 3.00 × 10<sup>5</sup> km s<sup>−1</sup> ≈ 1284 km s<sup>−1</sup>.<br>The wavelength is longer (red shift), so the star is moving away from the Earth.<br>Answer <b>C</b>."}},{"id":"OP-2024-16","p":"P2","s":2024,"n":"1.6","t":"ast","x":false,"a":"D","pub":"OUP","ex":{"C":"d (pc) = 1/p (″)：卡普坦星 d = 1/0.254 = 3.94 pc，巴納德星 d = 1/0.547 = 1.83 pc。<br>(1) 亮度取決於光度和距離，光度未知，不能確定 ✗。<br>(2) 巴納德星視差較大，較接近地球 ✓。<br>(3) 卡普坦星距離少於 10 pc，看起來比放在 10 pc 時亮，所以視星等小於絕對星等 ✓。<br>答案 <b>D</b>。","E":"d (pc) = 1/p (″): Kapteyn's Star d = 1/0.254 = 3.94 pc, Barnard's Star d = 1/0.547 = 1.83 pc.<br>(1) Brightness depends on both luminosity and distance; the luminosities are unknown, so this is not certain ✗.<br>(2) Barnard's Star has the larger parallax, so it is closer ✓.<br>(3) Kapteyn's Star is closer than 10 pc, so it looks brighter than it would at 10 pc: its apparent magnitude is smaller than its absolute magnitude ✓.<br>Answer <b>D</b>."}},{"id":"OP-2024-17","p":"P2","s":2024,"n":"1.7","t":"ast","x":false,"a":"C","pub":"OUP","ex":{"C":"逆行是行星在背景恆星間的視運動暫時倒轉，是地球與行星繞太陽公轉速率不同所致。土星是行星，會出現逆行；太陽、月球和北極星都不會。<br>答案 <b>C</b>。","E":"Retrograde motion is the apparent reversal of a planet's motion against the background stars, caused by the Earth and the planet orbiting the Sun at different speeds. Saturn is a planet and shows it; the Sun, the Moon and the Polar star do not.<br>Answer <b>C</b>."}},{"id":"OP-2024-18","p":"P2","s":2024,"n":"1.8","t":"ast","x":false,"a":"A","pub":"OUP","ex":{"C":"根據開普勒第三定律 T<sup>2</sup> ∝ a<sup>3</sup>（a 為半長軸）：<br>(1) 軌道 Z 的半徑（半長軸）最小，週期最短 ✓。<br>(2) 圓形軌道 v = √(GM/r)，Y 的半徑較大，速率較低 ✓。<br>(3) 加速度 a = GM/r<sup>2</sup> 只取決於與地球中心的距離；在 P 點兩者距離相同，加速度相同 ✗。<br>答案 <b>A</b>。","E":"Kepler's third law: T<sup>2</sup> ∝ a<sup>3</sup> (a = semi-major axis).<br>(1) Orbit Z has the smallest radius (semi-major axis), so the shortest period ✓.<br>(2) For a circular orbit v = √(GM/r); Y has the larger radius, so it is slower ✓.<br>(3) Acceleration a = GM/r<sup>2</sup> depends only on the distance from the Earth's centre; at P the distances are equal, so the accelerations are equal ✗.<br>Answer <b>A</b>."}},{"id":"OP-2024-21","p":"P2","s":2024,"n":"2.1","t":"atom","x":false,"a":"C","pub":"OUP","ex":{"C":"玻爾模型中 r<sub>n</sub> ∝ n<sup>2</sup>。第一受激態 n = 2，第二受激態 n = 3。<br>r<sub>3</sub> = r<sub>2</sub> × (3<sup>2</sup>/2<sup>2</sup>) = 2.12 × 10<sup>−10</sup> × 9/4 = 4.77 × 10<sup>−10</sup> m。<br>答案 <b>C</b>。","E":"In Bohr's model r<sub>n</sub> ∝ n<sup>2</sup>. The first excited state is n = 2 and the second excited state is n = 3.<br>r<sub>3</sub> = r<sub>2</sub> × (3<sup>2</sup>/2<sup>2</sup>) = 2.12 × 10<sup>−10</sup> × 9/4 = 4.77 × 10<sup>−10</sup> m.<br>Answer <b>C</b>."}},{"id":"OP-2024-22","p":"P2","s":2024,"n":"2.2","t":"atom","x":false,"a":"D","pub":"OUP","ex":{"C":"A ✗：透過低温氣體觀察光源，得到的是吸收光譜。B ✗：電子由<b>較高</b>能級躍遷至<b>較低</b>能級才會放出光子。C ✗：光譜不能證明電子「圍繞原子核運行」。D ✓：發射光譜由分立的譜線組成，顯示原子的能級是分立的。<br>答案 <b>D</b>。","E":"A ✗: viewing a bright source through a cold gas gives an absorption spectrum. B ✗: photons are emitted when electrons go from <b>higher</b> to <b>lower</b> levels. C ✗: a spectrum does not show that electrons 'orbit' the nucleus. D ✓: an emission spectrum consists of discrete lines, showing that atomic energy levels are discrete.<br>Answer <b>D</b>."}},{"id":"OP-2024-23","p":"P2","s":2024,"n":"2.3","t":"atom","x":false,"a":"B","pub":"OUP","ex":{"C":"愛因斯坦光電方程：hc/λ − Φ = K<sub>max</sub>。<br>hc/λ − Φ = 5 eV；hc/(2λ) − Φ = 1 eV。相減：hc/(2λ) = 4 eV ⇒ hc/λ = 8 eV，Φ = 3 eV。<br>最大波長（臨閾）：hc/λ<sub>0</sub> = Φ ⇒ λ<sub>0</sub> = (8/3)λ。<br>答案 <b>B</b>。","E":"Einstein's photoelectric equation: hc/λ − Φ = K<sub>max</sub>.<br>hc/λ − Φ = 5 eV; hc/(2λ) − Φ = 1 eV. Subtracting: hc/(2λ) = 4 eV ⇒ hc/λ = 8 eV, Φ = 3 eV.<br>Longest (threshold) wavelength: hc/λ<sub>0</sub> = Φ ⇒ λ<sub>0</sub> = (8/3)λ.<br>Answer <b>B</b>."}},{"id":"OP-2024-24","p":"P2","s":2024,"n":"2.4","t":"atom","x":false,"a":"B","pub":"OUP","ex":{"C":"E<sub>K</sub> = hf − Φ：斜率是普朗克常數 h，橫軸截距是臨閾頻率 f<sub>0</sub> = Φ/h，兩者都與光的強度無關。強度只影響光電子的數目（光電流）。<br>答案 <b>B</b>。","E":"E<sub>K</sub> = hf − Φ: the slope is Planck's constant h and the horizontal intercept is the threshold frequency f<sub>0</sub> = Φ/h. Neither depends on the light intensity, which only changes the number of photoelectrons (the photocurrent).<br>Answer <b>B</b>."}},{"id":"OP-2024-25","p":"P2","s":2024,"n":"2.5","t":"atom","x":false,"a":"D","pub":"OUP","ex":{"C":"(1) 14 eV 的光子 > 13.6 eV，可使基態的氫原子電離，電子躍遷至自由態 ✓。<br>(2) 電子碰撞可把部分能量交給原子，只需大於某兩能級之差，例如由 n = 3 躍遷至 n = 4 只需 0.66 eV，1 eV 的電子足以令處於受激態的原子躍遷 ✓。<br>(3) 光子必須剛好等於能級差才會被吸收：−0.85 − (−1.51) = 0.66 eV，剛好對應 n = 3 → n = 4 ✓。<br>答案 <b>D</b>。","E":"(1) A 14 eV photon is more than 13.6 eV, so it can ionize a ground-state atom (electron goes to the free state) ✓.<br>(2) A colliding electron can give part of its energy to the atom; it only needs more than some energy gap, e.g. n = 3 → n = 4 needs only 0.66 eV, so a 1 eV electron can cause a transition in an excited atom ✓.<br>(3) A photon is absorbed only if its energy exactly equals a level difference: −0.85 − (−1.51) = 0.66 eV, exactly n = 3 → n = 4 ✓.<br>Answer <b>D</b>."}},{"id":"OP-2024-26","p":"P2","s":2024,"n":"2.6","t":"atom","x":false,"a":"B","pub":"OUP","ex":{"C":"德布羅意波長 λ = h/p = h/√(2mK) ∝ 1/√K。動能由 1 keV 增至 2 keV ⇒ λ′ = λ/√2。<br>答案 <b>B</b>。","E":"de Broglie wavelength λ = h/p = h/√(2mK) ∝ 1/√K. KE from 1 keV to 2 keV ⇒ λ′ = λ/√2.<br>Answer <b>B</b>."}},{"id":"OP-2024-27","p":"P2","s":2024,"n":"2.7","t":"atom","x":false,"a":"C","pub":"OUP","ex":{"C":"(1) STM 只能掃描樣本表面，不能顯示內部結構 ✗。<br>(2) STM 探針可以在導體表面推動、操縱個別原子 ✓。<br>(3) STM 的橫向解像度約 0.1 nm = 10<sup>−10</sup> m，足以分辨原子 ✓。<br>答案 <b>C</b>。","E":"(1) An STM only scans the surface of a specimen, not its internal structure ✗.<br>(2) The STM tip can push and manipulate individual atoms on a conducting surface ✓.<br>(3) Its lateral resolution is about 0.1 nm = 10<sup>−10</sup> m, enough to resolve atoms ✓.<br>Answer <b>C</b>."}},{"id":"OP-2024-28","p":"P2","s":2024,"n":"2.8","t":"atom","x":false,"a":"C","pub":"OUP","ex":{"C":"(1) 納米材料的性質可與大塊材料很不同，某些納米材料可能不導電 ✓。<br>(2) 納米材料可用於淨化水、催化劑減少污染等，對環保有益 ✗。<br>(3) 例如加入納米銀粒子可製造抗菌油漆 ✓。<br>答案 <b>C</b>。","E":"(1) Nanomaterials can behave very differently from bulk materials; some may be electrical insulators ✓.<br>(2) Nanomaterials are used for water purification, catalysts that cut pollution, etc., so they do benefit the environment ✗.<br>(3) For example, silver nanoparticles are added to make antimicrobial paint ✓.<br>Answer <b>C</b>."}},{"id":"OP-2024-31","p":"P2","s":2024,"n":"3.1","t":"energy","x":false,"a":"D","pub":"OUP","ex":{"C":"亮度相同即光通量相同。鎢絲燈的光通量 = 光視效能 × 功率 = 10 × 60 = 600 lm。<br>緊湊型熒光燈的功率 = 600/50 = 12 W。（最終能源效益 3% 是多餘資料。）<br>答案 <b>D</b>。","E":"Same brightness means the same luminous flux. Incandescent lamp: luminous flux = efficacy × power = 10 × 60 = 600 lm.<br>Fluorescent lamp power = 600/50 = 12 W. (The 3% end-use efficiency is extra information.)<br>Answer <b>D</b>."}},{"id":"OP-2024-32","p":"P2","s":2024,"n":"3.2","t":"energy","x":false,"a":"D","pub":"OUP","ex":{"C":"點光源的照明度 E = I cos θ / r<sup>2</sup>，其中 cos θ = h/r ⇒ E = Ih/r<sup>3</sup> ∝ 1/r<sup>3</sup>。<br>r<sub>X</sub><sup>2</sup> = 2<sup>2</sup> + 0.8<sup>2</sup> = 4.64，r<sub>Y</sub><sup>2</sup> = 2<sup>2</sup> + 2.4<sup>2</sup> = 9.76。<br>E<sub>X</sub>/E<sub>Y</sub> = (r<sub>Y</sub>/r<sub>X</sub>)<sup>3</sup> = (9.76/4.64)<sup>3/2</sup> ≈ 3.05。<br>答案 <b>D</b>。","E":"Illuminance from a point source E = I cos θ / r<sup>2</sup>, with cos θ = h/r ⇒ E = Ih/r<sup>3</sup> ∝ 1/r<sup>3</sup>.<br>r<sub>X</sub><sup>2</sup> = 2<sup>2</sup> + 0.8<sup>2</sup> = 4.64, r<sub>Y</sub><sup>2</sup> = 2<sup>2</sup> + 2.4<sup>2</sup> = 9.76.<br>E<sub>X</sub>/E<sub>Y</sub> = (r<sub>Y</sub>/r<sub>X</sub>)<sup>3</sup> = (9.76/4.64)<sup>3/2</sup> ≈ 3.05.<br>Answer <b>D</b>."}},{"id":"OP-2024-33","p":"P2","s":2024,"n":"3.3","t":"energy","x":false,"a":"B","pub":"OUP","ex":{"C":"風力渦輪機的最大功率 P = ½ρAv<sup>3</sup>η，A = πL<sup>2</sup>（L 為扇葉長度）⇒ P ∝ L<sup>2</sup>v<sup>3</sup>。<br>L → 1.8L，P 不變：(1.8)<sup>2</sup>v′<sup>3</sup> = v<sup>3</sup> ⇒ v′ = v/(3.24)<sup>1/3</sup> ≈ 0.68v。<br>答案 <b>B</b>。","E":"Maximum power of a wind turbine P = ½ρAv<sup>3</sup>η with A = πL<sup>2</sup> (L = blade length) ⇒ P ∝ L<sup>2</sup>v<sup>3</sup>.<br>L → 1.8L with P unchanged: (1.8)<sup>2</sup>v′<sup>3</sup> = v<sup>3</sup> ⇒ v′ = v/(3.24)<sup>1/3</sup> ≈ 0.68v.<br>Answer <b>B</b>."}},{"id":"OP-2024-34","p":"P2","s":2024,"n":"3.4","t":"energy","x":false,"a":"B","pub":"OUP","ex":{"C":"穩定狀態下，通過 X 和 Y 的熱流率相同。兩層大小（面積、厚度）相同，熱流率 ∝ κΔT：<br>κ(38 − T) = 2κ(T − 27) ⇒ 38 − T = 2T − 54 ⇒ T = 30.7 °C。<br>答案 <b>B</b>。","E":"In the steady state the rate of heat flow through X and Y is the same. The layers have equal dimensions, so the heat flow rate ∝ κΔT:<br>κ(38 − T) = 2κ(T − 27) ⇒ 38 − T = 2T − 54 ⇒ T = 30.7 °C.<br>Answer <b>B</b>."}},{"id":"OP-2024-35","p":"P2","s":2024,"n":"3.5","t":"energy","x":false,"a":"D","pub":"OUP","ex":{"C":"COP = 冷卻能力 / 輸入電功率 ⇒ 輸入功率 = 5.1/3.5 = 1.46 kW。<br>釋放至室外的熱 = 從室內抽走的熱 + 輸入電能 = 5.1 + 1.46 = 6.56 kW（即每秒 6.56 kJ；選項的單位應理解為每秒）。<br>答案 <b>D</b>。","E":"COP = cooling capacity / electrical input ⇒ input = 5.1/3.5 = 1.46 kW.<br>Heat released outdoors = heat removed from the room + electrical energy input = 5.1 + 1.46 = 6.56 kW (i.e. 6.56 kJ every second; the options' unit should be read as per second).<br>Answer <b>D</b>."}},{"id":"OP-2024-37","p":"P2","s":2024,"n":"3.7","t":"energy","x":false,"a":"A","pub":"OUP","ex":{"C":"(1) 太陽能電池由 p 型和 n 型兩種半導體結合而成 ✓。<br>(2) 發電時沒有排放，但製造過程需要能源並產生廢料 ✓。<br>(3) 太陽能亦可用於熱水器、太陽能煮食等，不只用於發電 ✗。<br>答案 <b>A</b>。","E":"(1) A solar cell is made of p-type and n-type semiconductors joined together ✓.<br>(2) It produces no emissions when generating electricity, but making it uses energy and produces waste ✓.<br>(3) Solar energy can also be used directly, e.g. solar water heaters and solar cookers ✗.<br>Answer <b>A</b>."}},{"id":"OP-2024-38","p":"P2","s":2024,"n":"3.8","t":"energy","x":false,"a":"A","pub":"OUP","ex":{"C":"(1) 壓水式反應堆中，高壓水同時是減速劑，把快中子減慢 ✓。<br>(2) 加壓的目的正是令水在高温下<b>不會</b>沸騰；蒸汽是在蒸汽發生器的二次迴路中產生的 ✗。<br>(3) 控制棒吸收中子以控制反應速率，並非減慢中子以引發裂變 ✗。<br>答案 <b>A</b>。","E":"(1) In a PWR the pressurized water also acts as the moderator, slowing down fast neutrons ✓.<br>(2) The water is pressurized precisely so that it does <b>not</b> boil; steam is produced in the secondary loop of the steam generator ✗.<br>(3) Control rods absorb neutrons to control the reaction rate; they do not slow neutrons down to cause fission ✗.<br>Answer <b>A</b>."}},{"id":"OP-2024-41","p":"P2","s":2024,"n":"4.1","t":"med","x":false,"a":"C","pub":"OUP","ex":{"C":"視覺調節是睫狀肌改變晶狀體的厚度（焦強），使不同距離的物體都能在視網膜上形成清晰的像。<br>答案 <b>C</b>。","E":"Accommodation is the ciliary muscles changing the thickness (power) of the eye lens so that objects at different distances form sharp images on the retina.<br>Answer <b>C</b>."}},{"id":"OP-2024-42","p":"P2","s":2024,"n":"4.2","t":"med","x":false,"a":"A","pub":"OUP","ex":{"C":"θ<sub>R</sub> ≈ 1.22λ/d 是瑞利判據，d 是瞳孔（孔徑）的直徑。這是衍射造成的限制，只與瞳孔大小及光的波長有關。<br>答案 <b>A</b>。","E":"θ<sub>R</sub> ≈ 1.22λ/d is the Rayleigh criterion, where d is the diameter of the pupil (aperture). This diffraction limit depends only on the pupil size and the wavelength of light.<br>Answer <b>A</b>."}},{"id":"OP-2024-43","p":"P2","s":2024,"n":"4.3","t":"med","x":false,"a":"B","pub":"OUP","ex":{"C":"要糾正近視，眼鏡須使無限遠的物體成虛像於遠點（500 cm）。<br>凹透鏡的焦距 f = −500 cm = −5 m ⇒ 焦強 P = 1/f = −0.2 D。<br>答案 <b>B</b>。","E":"To correct short sight, the spectacles must form a virtual image of a very distant object at the far point (500 cm).<br>Concave lens focal length f = −500 cm = −5 m ⇒ power P = 1/f = −0.2 D.<br>Answer <b>B</b>."}},{"id":"OP-2024-44","p":"P2","s":2024,"n":"4.4","t":"med","x":false,"a":"C","pub":"OUP","ex":{"C":"點聲源的強度 I ∝ 1/d<sup>2</sup>，距離加倍 ⇒ 強度變為 ¼。<br>聲強級變化 = 10 log(¼) = −6.0 dB ⇒ 50 − 6.0 = 44.0 dB。<br>答案 <b>C</b>。","E":"For a point source I ∝ 1/d<sup>2</sup>; doubling the distance makes the intensity ¼.<br>Change in sound intensity level = 10 log(¼) = −6.0 dB ⇒ 50 − 6.0 = 44.0 dB.<br>Answer <b>C</b>."}},{"id":"OP-2024-45","p":"P2","s":2024,"n":"4.5","t":"med","x":false,"a":"B","pub":"OUP","ex":{"C":"強度反射係數 α = ((Z<sub>2</sub> − Z<sub>1</sub>)/(Z<sub>2</sub> + Z<sub>1</sub>))<sup>2</sup>。<br>P–Q 接面：α<sub>1</sub> = (0.2/3.0)<sup>2</sup> = 0.00444，透射的強度 = 1 − 0.00444 = 0.99556 單位。<br>Q–R 接面：α<sub>2</sub> = (0.2/3.4)<sup>2</sup> = 0.00346。反射強度 = 0.99556 × 0.00346 ≈ 0.003 44 單位。<br>答案 <b>B</b>。","E":"Intensity reflection coefficient α = ((Z<sub>2</sub> − Z<sub>1</sub>)/(Z<sub>2</sub> + Z<sub>1</sub>))<sup>2</sup>.<br>P–Q boundary: α<sub>1</sub> = (0.2/3.0)<sup>2</sup> = 0.00444, so the transmitted intensity = 1 − 0.00444 = 0.99556 unit.<br>Q–R boundary: α<sub>2</sub> = (0.2/3.4)<sup>2</sup> = 0.00346. Reflected intensity = 0.99556 × 0.00346 ≈ 0.003 44 unit.<br>Answer <b>B</b>."}},{"id":"OP-2024-46","p":"P2","s":2024,"n":"4.6","t":"med","x":false,"a":"D","pub":"OUP","ex":{"C":"X 射線沿中線穿過厚度 x 的結構，其中骨佔 y，脂肪佔 (x − y)。<br>I = I<sub>0</sub> e<sup>−μ<sub>1</sub>(x − y)</sup> e<sup>−μ<sub>2</sub>y</sup> = I<sub>0</sub> e<sup>−μ<sub>1</sub>x + μ<sub>1</sub>y − μ<sub>2</sub>y</sup>。<br>答案 <b>D</b>。","E":"Along the central line the X-ray passes through a thickness x, of which y is bone and (x − y) is fat.<br>I = I<sub>0</sub> e<sup>−μ<sub>1</sub>(x − y)</sup> e<sup>−μ<sub>2</sub>y</sup> = I<sub>0</sub> e<sup>−μ<sub>1</sub>x + μ<sub>1</sub>y − μ<sub>2</sub>y</sup>.<br>Answer <b>D</b>."}},{"id":"OP-2024-47","p":"P2","s":2024,"n":"4.7","t":"med","x":false,"a":"A","pub":"OUP","ex":{"C":"(1) 傳統 X 射線照片是 2D 投影，重疊的器官難以區分 ✓。<br>(2) X 射線照片可涵蓋大範圍（如整個胸腔），視野並不狹窄 ✗。<br>(3) X 射線照射後身體不會帶有放射性 ✗。<br>答案 <b>A</b>。","E":"(1) A conventional radiograph is a 2D projection, so overlapping structures are hard to distinguish ✓.<br>(2) A radiograph can cover a large area (e.g. the whole chest); its field of view is not small ✗.<br>(3) The body does not become radioactive after an X-ray ✗.<br>Answer <b>A</b>."}},{"id":"OP-2024-48","p":"P2","s":2024,"n":"4.8","t":"med","x":false,"a":"C","pub":"OUP","ex":{"C":"CT 掃描須由多個角度逐層取像，再由電腦重建切面影像，所需的總時間最長。超聲波和內窺鏡是即時影像，傳統 X 射線攝影只需一次曝光。<br>答案 <b>C</b>。","E":"CT scanning has to take images slice by slice from many angles and then reconstruct the cross-sections by computer, so it takes the longest. Ultrasound and endoscopy give real-time images, and an X-ray radiograph needs only one exposure.<br>Answer <b>C</b>."}},{"id":"OA-2023-01","p":"1A","s":2023,"n":"1","t":"heat","x":false,"a":"C","pub":"OUP","ex":{"C":"奶吸收的熱 = 咖啡放出的熱：C<sub>奶</sub>(40 − 10) = C<sub>咖啡</sub>(60 − 40) ⇒ C<sub>咖啡</sub> = 1.5 C<sub>奶</sub>，咖啡的熱容量較大 ✓。<br>A、D：只知道熱容量 (mc) 的大小，不能分別比較質量或比熱容量 ✗。<br>B：奶加倍：2C<sub>奶</sub>(T − 10) = 1.5C<sub>奶</sub>(60 − T) ⇒ T ≈ 31.4 °C，不是 20 °C ✗。<br>答案 <b>C</b>。","E":"Heat gained by milk = heat lost by coffee: C<sub>milk</sub>(40 − 10) = C<sub>coffee</sub>(60 − 40) ⇒ C<sub>coffee</sub> = 1.5 C<sub>milk</sub>, so the coffee has the higher heat capacity ✓.<br>A, D: knowing only heat capacities (mc), we cannot compare the masses or specific heat capacities separately ✗.<br>B: doubling the milk: 2C<sub>milk</sub>(T − 10) = 1.5C<sub>milk</sub>(60 − T) ⇒ T ≈ 31.4 °C, not 20 °C ✗.<br>Answer <b>C</b>."}},{"id":"OA-2023-02","p":"1A","s":2023,"n":"2","t":"heat","x":false,"a":"C","pub":"OUP","ex":{"C":"物體由液體冷卻，QR 段温度不變，是凝固（液 → 固）過程。<br>(1) PQ 段温度下降，物體放出能量 ✗。<br>(2) 凝固在 R 完成，之後 RS 段是固體冷卻，S 時為純固體 ✓。<br>(3) 凝固時放出潛熱，分子的平均勢能減少（動能不變）✓。<br>答案 <b>C</b>。","E":"The object cools from a liquid; during QR the temperature is constant, so QR is solidification (liquid → solid).<br>(1) During PQ the temperature falls, so the object loses energy ✗.<br>(2) Solidification is complete at R; RS is the solid cooling, so it is purely solid at S ✓.<br>(3) During solidification latent heat is released and the average molecular PE decreases (KE unchanged) ✓.<br>Answer <b>C</b>."}},{"id":"OA-2023-03","p":"1A","s":2023,"n":"3","t":"heat","x":false,"a":"D","pub":"OUP","ex":{"C":"體積不變，p ∝ T（開氏温度）。<br>p<sub>2</sub>/p<sub>1</sub> = (100 + 273)/(25 + 273) = 373/298 = 1.25 ⇒ 壓強增加 25%。（不可直接用攝氏温度計算。）<br>答案 <b>D</b>。","E":"At constant volume p ∝ T (in kelvin).<br>p<sub>2</sub>/p<sub>1</sub> = (100 + 273)/(25 + 273) = 373/298 = 1.25 ⇒ the pressure increases by 25%. (Celsius temperatures cannot be used directly.)<br>Answer <b>D</b>."}},{"id":"OA-2023-04","p":"1A","s":2023,"n":"4","t":"mech","x":false,"a":"D","pub":"OUP","ex":{"C":"(1) 位移 = v–t 線圖下的面積。0–10 s 內 X 的面積較大（Y 較遲出發），平均速度不同 ✗。<br>(2) 兩線在 t = 10 s 相交，瞬時速度相同 ✓。<br>(3) 平均加速度 = Δv/Δt：兩車由 0 增至相同速度，Δt 都是 10 s，相同 ✓。<br>答案 <b>D</b>。","E":"(1) Displacement = area under the v–t graph. From 0 to 10 s X has the larger area (Y starts later), so the average velocities differ ✗.<br>(2) The lines cross at t = 10 s, so the instantaneous velocities are equal ✓.<br>(3) Average acceleration = Δv/Δt: both go from 0 to the same velocity and Δt = 10 s for both, so equal ✓.<br>Answer <b>D</b>."}},{"id":"OA-2023-05","p":"1A","s":2023,"n":"5","t":"mech","x":false,"a":"C","pub":"OUP","ex":{"C":"F–t 線圖下的面積 = 衝量 = 動量變化。<br>面積 = 900 × 10 + ½(900 + 1500) × 5 = 9000 + 6000 = 15 000 N s。<br>v = 15 000/1000 = 15 m s<sup>−1</sup>。<br>答案 <b>C</b>。","E":"Area under the F–t graph = impulse = change in momentum.<br>Area = 900 × 10 + ½(900 + 1500) × 5 = 9000 + 6000 = 15 000 N s.<br>v = 15 000/1000 = 15 m s<sup>−1</sup>.<br>Answer <b>C</b>."}},{"id":"OA-2023-06","p":"1A","s":2023,"n":"6","t":"mech","x":false,"a":"B","pub":"OUP","ex":{"C":"設棒長 4L，PQ = L，QR = 3L。PQ 的重心與 Q 相距 L/2，QR 的重心與 Q 相距 3L/2。<br>以 Q 取力矩：mg(L/2) = Mg(3L/2) ⇒ M = m/3。<br>張力 T = (m + m/3)g = 1.33mg。<br>答案 <b>B</b>。","E":"Let the rod be 4L long, with PQ = L and QR = 3L. The centre of gravity of PQ is L/2 from Q and that of QR is 3L/2 from Q.<br>Moments about Q: mg(L/2) = Mg(3L/2) ⇒ M = m/3.<br>Tension T = (m + m/3)g = 1.33mg.<br>Answer <b>B</b>."}},{"id":"OA-2023-07","p":"1A","s":2023,"n":"7","t":"mech","x":false,"a":"D","pub":"OUP","ex":{"C":"方塊和楔子都靜止，可視為一個整體。整體在鉛垂方向平衡：地面的支撐力 = 總重量 = (m + 3m)g = 4mg；水平方向沒有外力，所以地面不需施摩擦力。<br>答案 <b>D</b>。","E":"The block and the wedge are both at rest, so treat them as one system. Vertically: force from the ground = total weight = (m + 3m)g = 4mg. Horizontally there is no external force, so the ground exerts no friction.<br>Answer <b>D</b>."}},{"id":"OA-2023-08","p":"1A","s":2023,"n":"8","t":"mech","x":false,"a":"B","pub":"OUP","ex":{"C":"取離開球拍的方向為正。Δp = m(v − u) = 0.0055 × (12 − (−12)) = 0.132 kg m s<sup>−1</sup>。<br>F = Δp/Δt = 0.132/0.2 = 0.66 N。<br>答案 <b>B</b>。","E":"Take the direction leaving the racket as positive. Δp = m(v − u) = 0.0055 × (12 − (−12)) = 0.132 kg m s<sup>−1</sup>.<br>F = Δp/Δt = 0.132/0.2 = 0.66 N.<br>Answer <b>B</b>."}},{"id":"OA-2023-09","p":"1A","s":2023,"n":"9","t":"mech","x":false,"a":"A","pub":"OUP","ex":{"C":"(1) Q 的發射點較低，飛行時間較短，卻落得較遠，所以 Q 的水平速率較高 ✓。<br>(2) 兩者的水平速度和鉛垂速度都不同，到達地面時的速度不同 ✗。<br>(3) 飛行時間 t = √(2h/g)，高度不同，不會同時到達 ✗。<br>答案 <b>A</b>。","E":"(1) Q is projected from a lower point, so its time of flight is shorter, yet it lands farther away: Q's horizontal speed is higher ✓.<br>(2) Both their horizontal and vertical velocities differ, so their landing velocities differ ✗.<br>(3) Time of flight t = √(2h/g); the heights differ, so they do not land together ✗.<br>Answer <b>A</b>."}},{"id":"OA-2023-10","p":"1A","s":2023,"n":"10","t":"mech","x":false,"a":"C","pub":"OUP","ex":{"C":"重心由離地 5 cm（平放，高 10 cm）升至離地 10 cm（直立，高 20 cm），升高 0.05 m。<br>ΔPE = mgΔh = 0.3 × 9.81 × 0.05 ≈ 0.147 J。<br>答案 <b>C</b>。","E":"The centre of gravity rises from 5 cm (lying, height 10 cm) to 10 cm (standing, height 20 cm), i.e. by 0.05 m.<br>ΔPE = mgΔh = 0.3 × 9.81 × 0.05 ≈ 0.147 J.<br>Answer <b>C</b>."}},{"id":"OA-2023-11","p":"1A","s":2023,"n":"11","t":"mech","x":true,"a":"A","pub":"OUP","ex":{"C":"升力垂直於機翼：鉛垂方向 L cos θ = mg；水平方向 L sin θ = mv<sup>2</sup>/r。<br>tan θ = v<sup>2</sup>/(rg) = 200<sup>2</sup>/(15 000 × 9.81) = 0.272 ⇒ θ ≈ 15.2°。<br>答案 <b>A</b>。","E":"The lift is perpendicular to the wings: vertically L cos θ = mg; horizontally L sin θ = mv<sup>2</sup>/r.<br>tan θ = v<sup>2</sup>/(rg) = 200<sup>2</sup>/(15 000 × 9.81) = 0.272 ⇒ θ ≈ 15.2°.<br>Answer <b>A</b>."}},{"id":"OA-2023-12","p":"1A","s":2023,"n":"12","t":"mech","x":true,"a":"A","pub":"OUP","ex":{"C":"太空人距地球表面 2R<sub>E</sub>，即距地球中心 3R<sub>E</sub>。g ∝ 1/r<sup>2</sup>：<br>g′ = 9.81 × (1/3)<sup>2</sup> = 1.09 N kg<sup>−1</sup>。<br>答案 <b>A</b>。","E":"The astronaut is 2R<sub>E</sub> above the surface, i.e. 3R<sub>E</sub> from the Earth's centre. g ∝ 1/r<sup>2</sup>:<br>g′ = 9.81 × (1/3)<sup>2</sup> = 1.09 N kg<sup>−1</sup>.<br>Answer <b>A</b>."}},{"id":"OA-2023-13","p":"1A","s":2023,"n":"13","t":"wave","x":false,"a":"B","pub":"OUP","ex":{"C":"由線圖：3 s 內完成 1.5 個週期 ⇒ T = 2 s，f = 0.5 Hz，(3) ✗。<br>(1) 縱波的粒子沿傳播方向（左右）振動，不會「向上」移動 ✗。<br>(2) 在 t = 3 s，X 位於平衡位置，速率最大，動能最大 ✓。<br>答案 <b>B</b>。","E":"From the graph: 1.5 cycles in 3 s ⇒ T = 2 s, f = 0.5 Hz, so (3) ✗.<br>(1) Particles of a longitudinal wave vibrate along the direction of travel (left–right), not 'upward' ✗.<br>(2) At t = 3 s, X is at its equilibrium position with maximum speed, so its KE is maximum ✓.<br>Answer <b>B</b>."}},{"id":"OA-2023-14","p":"1A","s":2023,"n":"14","t":"wave","x":false,"a":"D","pub":"OUP","ex":{"C":"(1) P 是波腹且瞬時靜止，表示此刻整條繩子都處於最大位移（駐波中所有粒子同時到達最大位移），所以 R 此刻亦瞬時靜止 ✗。<br>(2) 駐波中所有粒子同時通過平衡位置 ✓。<br>(3) P 在波腹，振幅最大；Q 不在波腹，振幅較小 ✓。<br>答案 <b>D</b>。","E":"(1) P is an antinode and is momentarily at rest, so the whole string is at maximum displacement at this instant (all particles of a stationary wave reach their extremes together); R is also momentarily at rest ✗.<br>(2) All particles of a stationary wave pass through equilibrium at the same time ✓.<br>(3) P is at an antinode (largest amplitude) while Q is not, so their amplitudes differ ✓.<br>Answer <b>D</b>."}},{"id":"OA-2023-15","p":"1A","s":2023,"n":"15","t":"wave","x":false,"a":"D","pub":"OUP","ex":{"C":"比較圖 c 和圖 d，各粒子的位移約為：b 和 j 向左約 3 格（最大），f 向右約 3 格（最大），d 和 h 位移為零。<br>A ✗：d 是疏部中心（c 向左、e 向右，粒子從 d 散開），h 是密部中心，相鄰疏部與密部相距 40 cm ⇒ λ = 80 cm。<br>B、C ✗：b 和 f 處於最大位移，瞬時靜止。<br>D ✓：j 處於最大位移，瞬時靜止。<br>答案 <b>D</b>。","E":"Comparing Figures c and d, the displacements are roughly: b and j about 3 squares to the left (maximum), f about 3 squares to the right (maximum), d and h zero.<br>A ✗: d is the centre of a rarefaction (c moved left, e moved right, so particles spread out from d) and h is the centre of a compression; they are 40 cm apart, so λ = 80 cm.<br>B, C ✗: b and f are at maximum displacement, momentarily at rest.<br>D ✓: j is at maximum displacement, so it is momentarily at rest.<br>Answer <b>D</b>."}},{"id":"OA-2023-16","p":"1A","s":2023,"n":"16","t":"wave","x":false,"a":"B","pub":"OUP","ex":{"C":"志賢先聽到直接傳來的哨聲（50 m），再聽到牆壁的回聲：文昌到牆 70 m，牆到志賢 120 m，共 190 m。<br>時間差 = (190 − 50)/340 = 0.41 s。<br>答案 <b>B</b>。","E":"Johnny first hears the whistle directly (50 m), then the echo from the wall: Isaac to wall 70 m, wall to Johnny 120 m, total 190 m.<br>Time difference = (190 − 50)/340 = 0.41 s.<br>Answer <b>B</b>."}},{"id":"OA-2023-17","p":"1A","s":2023,"n":"17","t":"wave","x":false,"a":"B","pub":"OUP","ex":{"C":"P 與兩揚聲器等距，程差為零；兩揚聲器反相，所以在 P 點相消干涉，學生聽到微弱的聲音（兩波振幅未必完全相等，故並非完全無聲）。<br>答案 <b>B</b>。","E":"P is equidistant from both loudspeakers, so the path difference is zero; since the sources are in antiphase, there is destructive interference at P and the student hears a soft sound (the two amplitudes may not be exactly equal, so not completely silent).<br>Answer <b>B</b>."}},{"id":"OA-2023-18","p":"1A","s":2023,"n":"18","t":"wave","x":false,"a":"C","pub":"OUP","ex":{"C":"兩波源同相，P 點振幅極小 ⇒ 程差 = (n + ½)λ。程差 = 0.64 − 0.61 = 0.03 m。<br>λ = 0.03/(n + ½) = 0.06 m、0.02 m、0.012 m …；v = fλ = 0.6、0.2、0.12 m s<sup>−1</sup> …<br>所以 0.2 m s<sup>−1</sup> 和 0.6 m s<sup>−1</sup> 都有可能。<br>答案 <b>C</b>。","E":"The dippers are in phase and P has minimum amplitude ⇒ path difference = (n + ½)λ. Path difference = 0.64 − 0.61 = 0.03 m.<br>λ = 0.03/(n + ½) = 0.06 m, 0.02 m, 0.012 m, …; v = fλ = 0.6, 0.2, 0.12 m s<sup>−1</sup>, …<br>So both 0.2 m s<sup>−1</sup> and 0.6 m s<sup>−1</sup> are possible.<br>Answer <b>C</b>."}},{"id":"OA-2023-19","p":"1A","s":2023,"n":"19","t":"wave","x":false,"a":"D","pub":"OUP","ex":{"C":"作一條與入射光線平行並穿過光心的參考線，它不會偏折，並與焦平面相交於光軸下方某點。所有平行光線經凸透鏡後都會會聚於焦平面上同一點，所以入射光線的折射光線也必須經過焦平面上光軸<b>下方</b>這一點 —— 只有 S 符合（R 經過 F，只適用於平行於主軸的光線）。<br>答案 <b>D</b>。","E":"Draw a reference ray parallel to the incident ray through the optical centre; it goes straight and meets the focal plane at a point below the axis. All parallel rays through a convex lens meet at the same point on the focal plane, so the refracted ray must also pass through this point <b>below</b> the axis — only S does (R through F applies only to rays parallel to the principal axis).<br>Answer <b>D</b>."}},{"id":"OA-2023-20","p":"1A","s":2023,"n":"20","t":"wave","x":false,"a":"B","pub":"OUP","ex":{"C":"繩波的波速 v = √(T/μ)，λ = v/f。<br>頻率增加、張力減少，兩者都令 λ 變短，必然使波長變短（B）。其他組合中兩項變化的效果互相抵觸或令波長變長。<br>答案 <b>B</b>。","E":"Wave speed on a string v = √(T/μ) and λ = v/f.<br>Increasing the frequency and decreasing the tension both shorten λ, so the wavelength must become shorter (B). In the other combinations the two changes either oppose each other or lengthen λ.<br>Answer <b>B</b>."}},{"id":"OA-2023-21","p":"1A","s":2023,"n":"21","t":"wave","x":true,"a":"A","pub":"OUP","ex":{"C":"屏幕移近 ⇒ 像距 v 要減小。<br>(1) 物體移離透鏡（u 增大），實像的像距減小 ✓。<br>(2) 焦距較長的凸透鏡，同一物距下像距更大 ✗。<br>(3) 凹透鏡只形成虛像，不能投射在屏幕上 ✗。<br>答案 <b>A</b>。","E":"Moving the screen closer means the image distance v must decrease.<br>(1) Moving the object away (larger u) reduces the image distance of a real image ✓.<br>(2) A convex lens of longer focal length gives a larger image distance for the same object distance ✗.<br>(3) A concave lens only forms virtual images, which cannot be captured on a screen ✗.<br>Answer <b>A</b>."}},{"id":"OA-2023-22","p":"1A","s":2023,"n":"22","t":"em","x":true,"a":"C","pub":"OUP","ex":{"C":"由方格可見，以格寬 d 為單位：−4Q 在 0，Y 在 2d，+Q 在 3d，X 在 4d。<br>X 點：−4Q 產生 k(4Q)/(4d)<sup>2</sup> = kQ/(4d<sup>2</sup>)（向左），+Q 產生 kQ/d<sup>2</sup>（向右）⇒ E = 3kQ/(4d<sup>2</sup>)。<br>Y 點：−4Q 產生 k(4Q)/(2d)<sup>2</sup> = kQ/d<sup>2</sup>（向左），+Q 產生 kQ/d<sup>2</sup>（向左，離開 +Q）⇒ 2kQ/d<sup>2</sup>。<br>E<sub>Y</sub>/E = 2 ÷ ¾ = 2.67。<br>答案 <b>C</b>。","E":"Using the grid square d as the unit: −4Q at 0, Y at 2d, +Q at 3d, X at 4d.<br>At X: −4Q gives k(4Q)/(4d)<sup>2</sup> = kQ/(4d<sup>2</sup>) (to the left), +Q gives kQ/d<sup>2</sup> (to the right) ⇒ E = 3kQ/(4d<sup>2</sup>).<br>At Y: −4Q gives k(4Q)/(2d)<sup>2</sup> = kQ/d<sup>2</sup> (to the left), +Q gives kQ/d<sup>2</sup> (to the left, away from +Q) ⇒ 2kQ/d<sup>2</sup>.<br>E<sub>Y</sub>/E = 2 ÷ ¾ = 2.67.<br>Answer <b>C</b>."}},{"id":"OA-2023-23","p":"1A","s":2023,"n":"23","t":"em","x":false,"a":"C","pub":"OUP","ex":{"C":"油滴平衡：qE = mg，E = V/d = 4000/0.20 = 20 000 V m<sup>−1</sup>。<br>q = mg/E = (1 × 10<sup>−5</sup>)(9.81)/20 000 ≈ 4.91 × 10<sup>−9</sup> C。<br>答案 <b>C</b>。","E":"For the droplet to balance: qE = mg, with E = V/d = 4000/0.20 = 20 000 V m<sup>−1</sup>.<br>q = mg/E = (1 × 10<sup>−5</sup>)(9.81)/20 000 ≈ 4.91 × 10<sup>−9</sup> C.<br>Answer <b>C</b>."}},{"id":"OA-2023-24","p":"1A","s":2023,"n":"24","t":"em","x":false,"a":"C","pub":"OUP","ex":{"C":"L<sub>1</sub> 與 (L<sub>2</sub> 並聯 L<sub>3</sub>) 串聯。<br>(1) L<sub>1</sub> 短路：L<sub>3</sub> 兩端得到全部電池電壓，變亮 ✓。<br>(2) L<sub>2</sub> 短路：L<sub>3</sub> 亦被短路而熄滅 ✗。<br>(3) 移走 L<sub>2</sub>：並聯部分的電阻增大，分得較大電壓，L<sub>3</sub> 變亮 ✓。<br>答案 <b>C</b>。","E":"L<sub>1</sub> is in series with (L<sub>2</sub> in parallel with L<sub>3</sub>).<br>(1) L<sub>1</sub> shorted: L<sub>3</sub> gets the full battery voltage and becomes brighter ✓.<br>(2) L<sub>2</sub> shorted: L<sub>3</sub> is shorted too and goes out ✗.<br>(3) L<sub>2</sub> removed: the parallel part has higher resistance and takes a larger share of the voltage, so L<sub>3</sub> becomes brighter ✓.<br>Answer <b>C</b>."}},{"id":"OA-2023-25","p":"1A","s":2023,"n":"25","t":"em","x":true,"a":"C","pub":"OUP","ex":{"C":"5 個燈泡正常發光，輸出功率 = 5 × 30 = 150 W。理想變壓器：原線圈電流 = 150/240 = 0.625 A。<br>保險絲的額定值須略大於正常電流 ⇒ 1 A。（250 mA、500 mA 會燒斷；3 A 太大，保護作用較差。）<br>答案 <b>C</b>。","E":"With 5 bulbs working normally, output power = 5 × 30 = 150 W. For an ideal transformer, primary current = 150/240 = 0.625 A.<br>The fuse rating should be slightly above the normal current ⇒ 1 A. (250 mA and 500 mA would blow; 3 A gives poorer protection.)<br>Answer <b>C</b>."}},{"id":"OA-2023-26","p":"1A","s":2023,"n":"26","t":"em","x":false,"a":"D","pub":"OUP","ex":{"C":"平行導線的磁力 F ∝ I<sub>1</sub>I<sub>2</sub>/r，電流同向相吸、反向相斥。<br>R 的電流與 P、Q 反向，所以 P、Q 都推斥 R（同一方向）。<br>Q 對 R：距離 r ⇒ F；P 對 R：距離 2r ⇒ F/2。合力 = 1.5F。<br>答案 <b>D</b>。","E":"Force per unit length between parallel wires F ∝ I<sub>1</sub>I<sub>2</sub>/r; like currents attract, opposite currents repel.<br>R's current is opposite to those in P and Q, so both P and Q repel R (in the same direction).<br>Q on R: distance r ⇒ F; P on R: distance 2r ⇒ F/2. Resultant = 1.5F.<br>Answer <b>D</b>."}},{"id":"OA-2023-27","p":"1A","s":2023,"n":"27","t":"em","x":false,"a":"C","pub":"OUP","ex":{"C":"理想伏特計的電阻無限大，所以伏特計所在的中間支路沒有電流，中間的電阻器兩端沒有電壓。<br>電流只流經上方電阻器和下方電阻器（與理想安培計）串聯的迴路，兩者平分 12 V，各 6 V。<br>伏特計讀數 = 下方電阻器兩端的電壓 = 6 V。<br>答案 <b>C</b>。","E":"An ideal voltmeter has infinite resistance, so no current flows in the middle branch containing it, and there is no p.d. across the middle resistor.<br>Current flows only round the loop of the top resistor and the bottom resistor (with the ideal ammeter) in series; they share 12 V equally, 6 V each.<br>Voltmeter reading = p.d. across the bottom resistor = 6 V.<br>Answer <b>C</b>."}},{"id":"OA-2023-28","p":"1A","s":2023,"n":"28","t":"em","x":false,"a":"B","pub":"OUP","ex":{"C":"感生電動勢 ε = B × (切割速度方向的有效長度) × v。金屬棒在兩導軌之間、垂直於速度方向的有效長度是導軌間距 d（= L sin 60°），所以 ε = Bdv，I = Bdv/r。<br>答案 <b>B</b>。","E":"Induced e.m.f. ε = B × (effective length perpendicular to the velocity) × v. The effective length of the rod between the rails, perpendicular to its velocity, is the rail separation d (= L sin 60°), so ε = Bdv and I = Bdv/r.<br>Answer <b>B</b>."}},{"id":"OA-2023-29","p":"1A","s":2023,"n":"29","t":"em","x":false,"a":"D","pub":"OUP","ex":{"C":"開關剛閉合時，左方螺線管的電流和磁場迅速增加。根據右手握拳定則及線圈繞向，P 端為南極。<br>右方螺線管的磁通量增加，根據楞次定律，感生電流產生的磁場要反抗這變化，由此定出通過安培計的電流由 N 流向 M。<br>答案 <b>D</b>。","E":"Just after S is closed, the current and magnetic field in the left solenoid increase rapidly. By the right-hand grip rule and the winding direction, end P is a south pole.<br>The flux through the right solenoid increases; by Lenz's law the induced current sets up a field opposing this change, which fixes the current through the ammeter as flowing from N to M.<br>Answer <b>D</b>."}},{"id":"OA-2023-30","p":"1A","s":2023,"n":"30","t":"em","x":false,"a":"A","pub":"OUP","ex":{"C":"電流指出頁面，導線的磁場為逆時針方向：導線上方指向左，下方指向右。<br>圖中導線下方的磁場線較密（合磁場較強），即磁鐵的磁場在下方與導線的磁場同向 ⇒ 磁鐵的磁場由左至右，X 為北極。<br>導線所受的磁力由磁場較強處推向較弱處 ⇒ 向上（亦可用弗林明左手定則驗證）。<br>答案 <b>A</b>。","E":"The current is out of the page, so the wire's field is anticlockwise: to the left above the wire and to the right below it.<br>The field lines are denser (stronger) below the wire, so there the magnets' field is in the same direction as the wire's field ⇒ the magnets' field points from left to right and X is a north pole.<br>The force pushes the wire from the stronger-field region to the weaker one ⇒ upward (check with Fleming's left-hand rule).<br>Answer <b>A</b>."}},{"id":"OA-2023-31","p":"1A","s":2023,"n":"31","t":"nuc","x":false,"a":"A","pub":"OUP","ex":{"C":"質量數減少 232 − 216 = 16 ⇒ α 粒子數目 = 16/4 = 4。<br>4 次 α 衰變令原子序數減少 8：90 − 8 = 82。最終原子序數是 84，須增加 2 ⇒ 2 次 β 衰變。<br>答案 <b>A</b>。","E":"Mass number decreases by 232 − 216 = 16 ⇒ number of α particles = 16/4 = 4.<br>4 α decays reduce the atomic number by 8: 90 − 8 = 82. The final atomic number is 84, an increase of 2 ⇒ 2 β decays.<br>Answer <b>A</b>."}},{"id":"OA-2023-33","p":"1A","s":2023,"n":"33","t":"nuc","x":true,"a":"B","pub":"OUP","ex":{"C":"2 小時產生的能量 E = Pt = 50 × 10<sup>6</sup> × 7200 = 3.6 × 10<sup>11</sup> J。<br>轉換的質量 m = E/c<sup>2</sup> = 3.6 × 10<sup>11</sup>/(3 × 10<sup>8</sup>)<sup>2</sup> = 4 × 10<sup>−6</sup> kg。<br>答案 <b>B</b>。","E":"Energy produced in 2 hours E = Pt = 50 × 10<sup>6</sup> × 7200 = 3.6 × 10<sup>11</sup> J.<br>Mass converted m = E/c<sup>2</sup> = 3.6 × 10<sup>11</sup>/(3 × 10<sup>8</sup>)<sup>2</sup> = 4 × 10<sup>−6</sup> kg.<br>Answer <b>B</b>."}},{"id":"OP-2023-11","p":"P2","s":2023,"n":"1.1","t":"ast","x":false,"a":"A","pub":"OUP","ex":{"C":"(1) 托勒密模型用本輪，哥白尼模型用行星公轉速率不同，都能解釋火星逆行 ✓。<br>(2) 金星完整的相位變化須金星環繞太陽運行才能解釋 ✓。<br>(3) 在托勒密模型中地球靜止於中心，並不運行 ✗。<br>答案 <b>A</b>。","E":"(1) The Ptolemaic model uses epicycles and the Copernican model uses different orbital speeds; both explain the retrograde motion of Mars ✓.<br>(2) The complete cycle of phases of Venus requires Venus to orbit the Sun ✓.<br>(3) In the Ptolemaic model the Earth is stationary at the centre and does not orbit ✗.<br>Answer <b>A</b>."}},{"id":"OP-2023-12","p":"P2","s":2023,"n":"1.2","t":"ast","x":false,"a":"B","pub":"OUP","ex":{"C":"太空站內的太空人與太空站一起自由下墜（環繞地球運行），所以感覺失重。<br>(1) 引力 = GMm/r<sup>2</sup> 與質量有關，兩人質量不同，引力不同 ✗。<br>(2) 引力沒有被抵銷，它提供向心力 ✗。<br>(3) 兩人的加速度都等於該處的 g = GM/r<sup>2</sup>，相同 ✓。<br>答案 <b>B</b>。","E":"Astronauts in a space station are in free fall together with the station (orbiting the Earth), so they feel weightless.<br>(1) Gravitational force GMm/r<sup>2</sup> depends on mass; the masses differ, so the forces differ ✗.<br>(2) Gravity is not balanced; it provides the centripetal force ✗.<br>(3) Both accelerations equal the local g = GM/r<sup>2</sup>, the same ✓.<br>Answer <b>B</b>."}},{"id":"OP-2023-13","p":"P2","s":2023,"n":"1.3","t":"ast","x":false,"a":"C","pub":"OUP","ex":{"C":"(1) 吸收線的位置對應恆星表面大氣中的元素，可推算成分 ✓。<br>(2) 譜線的都卜勒位移可推算徑向速度 ✓。<br>(3) 光譜反映的是恆星表面（光球層），不能推算核心温度 ✗。<br>答案 <b>C</b>。","E":"(1) The absorption lines correspond to elements in the star's outer atmosphere, so the composition can be deduced ✓.<br>(2) The Doppler shift of the lines gives the radial velocity ✓.<br>(3) The spectrum comes from the star's surface (photosphere), not its core ✗.<br>Answer <b>C</b>."}},{"id":"OP-2023-14","p":"P2","s":2023,"n":"1.4","t":"ast","x":false,"a":"B","pub":"OUP","ex":{"C":"比較 1 月與 5 月：P、Q、R 的位置相對不變，它們是遙遠的背景恆星；S 和 T 有明顯視差位移，T 的位移比 S 大。<br>(1) P 和 R 只是都非常遙遠，不能確定等距 ✗。<br>(2) 圖中無法判斷亮度 ✗。<br>(3) 視差越大，距離越近 ⇒ T 比 S 接近地球 ✓。<br>答案 <b>B</b>。","E":"Comparing January and May: P, Q and R stay in the same relative positions, so they are distant background stars; S and T show parallax shifts, and T shifts more than S.<br>(1) P and R are just very far away; we cannot say they are equidistant ✗.<br>(2) Brightness cannot be judged from the figure ✗.<br>(3) Larger parallax means a smaller distance ⇒ T is closer than S ✓.<br>Answer <b>B</b>."}},{"id":"OP-2023-15","p":"P2","s":2023,"n":"1.5","t":"ast","x":false,"a":"C","pub":"OUP","ex":{"C":"(1) 絕對星等越大，光度越低：X 的絕對星等 3.2 最大，光度最低 ✓。<br>(2) 距離由 m − M 判斷：X = −5.7、Y = 0.8、Z = −0.7。Y 的 m − M 最大，距離最遠 ✓。<br>(3) 天空中的亮暗看視星等：Y (2.5) 最大，Y 最暗，而不是 Z ✗。<br>答案 <b>C</b>。","E":"(1) A larger absolute magnitude means lower luminosity: X has the largest, 3.2, so the smallest luminosity ✓.<br>(2) Distance from m − M: X = −5.7, Y = 0.8, Z = −0.7. Y has the largest m − M, so it is the farthest ✓.<br>(3) Brightness in the sky depends on apparent magnitude: Y (2.5) is the largest, so Y is the dimmest, not Z ✗.<br>Answer <b>C</b>."}},{"id":"OP-2023-16","p":"P2","s":2023,"n":"1.6","t":"ast","x":false,"a":"B","pub":"OUP","ex":{"C":"注意橫軸向左表示温度增加。由 L = 4πR<sup>2</sup>σT<sup>4</sup>：<br>(1) P 與太陽光度相同，但 P 在右方，温度較低 ⇒ R 較大 ✓。<br>(2) Q 光度最低而温度最高 ⇒ 半徑最小 ✓。<br>(3) 視亮度還取決於距離，不能確定 ✗。<br>答案 <b>B</b>。","E":"Note that temperature increases to the <b>left</b>. Using L = 4πR<sup>2</sup>σT<sup>4</sup>:<br>(1) P has the same luminosity as the Sun but is further right (cooler) ⇒ larger radius ✓.<br>(2) Q has the lowest luminosity and the highest temperature ⇒ smallest radius ✓.<br>(3) Apparent brightness also depends on distance, so this is not certain ✗.<br>Answer <b>B</b>."}},{"id":"OP-2023-17","p":"P2","s":2023,"n":"1.7","t":"ast","x":false,"a":"D","pub":"OUP","ex":{"C":"視亮度 b = L/(4πd<sup>2</sup>)。P 的視差是 Q 的兩倍 ⇒ d<sub>P</sub> = d<sub>Q</sub>/2。<br>亮度相同：L/d<sub>P</sub><sup>2</sup> = L<sub>Q</sub>/d<sub>Q</sub><sup>2</sup> ⇒ L<sub>Q</sub> = L(d<sub>Q</sub>/d<sub>P</sub>)<sup>2</sup> = 4L。<br>答案 <b>D</b>。","E":"Apparent brightness b = L/(4πd<sup>2</sup>). P's parallax is twice Q's ⇒ d<sub>P</sub> = d<sub>Q</sub>/2.<br>Equal brightness: L/d<sub>P</sub><sup>2</sup> = L<sub>Q</sub>/d<sub>Q</sub><sup>2</sup> ⇒ L<sub>Q</sub> = L(d<sub>Q</sub>/d<sub>P</sub>)<sup>2</sup> = 4L.<br>Answer <b>D</b>."}},{"id":"OP-2023-18","p":"P2","s":2023,"n":"1.8","t":"ast","x":false,"a":"C","pub":"OUP","ex":{"C":"開普勒第三定律：a<sup>3</sup> ∝ T<sup>2</sup>（同一中心天體）。<br>a<sub>歐</sub> = 4.22 × 10<sup>8</sup> × (85/42)<sup>2/3</sup> = 4.22 × 10<sup>8</sup> × 1.60 ≈ 6.75 × 10<sup>8</sup> m。<br>答案 <b>C</b>。","E":"Kepler's third law: a<sup>3</sup> ∝ T<sup>2</sup> (same central body).<br>a<sub>Europa</sub> = 4.22 × 10<sup>8</sup> × (85/42)<sup>2/3</sup> = 4.22 × 10<sup>8</sup> × 1.60 ≈ 6.75 × 10<sup>8</sup> m.<br>Answer <b>C</b>."}},{"id":"OP-2023-21","p":"P2","s":2023,"n":"2.1","t":"atom","x":false,"a":"B","pub":"OUP","ex":{"C":"少數 α 粒子被大角度反彈，表示原子內有一個體積極小但質量和正電荷高度集中的原子核，大到足以令 α 粒子反彈。A、C、D 都不能解釋大角度散射。<br>答案 <b>B</b>。","E":"A few α particles bouncing back shows that the atom has a tiny nucleus in which mass and positive charge are highly concentrated — massive enough to turn the α particles back. A, C and D cannot explain large-angle scattering.<br>Answer <b>B</b>."}},{"id":"OP-2023-22","p":"P2","s":2023,"n":"2.2","t":"atom","x":false,"a":"B","pub":"OUP","ex":{"C":"氫原子吸收特定波長的光子而受激，但隨即把光子向<b>各個方向</b>再發射出來，所以原本方向的該波長光只是部分減弱，形成較暗（而非全黑）的暗線。<br>答案 <b>B</b>。","E":"Hydrogen atoms absorb photons of particular wavelengths and become excited, but then re-emit these photons in <b>all directions</b>. So light of these wavelengths in the original direction is only partly reduced, giving dim (not completely black) dark lines.<br>Answer <b>B</b>."}},{"id":"OP-2023-23","p":"P2","s":2023,"n":"2.3","t":"atom","x":false,"a":"C","pub":"OUP","ex":{"C":"基態 E<sub>1</sub> = −13.6 eV，E<sub>2</sub> = −3.4 eV，E<sub>3</sub> = −1.51 eV。<br>光子要被吸收，能量須剛好等於能級差，或大於 13.6 eV（令原子電離）。<br>(1) 10.8 eV 不等於任何能級差（10.2、12.09、12.75 eV …）✗。<br>(2) 12.1 eV ≈ E<sub>3</sub> − E<sub>1</sub> ✓。<br>(3) 13.8 eV > 13.6 eV，可使原子電離 ✓。<br>答案 <b>C</b>。","E":"Ground state E<sub>1</sub> = −13.6 eV, E<sub>2</sub> = −3.4 eV, E<sub>3</sub> = −1.51 eV.<br>A photon is absorbed only if its energy exactly equals an energy gap, or exceeds 13.6 eV (ionization).<br>(1) 10.8 eV matches no gap (10.2, 12.09, 12.75 eV, …) ✗.<br>(2) 12.1 eV ≈ E<sub>3</sub> − E<sub>1</sub> ✓.<br>(3) 13.8 eV > 13.6 eV, so it ionizes the atom ✓.<br>Answer <b>C</b>."}},{"id":"OP-2023-24","p":"P2","s":2023,"n":"2.4","t":"atom","x":false,"a":"A","pub":"OUP","ex":{"C":"(1) 綠光頻率較高，光子能量較大，K<sub>max</sub> = hf − Φ 增大 ⇒ 遏止電壓 V<sub>s</sub> 的量值增大 ✓。<br>(2)、(3) 光電流取決於每秒射出的光電子數目，即入射光子的數目（光的強度）。題目沒有說明綠光的強度，所以 I<sub>0</sub> 和 I<sub>s</sub> 不一定不變 ✗。<br>答案 <b>A</b>。","E":"(1) Green light has a higher frequency, so each photon has more energy and K<sub>max</sub> = hf − Φ increases ⇒ the magnitude of the stopping voltage V<sub>s</sub> increases ✓.<br>(2), (3) The photocurrent depends on the number of photoelectrons per second, i.e. the number of incident photons (the intensity). The intensity of the green light is not given, so I<sub>0</sub> and I<sub>s</sub> may change ✗.<br>Answer <b>A</b>."}},{"id":"OP-2023-25","p":"P2","s":2023,"n":"2.5","t":"atom","x":false,"a":"A","pub":"OUP","ex":{"C":"光子能量 E = hc/λ = (6.63 × 10<sup>−34</sup>)(3 × 10<sup>8</sup>)/(300 × 10<sup>−9</sup>) = 6.63 × 10<sup>−19</sup> J = 4.14 eV。<br>K<sub>max</sub> = 4.14 − 2.7 = 1.44 eV。<br>答案 <b>A</b>。","E":"Photon energy E = hc/λ = (6.63 × 10<sup>−34</sup>)(3 × 10<sup>8</sup>)/(300 × 10<sup>−9</sup>) = 6.63 × 10<sup>−19</sup> J = 4.14 eV.<br>K<sub>max</sub> = 4.14 − 2.7 = 1.44 eV.<br>Answer <b>A</b>."}},{"id":"OP-2023-26","p":"P2","s":2023,"n":"2.6","t":"atom","x":false,"a":"B","pub":"OUP","ex":{"C":"第一受激態 (n = 2) 跌至基態 (n = 1)：ΔE = −3.4 − (−13.6) = 10.2 eV = 10.2 × 1.6 × 10<sup>−19</sup> = 1.632 × 10<sup>−18</sup> J。<br>光子動量 p = E/c = 1.632 × 10<sup>−18</sup>/(3 × 10<sup>8</sup>) ≈ 5.44 × 10<sup>−27</sup> kg m s<sup>−1</sup>。<br>答案 <b>B</b>。","E":"First excited state (n = 2) to ground state (n = 1): ΔE = −3.4 − (−13.6) = 10.2 eV = 10.2 × 1.6 × 10<sup>−19</sup> = 1.632 × 10<sup>−18</sup> J.<br>Photon momentum p = E/c = 1.632 × 10<sup>−18</sup>/(3 × 10<sup>8</sup>) ≈ 5.44 × 10<sup>−27</sup> kg m s<sup>−1</sup>.<br>Answer <b>B</b>."}},{"id":"OP-2023-27","p":"P2","s":2023,"n":"2.7","t":"atom","x":false,"a":"D","pub":"OUP","ex":{"C":"(1) TEM 的樣本必須非常薄讓電子穿透，但不一定要導電（須導電的是掃描隧穿顯微鏡）✗。<br>(2) TEM 以電子束代替光，以磁透鏡代替玻璃透鏡，原理與光學顯微鏡相似 ✓。<br>(3) 加速電壓增加 ⇒ 電子動量增加 ⇒ 德布羅意波長變短 ⇒ 衍射較小，分辨率提高 ✓。<br>答案 <b>D</b>。","E":"(1) A TEM specimen must be very thin so electrons can pass through, but it need not conduct (that requirement is for the STM) ✗.<br>(2) A TEM uses an electron beam instead of light and magnetic lenses instead of glass lenses — the same principle as an optical microscope ✓.<br>(3) Higher accelerating voltage ⇒ larger electron momentum ⇒ shorter de Broglie wavelength ⇒ less diffraction and higher resolving power ✓.<br>Answer <b>D</b>."}},{"id":"OP-2023-28","p":"P2","s":2023,"n":"2.8","t":"atom","x":false,"a":"A","pub":"OUP","ex":{"C":"蓮花效應利用納米結構使表面<b>疏水</b>（拒水），水珠滾落時帶走污垢而自潔，並不是令玻璃吸水，所以 A 不正確。<br>B、C、D 都是納米材料的正確特性（例如金納米粒子呈紅色、納米碳管強度極高）。<br>答案 <b>A</b>。","E":"The Lotus effect uses nanostructures to make surfaces <b>water-repelling</b> (hydrophobic); water drops roll off and carry dirt away. It does not make windows water-attracting, so A is incorrect.<br>B, C and D are correct properties of nanomaterials (e.g. gold nanoparticles look red; carbon nanotubes are extremely strong).<br>Answer <b>A</b>."}},{"id":"OP-2023-31","p":"P2","s":2023,"n":"3.1","t":"energy","x":false,"a":"D","pub":"OUP","ex":{"C":"製冷劑經膨脹閥後變冷 (Q)，在 X 吸收室內的熱而汽化 (Q → R)，經壓縮機壓縮後變熱 (S)，在 Y 向室外放熱 (S → P)，再回到膨脹閥。<br>(1) 能量由室內的 X 轉移到室外的 Y ✓。<br>(2) P 是經冷凝後的高壓液體，温度高於膨脹後的 Q ✓。<br>(3) 製冷劑在 X 吸熱後才到達 R，所以 R 比 Q 熱 ✓。<br>答案 <b>D</b>。","E":"After the expansion valve the refrigerant is cold (Q); it absorbs heat from the room in X and evaporates (Q → R); the compressor makes it hot (S); it gives out heat to the outside in Y (S → P), then returns to the valve.<br>(1) Energy is transferred from X (indoors) to Y (outdoors) ✓.<br>(2) P is high-pressure liquid after condensing, hotter than Q after expansion ✓.<br>(3) The refrigerant reaches R only after absorbing heat in X, so R is hotter than Q ✓.<br>Answer <b>D</b>."}},{"id":"OP-2023-33","p":"P2","s":2023,"n":"3.3","t":"energy","x":false,"a":"B","pub":"OUP","ex":{"C":"輸入電功率 = 冷卻能力/COP = 1600/3.2 = 500 W。<br>釋放至室外的熱排放率 = 1600 + 500 = 2100 W。<br>答案 <b>B</b>。","E":"Electrical input power = cooling capacity/COP = 1600/3.2 = 500 W.<br>Rate of heat released outdoors = 1600 + 500 = 2100 W.<br>Answer <b>B</b>."}},{"id":"OP-2023-34","p":"P2","s":2023,"n":"3.4","t":"energy","x":false,"a":"B","pub":"OUP","ex":{"C":"(1) 微波可穿透食物數厘米，並非只加熱表面 ✗。<br>(2) 脂肪、糖等其他極性分子也可被微波加熱 ✗。<br>(3) 水分子是極性分子，在微波的交變電場中不斷翻轉，令食物升温 ✓。<br>答案 <b>B</b>。","E":"(1) Microwaves penetrate several centimetres into food, not just the surface ✗.<br>(2) Other polar molecules such as fats and sugars are also heated by microwaves ✗.<br>(3) Water molecules are polar and keep flipping in the alternating electric field of the microwaves, heating the food ✓.<br>Answer <b>B</b>."}},{"id":"OP-2023-35","p":"P2","s":2023,"n":"3.5","t":"energy","x":false,"a":"A","pub":"OUP","ex":{"C":"穩定狀態下通過兩層的熱流率相同，熱流率 = UAΔT：<br>20.2(T − 18) = 2.6(46 − T) ⇒ 22.8T = 363.6 + 119.6 ⇒ T ≈ 21.2 °C。<br>（混凝土層的 U 值大，温度差小，所以接面温度接近 18 °C。）<br>答案 <b>A</b>。","E":"In the steady state the rate of heat flow through both layers is the same, and rate = UAΔT:<br>20.2(T − 18) = 2.6(46 − T) ⇒ 22.8T = 363.6 + 119.6 ⇒ T ≈ 21.2 °C.<br>(The concrete has a large U-value, so the temperature drop across it is small and the junction is close to 18 °C.)<br>Answer <b>A</b>."}},{"id":"OP-2023-36","p":"P2","s":2023,"n":"3.6","t":"energy","x":false,"a":"B","pub":"OUP","ex":{"C":"熒光燈的運作次序：(2) 電流令燈管升温，水銀汽化 → (4) 水銀原子受電子碰撞而受激 → (5) 水銀原子放出紫外輻射 → (1) 磷光質塗層吸收紫外輻射而受激 → (3) 磷光質放出可見光。<br>答案 <b>B</b>。","E":"How a fluorescent lamp works: (2) the current heats the tube and vaporizes the mercury → (4) mercury atoms are excited by collisions with electrons → (5) the mercury atoms emit UV radiation → (1) the phosphor coating absorbs the UV and is excited → (3) the phosphor emits visible light.<br>Answer <b>B</b>."}},{"id":"OP-2023-37","p":"P2","s":2023,"n":"3.7","t":"energy","x":false,"a":"D","pub":"OUP","ex":{"C":"OTTV 反映建築外殼的平均熱傳送率。<br>(1) 玻璃窗的 U 值較高並有太陽輻射直接射入，增大窗戶會<b>增加</b> OTTV ✗。<br>(2) 外牆加厚，U 值降低，OTTV 降低 ✓。<br>(3) 太陽隔熱膜減少太陽輻射熱，OTTV 降低 ✓。<br>答案 <b>D</b>。","E":"OTTV measures the average rate of heat transfer through the building envelope.<br>(1) Windows have a high U-value and let solar radiation in directly, so larger windows <b>increase</b> the OTTV ✗.<br>(2) Thicker walls lower the U-value and the OTTV ✓.<br>(3) Solar control films reduce solar heat gain, lowering the OTTV ✓.<br>Answer <b>D</b>."}},{"id":"OP-2023-38","p":"P2","s":2023,"n":"3.8","t":"energy","x":false,"a":"C","pub":"OUP","ex":{"C":"每部渦輪機的輸出功率 P = ½ρAv<sup>3</sup>η，A = π(12)<sup>2</sup> = 452.4 m<sup>2</sup>。<br>P = ½ × 1.23 × 452.4 × 5<sup>3</sup> × 0.2 ≈ 6955 W。<br>需要的數目 = 200 000/6955 ≈ 28.8 ⇒ 最少 29 部。<br>答案 <b>C</b>。","E":"Output power of each turbine P = ½ρAv<sup>3</sup>η, with A = π(12)<sup>2</sup> = 452.4 m<sup>2</sup>.<br>P = ½ × 1.23 × 452.4 × 5<sup>3</sup> × 0.2 ≈ 6955 W.<br>Number needed = 200 000/6955 ≈ 28.8 ⇒ at least 29 turbines.<br>Answer <b>C</b>."}},{"id":"OP-2023-41","p":"P2","s":2023,"n":"4.1","t":"med","x":false,"a":"D","pub":"OUP","ex":{"C":"(1) 視桿細胞對光敏感，在<b>暗</b>的環境下運作良好 ✗。<br>(2) 視錐細胞集中在黃點（中央凹）✓。<br>(3) 視錐細胞負責彩色視覺 ✓。<br>答案 <b>D</b>。","E":"(1) Rod cells are sensitive to light and work well in <b>dim</b> light ✗.<br>(2) Cone cells are concentrated at the yellow spot (fovea) ✓.<br>(3) Cone cells are responsible for colour vision ✓.<br>Answer <b>D</b>."}},{"id":"OP-2023-42","p":"P2","s":2023,"n":"4.2","t":"med","x":false,"a":"C","pub":"OUP","ex":{"C":"瑞利判據：θ = 1.22λ/d = 1.22 × 700 × 10<sup>−9</sup>/(4 × 10<sup>−3</sup>) = 2.135 × 10<sup>−4</sup> rad。<br>兩物體的距離 = 5 × 2.135 × 10<sup>−4</sup> ≈ 1.07 × 10<sup>−3</sup> m。<br>答案 <b>C</b>。","E":"Rayleigh criterion: θ = 1.22λ/d = 1.22 × 700 × 10<sup>−9</sup>/(4 × 10<sup>−3</sup>) = 2.135 × 10<sup>−4</sup> rad.<br>Separation of the objects = 5 × 2.135 × 10<sup>−4</sup> ≈ 1.07 × 10<sup>−3</sup> m.<br>Answer <b>C</b>."}},{"id":"OP-2023-43","p":"P2","s":2023,"n":"4.3","t":"med","x":false,"a":"A","pub":"OUP","ex":{"C":"像距固定為 3 cm（視網膜）。看遠點：1/f = 1/300 + 1/3 ⇒ f ≈ 2.97 cm；看近點：1/f = 1/22 + 1/3 ⇒ f ≈ 2.64 cm。<br>眼睛的焦距只能在 2.64 cm 至 2.97 cm 之間 ⇒ 只有 2.8 cm 可能。<br>答案 <b>A</b>。","E":"The image distance is fixed at 3 cm (the retina). Viewing the far point: 1/f = 1/300 + 1/3 ⇒ f ≈ 2.97 cm; viewing the near point: 1/f = 1/22 + 1/3 ⇒ f ≈ 2.64 cm.<br>The focal length can only be between 2.64 cm and 2.97 cm ⇒ only 2.8 cm is possible.<br>Answer <b>A</b>."}},{"id":"OP-2023-44","p":"P2","s":2023,"n":"4.4","t":"med","x":false,"a":"C","pub":"OUP","ex":{"C":"兩端光纖的排列不同，是不相干光纖束，不能把一端的影像在另一端重現，只能用來傳送光照明 (2)(3) ✓。<br>(1) 光源在體外（X 端），光由 X 端傳到體內的 Y 端，而非 Y 到 X ✗。<br>答案 <b>C</b>。","E":"The fibres are arranged differently at the two ends, so this is an incoherent bundle: it cannot reproduce an image from one end at the other and is used only to carry light for illumination: (2) and (3) ✓.<br>(1) The light source is outside the body (end X), so light goes from X to Y inside the body, not from Y to X ✗.<br>Answer <b>C</b>."}},{"id":"OP-2023-45","p":"P2","s":2023,"n":"4.5","t":"med","x":false,"a":"B","pub":"OUP","ex":{"C":"中耳的壓強增益來自 (1) 聽小骨的槓桿作用放大力，以及 (2) 鼓膜面積遠大於卵圓窗，壓強 = F/A 因而增大 ✓。<br>(3) 耳蝸注滿液體與壓強增益無關 ✗。<br>答案 <b>B</b>。","E":"The pressure gain in the middle ear comes from (1) the ear bones acting as a lever to magnify the force and (2) the eardrum having a much larger area than the oval window, so pressure = F/A increases ✓.<br>(3) The cochlea being filled with fluid has nothing to do with the pressure gain ✗.<br>Answer <b>B</b>."}},{"id":"OP-2023-46","p":"P2","s":2023,"n":"4.6","t":"med","x":false,"a":"A","pub":"OUP","ex":{"C":"從 P 移向中央，X 射線穿過的脂肪越來越厚，強度逐級減弱；第四條射線穿過骨（衰減係數大），強度最低；在 Q 的射線只穿過很薄的邊緣，強度回升至很高。只有線圖 A 符合。<br>答案 <b>A</b>。","E":"Moving from P towards the centre, the X-rays pass through more and more fat, so the intensity falls step by step; the fourth ray passes through bone (large attenuation coefficient) and is the lowest; the ray at Q only passes through a thin edge, so the intensity rises back to a high value. Only graph A fits.<br>Answer <b>A</b>."}},{"id":"OP-2023-47","p":"P2","s":2023,"n":"4.7","t":"med","x":false,"a":"C","pub":"OUP","ex":{"C":"功率加倍 ⇒ 強度加倍，聲強級 +10 log 2 = +3 dB。<br>距離由 3 m 增至 6 m ⇒ 強度變為 ¼，聲強級 −10 log 4 = −6 dB。<br>60 + 3 − 6 = 57 dB。<br>答案 <b>C</b>。","E":"Doubling the power doubles the intensity: +10 log 2 = +3 dB.<br>Going from 3 m to 6 m makes the intensity ¼: −10 log 4 = −6 dB.<br>60 + 3 − 6 = 57 dB.<br>Answer <b>C</b>."}},{"id":"OP-2023-48","p":"P2","s":2023,"n":"4.8","t":"med","x":false,"a":"B","pub":"OUP","ex":{"C":"4000 → 100，減弱為 1/40。設穿過 n 個半值厚度：(½)<sup>n</sup> = 1/40 ⇒ n = log 40/log 2 = 5.32。<br>厚度 = 5.32 × 5 mm ≈ 26.6 mm ≈ 2.7 cm。<br>答案 <b>B</b>。","E":"4000 → 100 is a reduction to 1/40. If n half-value thicknesses are needed: (½)<sup>n</sup> = 1/40 ⇒ n = log 40/log 2 = 5.32.<br>Thickness = 5.32 × 5 mm ≈ 26.6 mm ≈ 2.7 cm.<br>Answer <b>B</b>."}},{"id":"1A-2024-01","p":"1A","s":2024,"n":"1","t":"heat","x":false,"a":"A","pub":"Pearson"},{"id":"1A-2024-02","p":"1A","s":2024,"n":"2","t":"heat","x":false,"a":"B","pub":"Pearson"},{"id":"1A-2024-03","p":"1A","s":2024,"n":"3","t":"heat","x":true,"a":"D","pub":"Pearson"},{"id":"1A-2024-06","p":"1A","s":2024,"n":"6","t":"mech","x":false,"a":"B","pub":"Pearson"},{"id":"1A-2024-07","p":"1A","s":2024,"n":"7","t":"mech","x":false,"a":"A","pub":"Pearson"},{"id":"1A-2024-08","p":"1A","s":2024,"n":"8","t":"mech","x":false,"a":"A","pub":"Pearson"},{"id":"1A-2024-09","p":"1A","s":2024,"n":"9","t":"mech","x":false,"a":"B","pub":"Pearson"},{"id":"1A-2024-10","p":"1A","s":2024,"n":"10","t":"mech","x":false,"a":"C","pub":"Pearson"},{"id":"1A-2024-11","p":"1A","s":2024,"n":"11","t":"mech","x":true,"a":"C","pub":"Pearson"},{"id":"1A-2024-12","p":"1A","s":2024,"n":"12","t":"mech","x":true,"a":"D","pub":"Pearson"},{"id":"1A-2024-13","p":"1A","s":2024,"n":"13","t":"wave","x":false,"a":"C","pub":"Pearson","ex":{"E":"(1) Incorrect: c and g are at their equilibrium positions at the instants shown, and particles at equilibrium move with maximum speed, so they are not at rest.<br>(2) Correct: read the largest displacement of a particle from its equilibrium position on the grid → amplitude 1.2 cm.<br>(3) Correct: the pattern at t = 2 s is the reverse of that at t = 1 s (compressions and rarefactions swapped), so 1 s = 0.5, 1.5, 2.5, … periods, i.e. f = 0.5, 1.5, 2.5, … Hz. 2.5 Hz is possible.<br>Answer <b>C</b>.","C":"(1) 不正確：圖中 c 和 g 剛好在平衡位置，平衡位置的粒子速率最大，並非靜止。<br>(2) 正確：從方格讀出粒子偏離平衡位置的最大位移 → 振幅 1.2 cm。<br>(3) 正確：t = 2 s 的排列與 t = 1 s 的剛好相反（密部與疏部互換），所以 1 s = 0.5、1.5、2.5…… 個週期，即 f = 0.5、1.5、2.5…… Hz，2.5 Hz 是可能的。<br>答案 <b>C</b>。"}},{"id":"1A-2024-14","p":"1A","s":2024,"n":"14","t":"wave","x":false,"a":"C","pub":"Pearson","ex":{"E":"Doubling f with the same string and tension keeps the wave speed v the same, so λ = v/f is halved and each loop becomes half as long.<br>(1) Incorrect: the number of <b>loops (antinodes)</b> doubles, but the number of nodes goes from n + 1 to 2n + 1, which is not double.<br>(2) Correct: wave speed depends only on the string (tension and mass per unit length).<br>(3) Correct: Y (60 cm) is still a node and X, Z are on opposite sides of it, so X and Z vibrate in antiphase and reach their maximum displacements (in opposite directions) at the same time.<br>Answer <b>C</b>.","C":"弦線和張力不變，波速 v 不變；f 加倍，λ = v/f 減半，每個波環的長度也減半。<br>(1) 不正確：<b>波環（波腹）</b>數目加倍，但波節數目由 n + 1 變成 2n + 1，並非加倍。<br>(2) 正確：波速只取決於弦線（張力及每單位長度的質量）。<br>(3) 正確：Y（60 cm）仍是波節，X 和 Z 分處其兩旁，所以兩者反相振動，同時到達各自（方向相反）的最大位移。<br>答案 <b>C</b>。"}},{"id":"1A-2024-15","p":"1A","s":2024,"n":"15","t":"wave","x":true,"a":"A","pub":"Pearson","ex":{"E":"Fringe separation Δy = λD/a. With a = 0.01 m and λ ≈ 400–700 nm, Δy = (700 × 10<sup>−9</sup>)(2)/0.01 ≈ 0.14 mm, far too small to be seen, so the fringes merge into a single bright spot.<br>To make the fringes visible, Δy must be larger → <b>reduce a</b> (to about 0.1 mm). Changing w or x does not change Δy, and reducing D makes Δy even smaller.<br>Answer <b>A</b>.","C":"條紋間距 Δy = λD/a。a = 0.01 m、λ 約 400–700 nm 時，Δy = (700 × 10<sup>−9</sup>)(2)/0.01 ≈ 0.14 mm，小得無法分辨，條紋疊成一個光點。<br>要看到條紋必須增大 Δy → <b>減小 a</b>（約 0.1 mm）。改變 w 或 x 不影響 Δy，減小 D 更會令 Δy 變小。<br>答案 <b>A</b>。"}},{"id":"1A-2024-16","p":"1A","s":2024,"n":"16","t":"wave","x":false,"a":"A","pub":"Pearson"},{"id":"1A-2024-17","p":"1A","s":2024,"n":"17","t":"wave","x":false,"a":"A","pub":"Pearson","ex":{"E":"(1) Correct: like all sound, ultrasound travels faster in water (≈ 1500 m s<sup>−1</sup>) than in air (≈ 340 m s<sup>−1</sup>).<br>(2) Correct: it speeds up when entering water, so it bends away from the normal.<br>(3) Incorrect: radar uses radio waves/microwaves; ultrasound is used for sonar.<br>Answer <b>A</b>.","C":"(1) 正確：超聲波和所有聲波一樣，在水中（約 1500 m s<sup>−1</sup>）比在空氣中（約 340 m s<sup>−1</sup>）快。<br>(2) 正確：進入水中時速率增加，所以偏離法線。<br>(3) 不正確：雷達使用無線電波／微波；超聲波用於聲納。<br>答案 <b>A</b>。"}},{"id":"1A-2024-18","p":"1A","s":2024,"n":"18","t":"wave","x":false,"a":"C","pub":"Pearson","ex":{"E":"P is the mid-point of S<sub>1</sub>S<sub>2</sub> (path difference 0) and Q has path difference 20 − 15 = 5 cm.<br>(1) Correct: zero path difference gives constructive interference only if the sources are in phase.<br>(2) Incorrect: constructive interference means the amplitude is large; Q still oscillates between crest and trough, so it is not always a crest.<br>(3) Incorrect: with different frequencies the sources are no longer coherent; the phase difference at P keeps changing, so there is no steady cancellation.<br>The INCORRECT statements are (2) and (3) → <b>C</b>.","C":"P 是 S<sub>1</sub>S<sub>2</sub> 的中點（程差為 0），Q 的程差為 20 − 15 = 5 cm。<br>(1) 正確：程差為零而出現相長干涉，波源必須同相。<br>(2) 不正確：相長干涉表示振幅大，Q 仍在波峰與波谷之間振動，並非一直是波峰。<br>(3) 不正確：頻率不同，兩波源不再相干，P 點的相位差不斷改變，不會持續互相抵消。<br>不正確的是 (2) 和 (3) → <b>C</b>。"}},{"id":"1A-2024-19","p":"1A","s":2024,"n":"19","t":"wave","x":false,"a":"A","pub":"Pearson","ex":{"E":"Bending at a surface depends on the <b>relative</b> refractive index n<sub>glass</sub>/n<sub>surrounding</sub>. Water has a larger refractive index than air, so the relative index (for both colours) is closer to 1 → each ray is bent less → θ<sub>1</sub> becomes smaller. The difference in bending between red and violet also shrinks → θ<sub>2</sub> becomes smaller.<br>Answer <b>A</b>.","C":"光在界面的偏折取決於<b>相對</b>折射率 n<sub>玻璃</sub>/n<sub>周圍</sub>。水的折射率比空氣大，兩種色光的相對折射率都更接近 1 → 偏折較少 → θ<sub>1</sub> 變小；紅光與紫光偏折的差別亦減少 → θ<sub>2</sub> 變小。<br>答案 <b>A</b>。"}},{"id":"1A-2024-20","p":"1A","s":2024,"n":"20","t":"wave","x":false,"a":"C","pub":"Pearson","ex":{"E":"For a convex lens (f = 30 cm) forming a real image:<br>• object beyond 2f (u &gt; 60 cm): image between f and 2f, and it moves <b>slower</b> than the object;<br>• object between f and 2f: image beyond 2f, and it moves faster than the object.<br>So the object is beyond 60 cm. As the object moves towards the lens, the image moves away from the lens (u decreases ⇒ v increases).<br>Answer <b>C</b>.","C":"凸透鏡（f = 30 cm）形成實像時：<br>• 物體在 2f 以外（u &gt; 60 cm）：像在 f 與 2f 之間，像移動得比物體<b>慢</b>；<br>• 物體在 f 與 2f 之間：像在 2f 以外，像移動得比物體快。<br>故物體在 60 cm 以外。物體移向透鏡時，像會遠離透鏡（u 減小 ⇒ v 增大）。<br>答案 <b>C</b>。"}},{"id":"1A-2024-21","p":"1A","s":2024,"n":"21","t":"wave","x":false,"a":"D","pub":"Pearson","ex":{"E":"With O and S fixed, the distance u + v is fixed. There are only two lens positions that give a sharp image: the present one (u small, v large → enlarged) and the one with u and v swapped (u large, v small → diminished). To get there, L must move <b>towards S</b>.<br>(1) Incorrect: with L and S fixed, v is fixed, so only one object distance gives a sharp image — the original one, which is enlarged.<br>(2) Incorrect: moving L away from S (towards O) makes u smaller and the image even larger (and not sharp on S).<br>Answer <b>D</b>.","C":"O 和 S 固定時，u + v 固定。只有兩個透鏡位置能得到清晰的像：現時的位置（u 小、v 大 → 放大像），以及 u 與 v 互換的位置（u 大、v 小 → 縮小像）。要到達後者，L 必須移<b>向 S</b>。<br>(1) 不正確：L 和 S 固定時 v 固定，只有原來的物距能成清晰的像，而那是放大像。<br>(2) 不正確：把 L 移離 S（即移近 O），u 變小，像只會更大（而且不能清晰地成在 S 上）。<br>答案 <b>D</b>。"}},{"id":"1A-2024-22","p":"1A","s":2024,"n":"22","t":"em","x":false,"a":"A","pub":"Pearson","ex":{"E":"The forces between the charges are internal action–reaction pairs, so the total force on the three charges is zero: 5 N (to the right, on Q<sub>1</sub>) + 2 N (to the left, on Q<sub>3</sub>) + F = 0 ⇒ F = 3 N (to the left).<br>Let the repulsion between Q<sub>1</sub> and Q<sub>3</sub> be f (equal on both). Attraction of Q<sub>2</sub> on Q<sub>1</sub> = 5 + f; attraction of Q<sub>2</sub> on Q<sub>3</sub> = 2 + f. Both are at the same distance from Q<sub>2</sub>, so Q<sub>1</sub> &gt; Q<sub>3</sub>.<br>Answer <b>A</b>.","C":"三個電荷之間的力都是成對的作用力與反作用力，所以三者所受的合力為零：5 N（向右，作用於 Q<sub>1</sub>）+ 2 N（向左，作用於 Q<sub>3</sub>）+ F = 0 ⇒ F = 3 N（向左）。<br>設 Q<sub>1</sub> 與 Q<sub>3</sub> 之間的推斥力為 f（兩者相同）。Q<sub>2</sub> 對 Q<sub>1</sub> 的吸力 = 5 + f；Q<sub>2</sub> 對 Q<sub>3</sub> 的吸力 = 2 + f。兩者與 Q<sub>2</sub> 的距離相同，故 Q<sub>1</sub> &gt; Q<sub>3</sub>。<br>答案 <b>A</b>。"}},{"id":"1A-2024-23","p":"1A","s":2024,"n":"23","t":"em","x":true,"a":"D","pub":"Pearson","ex":{"E":"At M, the fields of the two equal charges at X and Y are equal and opposite, so E = 0 there → minimum at M.<br>Along MN the vertical components cancel and the horizontal components add: E = 2kQx/(x<sup>2</sup> + a<sup>2</sup>)<sup>3/2</sup>, where a = MX. E rises from 0, reaches a maximum at x = a/√2, then falls. Since MP = a, the maximum is between M and P.<br>Answer <b>D</b>.","C":"在 M 點，X 和 Y 兩個相同電荷產生的電場大小相等、方向相反，E = 0 → M 點最小。<br>沿 MN，垂直分量互相抵消，水平分量相加：E = 2kQx/(x<sup>2</sup> + a<sup>2</sup>)<sup>3/2</sup>，其中 a = MX。E 由 0 上升，在 x = a/√2 時最大，然後下降。由於 MP = a，最大值在 M 與 P 之間。<br>答案 <b>D</b>。"}},{"id":"1A-2024-24","p":"1A","s":2024,"n":"24","t":"em","x":true,"a":"B","pub":"Pearson","ex":{"E":"(1) Correct: E = F/q ⇒ N C<sup>−1</sup>.<br>(2) Correct: for parallel plates E = V/d ⇒ V m<sup>−1</sup>.<br>(3) Incorrect: T m<sup>2</sup> s<sup>−1</sup> = Wb s<sup>−1</sup>, which is the unit of induced e.m.f., i.e. V, not V m<sup>−1</sup>.<br>Answer <b>B</b>.","C":"(1) 正確：E = F/q ⇒ N C<sup>−1</sup>。<br>(2) 正確：平行板 E = V/d ⇒ V m<sup>−1</sup>。<br>(3) 不正確：T m<sup>2</sup> s<sup>−1</sup> = Wb s<sup>−1</sup>，是感生電動勢的單位，即 V，而不是 V m<sup>−1</sup>。<br>答案 <b>B</b>。"}},{"id":"1A-2024-25","p":"1A","s":2024,"n":"25","t":"em","x":false,"a":"A","pub":"Pearson"},{"id":"1A-2024-26","p":"1A","s":2024,"n":"26","t":"em","x":false,"a":"C","pub":"Pearson","ex":{"E":"S open: only cell X drives current through R, and the ammeter (in series with X) reads 2 A, so the current in R is 2 A with 3 V across R.<br>S closed: cells X and Y are now in parallel across R. Both have the same e.m.f. and negligible internal resistance, so R still has 3 V across it and still takes 2 A. This current is shared equally by the two cells, so the ammeter reads 1 A.<br>Answer <b>C</b>.","C":"S 斷開：只有電池 X 驅動電流通過 R，安培計（與 X 串聯）讀數 2 A，所以 R 的電流為 2 A，電勢差為 3 V。<br>S 閉合：電池 X 和 Y 並聯接在 R 兩端。兩者電動勢相同、內阻可略，所以 R 兩端仍是 3 V，電流仍是 2 A，由兩個電池平均分擔，安培計讀數為 1 A。<br>答案 <b>C</b>。"}},{"id":"1A-2024-27","p":"1A","s":2024,"n":"27","t":"em","x":false,"a":"D","pub":"Pearson","ex":{"E":"(1) Incorrect: the mains is a.c., so the live wire is positive with respect to earth half of the time and negative the other half.<br>(2) Incorrect: a live–earth short circuit draws a very large current, so the fuse blows (this is how earthing protects the user).<br>(3) Incorrect: a kilowatt-hour meter measures electrical <b>energy</b> used, not power.<br>All three are incorrect → <b>D</b>.","C":"(1) 不正確：電源是交流電，火線相對於地線有一半時間是正、一半時間是負。<br>(2) 不正確：火線與地線短路時電流極大，保險絲會熔斷（這正是接地保護用者的原理）。<br>(3) 不正確：千瓦小時錶量度用電的<b>能量</b>，而不是功率。<br>三項都不正確 → <b>D</b>。"}},{"id":"1A-2024-28","p":"1A","s":2024,"n":"28","t":"em","x":true,"a":"B","pub":"Pearson","ex":{"E":"Radius of the path r = mv/(qB) = p/(qB). In a uniform field B is constant, so a shrinking spiral means p decreases.<br>(1) Incorrect: if B were not normal to v, the path would be a helix of constant radius, not an inward spiral.<br>(2) Incorrect: a β particle is an electron; its charge and mass do not change.<br>(3) Correct: the β particle loses energy (e.g. by ionizing the surrounding gas), so its momentum and hence r decrease.<br>Answer <b>B</b>.","C":"軌跡半徑 r = mv/(qB) = p/(qB)。在均勻磁場中 B 不變，軌跡向內螺旋表示 p 減小。<br>(1) 不正確：若 B 不垂直於 v，軌跡會是半徑不變的螺旋線，而不是向內收窄。<br>(2) 不正確：β 粒子是電子，其電荷和質量不變。<br>(3) 正確：β 粒子失去能量（例如使周圍氣體電離），動量減小，r 隨之減小。<br>答案 <b>B</b>。"}},{"id":"1A-2024-32","p":"1A","s":2024,"n":"32","t":"nuc","x":true,"a":"D","pub":"Pearson","ex":{"E":"Read the ratio 2 : 1 as A<sub>X</sub> : A<sub>Y</sub> (the remark in brackets is confusing; the options only work this way). X starts with twice the activity of Y but they are equal after 1 day, so X decays faster: t<sub>1</sub> &lt; t<sub>2</sub>.<br>Write A = A<sub>0</sub>e<sup>−kt</sup> with k = ln 2 / t<sub>half</sub>: 2e<sup>−k<sub>1</sub>(1)</sup> = e<sup>−k<sub>2</sub>(1)</sup> ⇒ e<sup>k<sub>1</sub> − k<sub>2</sub></sup> = 2 ⇒ k<sub>1</sub> − k<sub>2</sub> = ln 2 ⇒ ln 2/t<sub>1</sub> − ln 2/t<sub>2</sub> = ln 2 ⇒ 1/t<sub>1</sub> = 1/t<sub>2</sub> + 1.<br>Answer <b>D</b>.","C":"把 2 : 1 理解為 A<sub>X</sub> : A<sub>Y</sub>（括號內的說明容易令人混淆，選項只有這樣理解才成立）。X 的初始放射強度是 Y 的兩倍，1 日後兩者相等，所以 X 衰變較快：t<sub>1</sub> &lt; t<sub>2</sub>。<br>設 A = A<sub>0</sub>e<sup>−kt</sup>，k = ln 2 / 半衰期：2e<sup>−k<sub>1</sub>(1)</sup> = e<sup>−k<sub>2</sub>(1)</sup> ⇒ e<sup>k<sub>1</sub> − k<sub>2</sub></sup> = 2 ⇒ k<sub>1</sub> − k<sub>2</sub> = ln 2 ⇒ ln 2/t<sub>1</sub> − ln 2/t<sub>2</sub> = ln 2 ⇒ 1/t<sub>1</sub> = 1/t<sub>2</sub> + 1。<br>答案 <b>D</b>。"}},{"id":"1A-2024-33","p":"1A","s":2024,"n":"33","t":"nuc","x":true,"a":"B","pub":"Pearson"},{"id":"P2-2024-11","p":"P2","s":2024,"n":"1.1","t":"ast","x":false,"a":"A","pub":"Pearson"},{"id":"P2-2024-12","p":"P2","s":2024,"n":"1.2","t":"ast","x":false,"a":"C","pub":"Pearson","ex":{"E":"(1) Correct: during retrograde motion Mars appears to move westward against the background stars (normally it drifts eastward).<br>(2) Incorrect: Mars never slows down. It always moves slower than the Earth; the apparent backward motion happens when the Earth overtakes it.<br>(3) Correct: in the middle of the retrograde loop Mars is at opposition — the Sun, the Earth and Mars line up.<br>Answer <b>C</b>.","C":"(1) 正確：逆行期間，火星相對背景恆星看似向西移動（平時向東移）。<br>(2) 不正確：火星沒有減速，它一直比地球慢；地球「追越」火星時才出現看似倒退的情況。<br>(3) 正確：逆行中段時火星處於「衝」，太陽、地球和火星成一直線。<br>答案 <b>C</b>。"}},{"id":"P2-2024-13","p":"P2","s":2024,"n":"1.3","t":"ast","x":false,"a":"A","pub":"Pearson"},{"id":"P2-2024-14","p":"P2","s":2024,"n":"1.4","t":"ast","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2024-15","p":"P2","s":2024,"n":"1.5","t":"ast","x":false,"a":"B","pub":"Pearson"},{"id":"P2-2024-16","p":"P2","s":2024,"n":"1.6","t":"ast","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2024-17","p":"P2","s":2024,"n":"1.7","t":"ast","x":false,"a":"D","pub":"Pearson","ex":{"E":"(1) Correct: white dwarfs are hot (typically ≳ 10 000 K), hotter than the Sun (≈ 5800 K), even though they are dim.<br>(2) Correct: blue giants are giant stars with surface temperatures well above the Sun's.<br>(3) Correct: supergiants are at the top of the H–R diagram, far more luminous than the Sun.<br>Answer <b>D</b>.","C":"(1) 正確：白矮星雖然暗淡，但表面温度高（一般 ≳ 10 000 K），比太陽（約 5800 K）熱。<br>(2) 正確：藍巨星屬巨星，表面温度遠高於太陽。<br>(3) 正確：超巨星位於赫羅圖頂部，光度遠大於太陽。<br>答案 <b>D</b>。"}},{"id":"P2-2024-18","p":"P2","s":2024,"n":"1.8","t":"ast","x":false,"a":"B","pub":"Pearson","ex":{"E":"Wien's law: λ<sub>max</sub>T = constant. The two curves peak at the same wavelength ⇒ same surface temperature ⇒ same colour. So (1) and (3) are incorrect.<br>With the same temperature, every square metre emits the same spectrum; P's curve is higher at every wavelength, so P must have a larger surface area, i.e. a larger radius ⇒ (2) correct.<br>Answer <b>B</b>.","C":"維恩定律：λ<sub>max</sub>T = 常數。兩條曲線在同一波長達到峰值 ⇒ 表面温度相同 ⇒ 顏色相同，所以 (1) 和 (3) 不正確。<br>温度相同時，每平方米表面發出的光譜相同；P 的曲線在每個波長都較高，表示 P 的表面積較大，即半徑較大 ⇒ (2) 正確。<br>答案 <b>B</b>。"}},{"id":"P2-2024-21","p":"P2","s":2024,"n":"2.1","t":"atom","x":false,"a":"D","pub":"Pearson","ex":{"E":"A β particle is an electron, which is very light. Its mass is about the same as that of the electrons in the gold atoms, so it can be strongly deflected by those electrons, and of course also by the heavy, highly charged gold nuclei.<br>Answer <b>D</b>.","C":"β 粒子即電子，質量很小，與金原子中的電子相若，所以會被這些電子大幅偏轉，亦會被質量大、電荷多的金原子核大幅偏轉。<br>答案 <b>D</b>。"}},{"id":"P2-2024-22","p":"P2","s":2024,"n":"2.2","t":"atom","x":false,"a":"B","pub":"Pearson","ex":{"E":"(1) Incorrect: the helium atoms absorb light of certain wavelengths, but they re-emit it in all directions, so the light at these wavelengths in the forward direction is only <b>partly</b> removed — the lines are dark compared with the background, not completely black.<br>(2) Correct: that is exactly why the lines look dark.<br>(3) Incorrect: each element has its own set of energy levels and hence its own line spectrum; neon gives a different set of lines.<br>Answer <b>B</b>.","C":"(1) 不正確：氦原子吸收某些波長的光，但會向四方八面重新發射，所以原方向上這些波長的光只被<b>部分</b>減弱，暗線只是比背景暗，並非全黑。<br>(2) 正確：這正是暗線出現的原因。<br>(3) 不正確：每種元素有獨特的能級，所以有獨特的線狀光譜；換成氖蒸氣會看到另一組暗線。<br>答案 <b>B</b>。"}},{"id":"P2-2024-23","p":"P2","s":2024,"n":"2.3","t":"atom","x":false,"a":"A","pub":"Pearson","ex":{"E":"Absorbing λ<sub>1</sub> takes the atom from n = 2 up to X. It then emits λ<sub>2</sub> &lt; λ<sub>1</sub>, i.e. a photon with <b>more</b> energy than the one absorbed. So it falls below its starting level n = 2. The only level below n = 2 is the ground state.<br>Answer <b>A</b>.","C":"原子吸收 λ<sub>1</sub> 後由 n = 2 躍遷至 X，然後發射 λ<sub>2</sub> &lt; λ<sub>1</sub> 的光子，即光子能量比吸收的<b>更大</b>，所以原子會降至比原來 n = 2 更低的能級，唯一可能是基態。<br>答案 <b>A</b>。"}},{"id":"P2-2024-24","p":"P2","s":2024,"n":"2.4","t":"atom","x":false,"a":"B","pub":"Pearson"},{"id":"P2-2024-25","p":"P2","s":2024,"n":"2.5","t":"atom","x":false,"a":"C","pub":"Pearson","ex":{"E":"Same de Broglie wavelength ⇒ same momentum p = h/λ, so (2) is incorrect.<br>(1) Correct: p = mv and the proton is about 1840 times heavier, so it is much slower.<br>(3) Correct: KE = p<sup>2</sup>/(2m); with the same p, the heavier proton has less KE.<br>Answer <b>C</b>.","C":"德布羅意波長相同 ⇒ 動量 p = h/λ 相同，所以 (2) 不正確。<br>(1) 正確：p = mv，質子質量約為電子的 1840 倍，速率小得多。<br>(3) 正確：動能 = p<sup>2</sup>/(2m)，p 相同時，質量較大的質子動能較小。<br>答案 <b>C</b>。"}},{"id":"P2-2024-26","p":"P2","s":2024,"n":"2.6","t":"atom","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2024-27","p":"P2","s":2024,"n":"2.7","t":"atom","x":false,"a":"C","pub":"Pearson","ex":{"E":"(1) Incorrect: an STM does not form an image with lenses, so the Rayleigh criterion does not apply. Its resolution comes from the very sharp tip and the strong dependence of the tunnelling current on the tip–surface gap.<br>(2) Correct: a tunnelling current must flow between the tip and the specimen, so the surface must conduct electricity.<br>(3) Correct: it only maps the surface; it cannot see inside the specimen.<br>Answer <b>C</b>.","C":"(1) 不正確：掃描隧道顯微鏡並不用透鏡成像，所以不受瑞利判據限制。它的解像能力來自極尖的探針，以及隧穿電流對探針與表面距離的高度敏感。<br>(2) 正確：探針與樣本之間須有隧穿電流，所以樣本表面必須導電。<br>(3) 正確：它只能描繪表面，不能看到樣本內部。<br>答案 <b>C</b>。"}},{"id":"P2-2024-28","p":"P2","s":2024,"n":"2.8","t":"atom","x":false,"a":"A","pub":"Pearson","ex":{"E":"Nanoscale means about 1–100 nm.<br>(1) The DNA double helix is about 2 nm wide ✓.<br>(2) An α particle (a helium nucleus) is about 10<sup>−15</sup> m across — far smaller than 1 nm ✗.<br>(3) A sheet of paper is about 0.1 mm = 10<sup>5</sup> nm thick ✗.<br>Answer <b>A</b>.","C":"納米尺度約為 1–100 nm。<br>(1) DNA 雙螺旋闊約 2 nm ✓。<br>(2) α 粒子（氦原子核）直徑約 10<sup>−15</sup> m，遠小於 1 nm ✗。<br>(3) 一張紙厚約 0.1 mm = 10<sup>5</sup> nm ✗。<br>答案 <b>A</b>。"}},{"id":"P2-2024-31","p":"P2","s":2024,"n":"3.1","t":"energy","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2024-32","p":"P2","s":2024,"n":"3.2","t":"energy","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2024-33","p":"P2","s":2024,"n":"3.3","t":"energy","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2024-34","p":"P2","s":2024,"n":"3.4","t":"energy","x":false,"a":"B","pub":"Pearson","ex":{"E":"Follow the refrigerant: it leaves the outdoor condenser as a high-pressure liquid, passes through P and enters the indoor evaporator, where it must be cold and at low pressure. So P is the <b>expansion valve</b>.<br>Q is between the evaporator and the condenser, so Q is the <b>compressor</b>. Compression does work on the vapour, so the refrigerant leaving Q is the hottest in the cycle.<br>Answer <b>B</b>.","C":"沿製冷劑流向分析：它離開室外的冷凝器時是高壓液體，經 P 進入室內的蒸發器，此時必須是低温低壓，所以 P 是<b>膨脹閥</b>。<br>Q 位於蒸發器與冷凝器之間，所以 Q 是<b>壓縮機</b>。壓縮對蒸氣做功，離開 Q 的製冷劑温度最高。<br>答案 <b>B</b>。"}},{"id":"P2-2024-35","p":"P2","s":2024,"n":"3.5","t":"energy","x":false,"a":"A","pub":"Pearson","ex":{"E":"In the steady state the same energy flows per second through both layers: P<sub>P</sub> = P<sub>Q</sub>, so (3) is incorrect.<br>P = UAΔT with the same A: ΔT<sub>P</sub> &gt; ΔT<sub>Q</sub> ⇒ U<sub>P</sub> &lt; U<sub>Q</sub>, so (2) is incorrect.<br>U = κ/d: U<sub>P</sub> &lt; U<sub>Q</sub> and d<sub>P</sub> &lt; d<sub>Q</sub> ⇒ κ<sub>P</sub> &lt; κ<sub>Q</sub>, so the thermal conductivities differ and the materials must be different: (1) correct.<br>Answer <b>A</b>.","C":"穩定狀態下，每秒通過兩層的能量相同：P<sub>P</sub> = P<sub>Q</sub>，所以 (3) 不正確。<br>P = UAΔT，A 相同：ΔT<sub>P</sub> &gt; ΔT<sub>Q</sub> ⇒ U<sub>P</sub> &lt; U<sub>Q</sub>，所以 (2) 不正確。<br>U = κ/d：U<sub>P</sub> &lt; U<sub>Q</sub> 而 d<sub>P</sub> &lt; d<sub>Q</sub> ⇒ κ<sub>P</sub> &lt; κ<sub>Q</sub>，兩者熱導率不同，物料必定不同：(1) 正確。<br>答案 <b>A</b>。"}},{"id":"P2-2024-36","p":"P2","s":2024,"n":"3.6","t":"energy","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2024-37","p":"P2","s":2024,"n":"3.7","t":"energy","x":false,"a":"B","pub":"Pearson","ex":{"E":"(1) Correct: regenerative braking turns the vehicle's KE (and PE when going downhill) into electrical energy to charge the battery.<br>(2) Incorrect: at full power both the engine and the battery-driven motor drive the wheels, so the battery discharges.<br>(3) Correct: when cruising, the engine can run a generator that recharges the battery.<br>Answer <b>B</b>.","C":"(1) 正確：再生制動把汽車的動能（下坡時還有勢能）轉化為電能，為電池充電。<br>(2) 不正確：全力加速時，引擎和由電池驅動的電動機一同推動車輪，電池在放電。<br>(3) 正確：勻速行駛時，引擎可帶動發電機為電池充電。<br>答案 <b>B</b>。"}},{"id":"P2-2024-38","p":"P2","s":2024,"n":"3.8","t":"energy","x":false,"a":"A","pub":"Pearson"},{"id":"P2-2024-41","p":"P2","s":2024,"n":"4.1","t":"med","x":false,"a":"B","pub":"Pearson"},{"id":"P2-2024-42","p":"P2","s":2024,"n":"4.2","t":"med","x":false,"a":"D","pub":"Pearson"},{"id":"P2-2024-43","p":"P2","s":2024,"n":"4.3","t":"med","x":false,"a":"A","pub":"Pearson","ex":{"E":"(1) Incorrect: notes on the same curve have the same <b>loudness</b> (phons), not the same intensity level — the ear is less sensitive at low and very high frequencies, so those notes need a higher intensity level.<br>(2) Incorrect: phons equal decibels only at <b>1000 Hz</b>, the reference frequency.<br>(3) Correct: the 0 phon curve is the threshold of hearing; notes below it cannot be heard.<br>Answer <b>A</b>.","C":"(1) 不正確：同一曲線上的聲音<b>響度</b>（方）相同，聲強級並不相同——人耳對低頻和極高頻聲音較不敏感，須較高的聲強級。<br>(2) 不正確：只有在參考頻率 <b>1000 Hz</b> 時，方值才等於分貝值。<br>(3) 正確：0 方曲線即聽覺閾，位於其下方的聲音聽不到。<br>答案 <b>A</b>。"}},{"id":"P2-2024-44","p":"P2","s":2024,"n":"4.4","t":"med","x":false,"a":"A","pub":"Pearson","ex":{"E":"(1) Correct: instruments such as forceps can pass through the tool channel to take a biopsy.<br>(2) Correct: the endoscope enters through the mouth (a natural opening) so the stomach lining can be viewed directly.<br>(3) Incorrect: the endoscope is inserted into the body, so it is (minimally) invasive.<br>Answer <b>A</b>.","C":"(1) 正確：可經工具管道放入鉗子等器械抽取組織樣本。<br>(2) 正確：內窺鏡經口腔（天然開口）進入，可直接觀察胃壁。<br>(3) 不正確：內窺鏡要放入體內，屬（微創）入侵性檢查。<br>答案 <b>A</b>。"}},{"id":"P2-2024-45","p":"P2","s":2024,"n":"4.5","t":"med","x":false,"a":"C","pub":"Pearson"},{"id":"P2-2024-46","p":"P2","s":2024,"n":"4.6","t":"med","x":false,"a":"B","pub":"Pearson"},{"id":"P2-2024-47","p":"P2","s":2024,"n":"4.7","t":"med","x":false,"a":"C","pub":"Pearson","ex":{"E":"A tracer for lung ventilation should:<br>• emit γ radiation, which can leave the body and reach the detector, and ionizes least (rules out A and B);<br>• be cleared from the lungs quickly (short biological half-life), because it is breathed out;<br>• have a physical half-life long enough for transport and the scan, but not months (rules out D).<br>C (5 days, 30 s, γ) fits — e.g. xenon-133 gas.<br>Answer <b>C</b>.","C":"用於肺部通氣檢查的示蹤劑應：<br>• 發射 γ 輻射，能穿出身體到達探測器，而且電離能力最弱（排除 A 和 B）；<br>• 很快被呼出，生物半衰期短；<br>• 物理半衰期足夠運送和掃描之用，但不應長達數月（排除 D）。<br>C（5 日、30 秒、γ）最合適，例如氙-133 氣體。<br>答案 <b>C</b>。"}},{"id":"P2-2024-48","p":"P2","s":2024,"n":"4.8","t":"med","x":false,"a":"D","pub":"Pearson","ex":{"E":"(1) Incorrect: the radiotracer inside the patient emits the γ rays; the gamma camera only <b>detects</b> them.<br>(2) Incorrect: an abnormal organ may show either a hot spot (more uptake) or a cold spot (less uptake).<br>(3) Incorrect: radionuclide images have <b>poor</b> resolution; they detect disease early because they show the organ's <b>function</b>, which often changes before its structure.<br>All three are incorrect → <b>D</b>.","C":"(1) 不正確：γ 射線由病人體內的放射性示蹤劑發出，伽瑪照相機只負責<b>探測</b>。<br>(2) 不正確：器官異常可呈現為熱點（攝取較多）或冷點（攝取較少）。<br>(3) 不正確：放射性核素造影的解像度<b>低</b>；它能及早發現疾病，是因為它顯示器官的<b>功能</b>，而功能往往比結構更早出現變化。<br>三項都不正確 → <b>D</b>。"}},{"id":"OA-2023S2-01","p":"1A","s":2023,"n":"1","t":"heat","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"Cold air is denser than warm air, so the cold air in the open cabinet stays at the bottom around the food instead of rising and mixing with the warm room air. With convection negligible, little heat reaches the food (air is also a poor conductor).<br>Answer <b>C</b>.","C":"冷空氣密度較大，會留在開放式雪櫃底部、包圍食物，不會上升與室內暖空氣混合。對流微不足道，傳到食物的熱很少（空氣亦是熱的不良導體）。<br>答案 <b>C</b>。"}},{"id":"OA-2023S2-02","p":"1A","s":2023,"n":"2","t":"heat","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"Same heater power P for both. Slope of the temperature–time graph = P/C, where C is the heat capacity. X has the smaller slope, so X has the larger heat capacity.<br>The masses are unknown, so the specific heat capacities (c = C/m) cannot be compared.<br>Answer <b>D</b>.","C":"兩者加熱功率 P 相同。温度—時間線圖的斜率 = P/C，C 為熱容量。X 的斜率較小，故 X 的熱容量較大。<br>質量未知，所以不能比較比熱容量（c = C/m）。<br>答案 <b>D</b>。"}},{"id":"OA-2023S2-03","p":"1A","s":2023,"n":"3","t":"heat","x":true,"a":"D","pub":"OUP","st":2,"ex":{"E":"c<sub>rms</sub> ∝ √T where T is in <b>kelvin</b>. At t = 0, T = 0 °C = 273 K, so v is not zero. As T (K) = 273 + kt rises linearly, v = constant × √(273 + kt) increases with a decreasing slope.<br>The graph that starts above zero and curves downward is <b>D</b>.","C":"方均根速率 c<sub>rms</sub> ∝ √T，T 以<b>開爾文</b>為單位。t = 0 時 T = 0 °C = 273 K，v 不為零。T (K) = 273 + kt 線性上升，v = 常數 × √(273 + kt) 增加，但斜率逐漸變小。<br>由非零值開始、向下彎曲的線圖是 <b>D</b>。"}},{"id":"OA-2023S2-04","p":"1A","s":2023,"n":"4","t":"mech","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"Let the radius be r and the common average speed be s. Path of X = πr, path of Y = 2r, so the times are πr/s and 2r/s.<br>Both have the same displacement PQ = 2r. Average velocity = displacement/time: v<sub>X</sub> = 2r ÷ (πr/s) = 2s/π, v<sub>Y</sub> = 2r ÷ (2r/s) = s.<br>v<sub>X</sub> : v<sub>Y</sub> = 2 : π.<br>Answer <b>A</b>.","C":"設半徑為 r，平均速率同為 s。X 的路程 = πr，Y 的路程 = 2r，所需時間分別為 πr/s 和 2r/s。<br>兩者位移同為 PQ = 2r。平均速度 = 位移/時間：v<sub>X</sub> = 2r ÷ (πr/s) = 2s/π，v<sub>Y</sub> = 2r ÷ (2r/s) = s。<br>v<sub>X</sub> : v<sub>Y</sub> = 2 : π。<br>答案 <b>A</b>。"}},{"id":"OA-2023S2-05","p":"1A","s":2023,"n":"5","t":"mech","x":false,"a":"D","pub":"OUP","st":2,"ex":{"E":"Slopes of the v–t graph: Peter a = (10 − 0)/4 = 2.5 m s<sup>−2</sup>; John a = (−5 − 5)/4 = −2.5 m s<sup>−2</sup>. Same magnitude → D must be correct.<br>A ✗: at t = 1 s their <b>velocities</b> are equal, not their positions. B ✗: we do not know whether John starts in front of or behind Peter, so the separation cannot be determined. C ✗: after t = 2 s John's velocity is also positive, so they run in the same direction.<br>Answer <b>D</b>.","C":"v–t 線圖的斜率：志威 a = (10 − 0)/4 = 2.5 m s<sup>−2</sup>；仲熙 a = (−5 − 5)/4 = −2.5 m s<sup>−2</sup>。加速度量值相同 → D 必定正確。<br>A ✗：t = 1 s 時兩者<b>速度</b>相同，並非位置相同。B ✗：不知道仲熙在志威前方還是後方，不能判斷距離。C ✗：t = 2 s 後仲熙的速度亦為正，兩人同向奔跑。<br>答案 <b>D</b>。"}},{"id":"OA-2023S2-06","p":"1A","s":2023,"n":"6","t":"mech","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"The incline is smooth, so the acceleration a is uniform. Let LN = 2s.<br>L to N: v<sup>2</sup> = u<sup>2</sup> + 2a(2s) ⇒ 2as = (v<sup>2</sup> − u<sup>2</sup>)/2.<br>L to M: v<sub>M</sub><sup>2</sup> = u<sup>2</sup> + 2as = u<sup>2</sup> + (v<sup>2</sup> − u<sup>2</sup>)/2 = (u<sup>2</sup> + v<sup>2</sup>)/2.<br>v<sub>M</sub> = √[(u<sup>2</sup> + v<sup>2</sup>)/2].<br>Answer <b>C</b>.","C":"斜面光滑，加速度 a 均勻。設 LN = 2s。<br>L 至 N：v<sup>2</sup> = u<sup>2</sup> + 2a(2s) ⇒ 2as = (v<sup>2</sup> − u<sup>2</sup>)/2。<br>L 至 M：v<sub>M</sub><sup>2</sup> = u<sup>2</sup> + 2as = (u<sup>2</sup> + v<sup>2</sup>)/2。<br>v<sub>M</sub> = √[(u<sup>2</sup> + v<sup>2</sup>)/2]。<br>答案 <b>C</b>。"}},{"id":"OA-2023S2-07","p":"1A","s":2023,"n":"7","t":"mech","x":false,"a":"C","pub":"OUP","st":2,"ex":{"E":"Q is at rest, so the tension T = mg (P and Q have the same mass m). The component of P's weight down the slope is only mg sin θ &lt; mg = T, so P tends to slide <b>up</b> the slope and friction acts <b>down</b> the slope.<br>Forces on P: weight (vertically down), normal force (perpendicular to the slope), tension (up the slope) and friction (down the slope).<br>Answer <b>C</b>.","C":"Q 靜止，張力 T = mg（P 和 Q 質量相同）。P 的重量沿斜面向下的分量只有 mg sin θ &lt; mg = T，所以 P 有沿斜面<b>向上</b>滑的趨勢，摩擦力沿斜面<b>向下</b>。<br>作用在 P 的力：重量（豎直向下）、法向力（垂直於斜面）、張力（沿斜面向上）、摩擦力（沿斜面向下）。<br>答案 <b>C</b>。"}},{"id":"OA-2023S2-08","p":"1A","s":2023,"n":"8","t":"mech","x":false,"a":"A","pub":"OUP","st":2,"ex":{"E":"Whole system (3 kg): a = (9 − 3)/3 = 2 m s<sup>−2</sup> to the right.<br>The only
